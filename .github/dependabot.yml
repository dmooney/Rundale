version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/limerick"
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 2
    commit-message:
      { prefix: "chore(deps)", prefix-development: "chore(deps-dev)" }
    labels: ["dependencies", "infra"]
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
      cargo-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(deps)" }
    labels: ["dependencies", "infra"]
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # The Rust compiler version is managed via rust-toolchain.toml (the
      # rust-toolchain ecosystem below), NOT by bumping this action's ref.
      # dtolnay encodes the toolchain version in the @ref and pre-publishes
      # future-version branches (e.g. 1.100.0), so letting Dependabot bump it
      # here installs an unreleased compiler -> rustup 404 (see closed #1312).
      - dependency-name: "dtolnay/rust-toolchain"

  # Rust toolchain: bumps rust-toolchain.toml `channel` to newly-released
  # toolchains only (real stable releases, not dtolnay's future branches).
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 1
    commit-message: { prefix: "chore(deps)" }
    labels: ["dependencies", "infra"]

  - package-ecosystem: "npm"
    directories:
      ["/", "/limerick/apps/ui", "/promptfoo", "/promptfoo/bench-site"]
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 2
    commit-message:
      { prefix: "chore(deps)", prefix-development: "chore(deps-dev)" }
    labels: ["dependencies", "infra"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "pip"
    directories: ["/", "/rundale-bench"]
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 2
    commit-message:
      { prefix: "chore(deps)", prefix-development: "chore(deps-dev)" }
    labels: ["dependencies", "infra"]
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "docker"
    directories: ["/.devcontainer", "/deploy"]
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(deps)" }
    labels: ["dependencies", "infra"]
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
