version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/parish"
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 5
    commit-message:
      { prefix: "chore(deps)", prefix-development: "chore(deps-dev)" }
    labels: ["dependencies", "infra"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    labels: ["dependencies", "infra"]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories:
      ["/", "/parish/apps/ui", "/promptfoo", "/rundale-bench/bench-site"]
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 5
    commit-message:
      { prefix: "chore(deps)", prefix-development: "chore(deps-dev)" }
    labels: ["dependencies", "infra"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directories: ["/", "/rundale-bench"]
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 3
    commit-message:
      { prefix: "chore(deps)", prefix-development: "chore(deps-dev)" }
    labels: ["dependencies", "infra"]
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/.devcontainer", "/deploy"]
    schedule:
      { interval: "weekly", day: "monday", time: "06:17", timezone: "Etc/UTC" }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    labels: ["dependencies", "infra"]
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
