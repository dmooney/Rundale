name: Security audit

on:
  # Daily sweep catches newly-published advisories against existing deps.
  # Offset minute to avoid top-of-hour runner contention.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  # Dependency-changing PRs must prove the audit before merge; otherwise a new
  # advisory can leave main red while the fast/full CI workflows remain green.
  pull_request:
    paths:
      - "limerick/Cargo.lock"
      - "limerick/Cargo.toml"
      - "limerick/crates/**/Cargo.toml"
      - ".github/workflows/audit.yml"
  # Re-audit immediately when the dependency tree changes on main, so we
  # don't wait up to 24h to notice a bad lockfile bump.
  push:
    branches: [main]
    paths:
      - "limerick/Cargo.lock"
      - "limerick/Cargo.toml"
      - "limerick/crates/**/Cargo.toml"
      - ".github/workflows/audit.yml"

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: limerick

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Channel from rust-toolchain.toml (same as ci.yml). Caching stays in the
      # Swatinem step below.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      # Caches ~/.cargo/bin so cargo-audit does not recompile each run.
      # cache-targets: false — there is no workspace target/ to preserve.
      - name: Cache cargo-audit binary and advisory DB
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: audit

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        run: cargo audit

      # Every cargo command fetches git sources, including their submodules,
      # and cloud sessions' proxy blocks some git hosts (#2270). Keep the
      # lockfile on crates.io, and prove each supported compilation target
      # still resolves from it.
      - name: Verify supported targets resolve from crates.io only
        shell: bash
        run: |
          set -euo pipefail
          if grep -n '^source = "git+' Cargo.lock; then
            echo "error: Cargo.lock has git sources; use crates.io releases"
            exit 1
          fi
          targets=(
            "aarch64-apple-darwin"
            "x86_64-apple-darwin"
            "x86_64-pc-windows-msvc"
            "x86_64-unknown-linux-gnu"
          )

          for target in "${targets[@]}"; do
            cargo tree --locked --workspace --target "$target" >/dev/null
          done
