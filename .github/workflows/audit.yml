name: Security audit

on:
  # Daily sweep catches newly-published advisories against existing deps.
  # Offset minute to avoid top-of-hour runner contention.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  # Dependency-changing PRs must prove the audit before merge; otherwise a new
  # advisory can leave main red while the fast/full CI workflows remain green.
  pull_request:
    paths:
      - "parish/Cargo.lock"
      - "parish/Cargo.toml"
      - "parish/crates/**/Cargo.toml"
      - ".github/workflows/audit.yml"
  # Re-audit immediately when the dependency tree changes on main, so we
  # don't wait up to 24h to notice a bad lockfile bump.
  push:
    branches: [main]
    paths:
      - "parish/Cargo.lock"
      - "parish/Cargo.toml"
      - "parish/crates/**/Cargo.toml"
      - ".github/workflows/audit.yml"

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: parish

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Channel from rust-toolchain.toml (same as ci.yml). Caching stays in the
      # Swatinem step below.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false

      # Caches ~/.cargo/bin so cargo-audit does not recompile each run.
      # cache-targets: false — there is no workspace target/ to preserve.
      - name: Cache cargo-audit binary and advisory DB
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: audit

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        run: cargo audit

      # Cargo.lock retains xcap's Linux-only transitive dependencies even
      # though Parish enables xcap only on macOS and Windows. The exact git
      # pins in Cargo.toml therefore clear RustSec without changing a compiled
      # target. Fail before merge if that target-reachability invariant changes:
      # wayland-scanner's pinned tree contains unreleased breaking codegen.
      - name: Verify temporary lock-only pins stay unreachable
        shell: bash
        run: |
          set -euo pipefail
          packages=("xcb@1.7.0" "wayland-scanner@0.31.10")
          targets=(
            "aarch64-apple-darwin"
            "x86_64-apple-darwin"
            "x86_64-pc-windows-msvc"
            "x86_64-unknown-linux-gnu"
          )

          for target in "${targets[@]}"; do
            for package in "${packages[@]}"; do
              tree="$(cargo tree --locked --workspace --target "$target" -i "$package" 2>/dev/null)"
              if [[ -n "$tree" ]]; then
                echo "error: temporary security pin $package is reachable on $target"
                echo "$tree"
                exit 1
              fi
            done
          done
