name: Rundale CI

# Jobs run on GitHub-hosted `ubuntu-latest` runners.
#
# Fast lint/format lane for every change. Pull requests that touch runtime code,
# gameplay content, fixtures, or the runtime workflows additionally call the
# complete correctness suite in `full-ci.yml`. The aggregate `CI gate` remains
# the repository's single required branch-protection context.

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: limerick

env:
  CARGO_TERM_COLOR: always
  NO_PROXY: localhost,127.0.0.1,::1

permissions:
  contents: read

jobs:
  # Detect whether a pull request can affect the shipped runtime or its
  # acceptance sensors. Runtime changes opt into the complete reusable suite.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      # A lane runs unless the path filter or the docs-only check says it can be
      # skipped. Empty outputs (non-PR events, where both steps are skipped)
      # mean "run".
      runtime: ${{ steps.filter.outputs.runtime == 'false' && 'false' || steps.nondoc.outputs.nondoc == 'false' && 'false' || 'true' }}
      differential: ${{ steps.filter.outputs.differential == 'false' && 'false' || steps.nondoc.outputs.nondoc == 'false' && 'false' || 'true' }}
      promptfoo: ${{ steps.filter.outputs.promptfoo == 'false' && 'false' || steps.nondoc.outputs.nondoc == 'false' && 'false' || 'true' }}
      bench_site: ${{ steps.filter.outputs.bench_site == 'false' && 'false' || steps.nondoc.outputs.nondoc == 'false' && 'false' || 'true' }}
      swift: ${{ steps.filter.outputs.swift == 'false' && 'false' || steps.nondoc.outputs.nondoc == 'false' && 'false' || 'true' }}
      # The golden frames are Markdown, so a change to them is not docs-only.
      linux_host: ${{ steps.filter.outputs.linux_host == 'false' && 'false' || (steps.nondoc.outputs.nondoc == 'false' && steps.filter.outputs.linux_host_goldens != 'true') && 'false' || 'true' }}
      bug_report: ${{ steps.filter.outputs.bug_report == 'false' && 'false' || steps.nondoc.outputs.nondoc == 'false' && 'false' || 'true' }}
      endpoints: ${{ steps.filter.outputs.endpoints == 'false' && 'false' || steps.nondoc.outputs.nondoc == 'false' && 'false' || 'true' }}
      # Only pull requests are checked; other events report 'false'.
      mobile_app: ${{ github.event_name == 'pull_request' && steps.filter.outputs.mobile_app == 'true' && steps.nondoc.outputs.nondoc == 'true' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            runtime:
              - 'limerick/crates/**'
              - 'limerick/apps/ui/**'
              - 'limerick/Cargo.toml'
              - 'limerick/Cargo.lock'
              - 'limerick/config/**'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              # Read by limerick-core's endpoint_calls and limerick-mobile-ffi's
              # header test, which run only here, not in the Mac mobile gate.
              - 'mobile/endpoint/**'
              - 'mobile/RundaleBridge/Sources/LimerickMobileFFI/include/**'
              - 'limerick/testing/**'
              - 'limerick/scripts/**'
              - 'limerick/justfile'
              - 'limerick/.config/nextest.toml'
              - 'mods/**'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/full-ci.yml'
              - '.github/actions/install-tauri-deps/**'
            # Anything compiled into limerick-server / limerick-engine, the
            # content and fixtures they run, and the differential tooling.
            differential:
              - 'limerick/crates/**'
              - 'limerick/Cargo.toml'
              - 'limerick/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'mods/**'
              - 'limerick/testing/fixtures/**'
              - 'limerick/scripts/proof/**'
              - '.github/scripts/prove-diff-comment.sh'
              - '.github/workflows/ci.yml'
            promptfoo:
              - 'promptfoo/**'
              - '.github/workflows/ci.yml'
            bench_site:
              - 'promptfoo/bench-site/**'
              - 'promptfoo/leaderboard/**'
              - '.github/workflows/ci.yml'
            swift:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
            # The Linux host, the session packages and engine it links, and the
            # world and Endpoint fixtures its golden frames play.
            linux_host:
              - 'tools/linux-host/**'
              - 'mobile/RundaleSession/**'
              - 'mobile/RundaleKit/**'
              - 'mobile/RundaleBridge/**'
              - 'mobile/LimerickEndpointKit/**'
              - 'mobile/endpoint/**'
              - 'mobile/.swiftlint.yml'
              - 'mobile/.swiftformat'
              - 'mobile/scripts/install-swift-tools.sh'
              - 'mods/**'
              - 'limerick/crates/**'
              - 'limerick/Cargo.toml'
              - 'limerick/Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            linux_host_goldens:
              - 'tools/linux-host/Tests/**'
            # A recorded mobile-verify pass's inputs
            # (mobile/scripts/verify.py ATTESTATION_PATHSPECS).
            mobile_app:
              - 'mobile/**'
              - 'mods/**'
              - 'limerick/crates/**'
              - 'limerick/testing/**'
              - 'limerick/Cargo.toml'
              - 'limerick/Cargo.lock'
              - 'limerick/config/**'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'bug-report/test/fixtures/**'
              - '!**/AGENTS.md'
            bug_report:
              - 'bug-report/**'
              - '.github/workflows/ci.yml'
            # The workspace tests also read the Rundale definition files, the
            # canonical NPCs and places (rundale-intent-comparison), and the
            # mobile invocation examples and fixtures.
            endpoints:
              - 'endpoints/**'
              - 'mods/rundale/endpoints/**'
              - 'mods/rundale/npcs.json'
              - 'mods/rundale/world.json'
              - 'mobile/endpoint/**'
              - '.github/workflows/ci.yml'
      # Documentation-only pull requests never need the runtime lanes, even when
      # the Markdown sits inside a runtime directory (crates, mods, scripts).
      # `every` requires a changed file to match all patterns, so nondoc is true
      # only when at least one changed file is neither Markdown nor under docs/.
      # Mixed pull requests therefore still run every lane.
      - name: Docs-only detector
        id: nondoc
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            nondoc:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  agent-check:
    name: Evidence gate
    # Runtime-shipping changes (engine, mods, the iPhone app) must link their
    # evidence page, https://dmooney.github.io/rundale-pages/pr/<number>/, in
    # the PR body. Push events to main/develop are post-merge, so the gate
    # already ran on the PR that produced the commit. Dependabot-authored bumps
    # have no useful gameplay-proof signal, even when a coordinator refreshes
    # their branch and becomes the synchronize-event actor.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Check the evidence-page link in the PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash limerick/scripts/agent-check.sh --source=pr "$PR_NUMBER"

  docs-consistency:
    name: Docs and repository artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check cited paths exist
        working-directory: ${{ github.workspace }}
        run: ./limerick/scripts/check-doc-paths.sh

      - name: Check tracked repository artifacts
        working-directory: ${{ github.workspace }}
        run: ./limerick/scripts/check-repository-artifacts.sh

  format-quality:
    name: Docs/data formatting (Prettier + markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped tooling (configs + package.json live at the repo root, not in
    # limerick/ which is this workflow's global default working-directory).
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check (md/json/yaml)
        run: npm run format:check

      - name: Markdownlint
        run: npm run lint:md

      - name: Docs-format gate tests
        run: bash limerick/scripts/tests/check-docs-format.test.sh

      - name: Portfolio-governance unit tests
        run: node --test .github/scripts/*.test.cjs

  python-quality:
    name: Python quality (ruff, mypy, yamllint, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Root-scoped: pyproject.toml + requirements-dev.txt live at the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Yamllint
        run: yamllint .

      - name: Pytest
        run: pytest

      # Every tracked lockfile needs a dependabot.yml entry or a reasoned exclusion.
      # Runs on every pull request, so a new lockfile or an edited dependabot.yml
      # cannot skip it.
      - name: Dependabot lockfile coverage
        run: python3 scripts/check_dependabot_coverage.py

  promptfoo-quality:
    name: Promptfoo keyless end-to-end
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.promptfoo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: promptfoo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: promptfoo/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install promptfoo
        run: npm ci --ignore-scripts

      - name: Run offline seam tests
        run: npm test

      - name: Run keyless promptfoo dialogue
        run: npm run test:keyless

  # Builds the rundale-bench results site exactly as publish-bench-site.yml does
  # (without deploying), so a dependency bump that breaks the site fails here
  # instead of after merge.
  bench-site-build:
    name: Bench site build (astro check + build)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.bench_site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: promptfoo/bench-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: promptfoo/bench-site/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

  # limerick-bug-report, the iPhone app's private bug-report intake
  # (bug-report/, ADR-027): format, lint, typecheck, tests, and build.
  bug-report-quality:
    name: Bug-report service (format, lint, typecheck, tests, build)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.bug_report == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bug-report
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: bug-report/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  # Limerick Endpoints (endpoints/, a self-contained pnpm workspace): format,
  # lint, typecheck, tests, and build. Postgres and live-provider suites stay
  # opt-in and skip without their settings.
  endpoints-quality:
    name: Endpoints (format, lint, typecheck, tests, build)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.endpoints == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: endpoints
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: endpoints/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  shell-quality:
    name: Shell quality (shellcheck + shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped: `git ls-files '*.sh'` must run from the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          shellcheck -S warning "${shell_files[@]}"

      - name: shfmt (diff = fail)
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          shfmt -i 4 -ci -bn -d "${shell_files[@]}"

      - name: Proof-tooling unit tests
        run: |
          for t in limerick/scripts/tests/*.test.sh; do
            echo "== $t =="
            bash "$t"
          done

  # Actions bumps to workflows that never run on pull requests (release,
  # TestFlight, deploys, schedules, pull_request_target) are only checkable
  # statically: actionlint, then every remote action's inputs at its pinned ref.
  workflow-quality:
    name: Workflow quality (actionlint + action inputs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint

      - name: actionlint
        run: actionlint -color

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Remote action references and inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -r requirements-dev.txt
          python3 scripts/check_action_refs.py

  toml-quality:
    name: TOML quality (taplo fmt + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped: taplo.toml (with its exclude globs) lives at the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Taplo format check
        run: taplo fmt --check

      - name: Taplo lint
        run: taplo lint

  # SwiftLint, SwiftFormat, and the four Swift package suites with their
  # coverage floors (`mobile/scripts/verify.py --fast`). The Xcode app build and
  # simulator suites need the Rust XCFramework and run in `just mobile-verify`
  # (docs/agent/swift-quality-gates.md).
  swift-quality:
    name: Swift quality (lint, format, packages)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true'
    # The four Swift packages, SwiftLint and SwiftFormat run on Linux as on
    # macOS, so this lane needs no Mac (#2287). The image pins the Swift
    # release Xcode 26.6 ships (6.3.3), which the coverage baseline was
    # measured with; install-swift-tools.sh pins the Linux tool builds.
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Swift image has unzip but no Python or curl.
      - name: Install Python and curl
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 curl ca-certificates

      - name: Swift lint, format, and package tests
        run: python3 mobile/scripts/verify.py --fast

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-quality-report
          path: |
            mobile/.verification/verify.json
            mobile/.verification/verify.junit.xml
            mobile/.verification/summary.txt
            mobile/.verification/logs/
          if-no-files-found: warn
          retention-days: 14

  # The Linux host (tools/linux-host) plays the app's session logic against
  # the engine's Linux static library and compares Markdown frames with its
  # goldens. Frames are not app UI evidence (docs/agent/build-test.md).
  linux-host:
    name: Linux host golden frames
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.linux_host == 'true'
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Swift image has no Python, curl, or Rust; Cargo's build scripts
      # need a C compiler.
      - name: Install Python, curl, and a C toolchain
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 curl ca-certificates gcc libc6-dev

      # rustup installs rust-toolchain.toml's channel on the first cargo call.
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: limerick -> target

      - name: SwiftLint and SwiftFormat
        run: |
          bash mobile/scripts/install-swift-tools.sh
          cd tools/linux-host
          ../../mobile/.build/swift-tools/bin/swiftlint lint --strict --quiet
          ../../mobile/.build/swift-tools/bin/swiftformat --lint --config ../../mobile/.swiftformat --exclude .build .

      - name: Golden-frame tests
        run: bash tools/linux-host/run.sh --test

      - name: Upload frames that differ from the goldens
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-host-golden-actual
          path: tools/linux-host/.build/golden-actual/
          if-no-files-found: ignore
          retention-days: 14

  runtime-suite:
    name: Runtime correctness suite
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/full-ci.yml
    secrets: inherit

  # Builds main and this PR, runs the same live scenario (limerick-server
  # against a scripted model server) and every --script fixture on both, and
  # fails on any difference the PR body does not declare in a
  # `toml intended-diffs` block (docs/agent/agent-check.md).
  differential-proof:
    name: Differential proof
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.differential == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      # Both sides build into the cached target, sharing dependencies.
      CARGO_TARGET_DIR: ${{ github.workspace }}/limerick/target
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: limerick -> target
          shared-key: prove-diff

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMBER" --json body --jq .body >"$RUNNER_TEMP/pr-body.md"

      - name: Run the differential (main vs this PR)
        run: |
          python3 limerick/scripts/proof/prove_diff.py \
            --scenario talk-and-task \
            --intended-markdown "$RUNNER_TEMP/pr-body.md" \
            --out "$RUNNER_TEMP/prove-diff"

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/prove-diff/report.md"
          if [[ -f "$report" ]]; then
            head -c 900000 "$report" >>"$GITHUB_STEP_SUMMARY"
          fi
          bash .github/scripts/prove-diff-comment.sh "$report" "$PR_NUMBER" "$RUN_URL" \
            || echo "::warning::could not post the differential report comment"

      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prove-diff
          path: |
            ${{ runner.temp }}/prove-diff/report.md
            ${{ runner.temp }}/prove-diff/base/run*/
            ${{ runner.temp }}/prove-diff/head/run*/
          if-no-files-found: ignore
          retention-days: 14

  playwright-launcher-windows:
    name: Playwright launcher lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: limerick/apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Run built-in launcher lifecycle tests
        run: node --test scripts/playwright-worktree-server.test.js

  # ── Aggregate required-checks gate ─────────────────────────────────────────
  # Branch protection requires THIS single job. It aggregates the fast lane and
  # the conditional complete correctness suite for runtime changes.
  # The full simulator gate usually runs once on the author's Mac
  # (`just mobile-verify --phase all`, then `just mobile-verify-record`), and
  # this job finds that recorded pass for the PR's input tree. When none is
  # recorded, for example for a change made in a Linux cloud session, the job
  # runs `verify.py --smoke` on a pinned image and Xcode: every Mac gate
  # but the full UI suites and the Swift package suites (swift-quality runs
  # those on Linux), plus a few core-loop UI tests. The full UI
  # suites took most of an hour here, so they run on main instead, in
  # testflight.yml's nightly full gate. A PR labelled `mobile-verify-full`
  # (set before the push that should use it) runs the full gate here instead
  # and records its pass, to prove a change to the UI suites before merge.
  mobile-verify-recorded:
    name: Recorded mobile-verify pass
    needs: changes
    if: needs.changes.outputs.mobile_app == 'true'
    runs-on: macos-26
    # A recorded pass takes minutes; the smoke gate builds the Rust mobile
    # libraries and the app, then runs the unit and smoke UI tests. A labelled
    # full run took 75 minutes here, so the limits must cover the full gate.
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: read
      # Only a labelled full run records its pass.
      statuses: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      # The PR head's own code computes its input tree, as the author's run
      # did; the merge checkout's could list different paths after main
      # changes ATTESTATION_PATHSPECS.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Find a recorded pass for this input tree
        id: recorded
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'mobile-verify-full') }}
        # The record is usually posted right after the push, so keep looking
        # for a short while before running the gate here.
        # Exit 3: the PR leaves every app input unchanged, so no pass is needed.
        run: |
          status=0
          python3 mobile/scripts/verify_record.py check --pr "$PR_NUMBER" --wait 120 || status=$?
          if [ "$status" -eq 0 ] || [ "$status" -eq 3 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$FULL" = true ]; then
            echo "::notice::no recorded mobile-verify pass for this input tree; running the full gate here (mobile-verify-full)"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "args=--phase all" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no recorded mobile-verify pass for this input tree; running the smoke gate here"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "args=--smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 26.6
        if: steps.recorded.outputs.run == 'true'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Install the Rust toolchain and iOS targets
        if: steps.recorded.outputs.run == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install XcodeGen
        if: steps.recorded.outputs.run == 'true'
        run: brew install xcodegen

      # The iOS Rust libraries' target directory. The crates.io dependencies
      # are reused; a checkout makes the workspace's own sources newer than
      # their cached products, so those recompile.
      # A pull request restores its own last build, else main's (testflight.yml
      # saves one with each upload).
      - name: Restore the Rust mobile build
        id: rust-cache
        if: steps.recorded.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: mobile/.build/rust-mobile/cargo-target
          key: rust-mobile-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', 'limerick/Cargo.toml', 'limerick/Cargo.lock', 'limerick/crates/**') }}
          restore-keys: |
            rust-mobile-${{ runner.os }}-

      # The hosted runner has a few cores, not the 18 the default six
      # simulator workers were measured on: six clones there outran the
      # 30-minute command limit (#2276). A smoke pass is never recorded as a
      # full pass, so testflight.yml's nightly full gate runs on what this merges.
      # Tests whose result depends on machine speed run only in local runs
      # (verify.py TIME_SENSITIVE_TESTS).
      - name: Run the mobile-verify gate
        if: steps.recorded.outputs.run == 'true'
        env:
          RUNDALE_PARALLEL_WORKERS: "2"
          RUNDALE_COMMAND_TIMEOUT_MINUTES: "100"
          GATE_ARGS: ${{ steps.recorded.outputs.args }}
        # GATE_ARGS is `--smoke` or `--phase all`.
        run: |
          read -ra args <<< "$GATE_ARGS"
          python3 mobile/scripts/verify.py "${args[@]}" --skip-time-sensitive

      # Saved even when a later test fails: the Rust build finished first.
      - name: Save the Rust mobile build
        if: ${{ !cancelled() && steps.recorded.outputs.run == 'true' && steps.rust-cache.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: mobile/.build/rust-mobile/cargo-target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      # A labelled full pass counts as the author's recorded pass. A token that
      # cannot write statuses (Dependabot's) leaves the gate's result as is.
      - name: Record the full pass
        if: steps.recorded.outputs.args == '--phase all'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 mobile/scripts/verify_record.py record

      - name: Upload verification report
        if: always() && steps.recorded.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-verify-report
          path: |
            mobile/.verification/verify.json
            mobile/.verification/verify.junit.xml
            mobile/.verification/summary.txt
            mobile/.verification/logs/
          if-no-files-found: warn
          retention-days: 14

  ci-gate:
    name: CI gate
    needs:
      [
        changes,
        agent-check,
        bench-site-build,
        bug-report-quality,
        docs-consistency,
        endpoints-quality,
        format-quality,
        python-quality,
        playwright-launcher-windows,
        promptfoo-quality,
        shell-quality,
        swift-quality,
        linux-host,
        toml-quality,
        workflow-quality,
        runtime-suite,
        differential-proof,
        mobile-verify-recorded,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@v7

      - name: Require gated jobs to succeed or be skipped
        env:
          GATED_RESULTS: ${{ join(needs.*.result, ' ') }}
          PLAYWRIGHT_WINDOWS_RESULT: ${{ needs.playwright-launcher-windows.result }}
          RUNTIME_SUITE_REQUIRED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.runtime == 'true' }}
          RUNTIME_SUITE_RESULT: ${{ needs.runtime-suite.result }}
          DIFFERENTIAL_REQUIRED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.differential == 'true' }}
          DIFFERENTIAL_RESULT: ${{ needs.differential-proof.result }}
          MOBILE_VERIFY_REQUIRED: ${{ needs.changes.outputs.mobile_app }}
          MOBILE_VERIFY_RESULT: ${{ needs.mobile-verify-recorded.result }}
        run: bash .github/scripts/ci-gate.sh
