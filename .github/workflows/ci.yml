name: Rundale CI

# Jobs run on GitHub-hosted `ubuntu-latest` runners.
#
# Fast lint/format lane for every change. Pull requests that touch runtime code,
# gameplay content, fixtures, or the runtime workflows additionally call the
# complete correctness suite in `full-ci.yml`. The aggregate `CI gate` remains
# the repository's single required branch-protection context.

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: limerick

env:
  CARGO_TERM_COLOR: always
  NO_PROXY: localhost,127.0.0.1,::1

permissions:
  contents: read

jobs:
  # Detect whether a pull request can affect the shipped runtime or its
  # acceptance sensors. Runtime changes opt into the complete reusable suite.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      runtime: ${{ steps.filter.outputs.runtime || 'true' }}
      differential: ${{ steps.filter.outputs.differential || 'true' }}
      promptfoo: ${{ steps.filter.outputs.promptfoo || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            runtime:
              - 'limerick/crates/**'
              - 'limerick/apps/ui/**'
              - 'limerick/Cargo.toml'
              - 'limerick/Cargo.lock'
              - 'limerick/config/**'
              - 'rust-toolchain.toml'
              - 'limerick/testing/**'
              - 'limerick/scripts/**'
              - 'limerick/justfile'
              - 'limerick/.config/nextest.toml'
              - 'mods/**'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/full-ci.yml'
            # Anything compiled into limerick-server / limerick-engine, the
            # content and fixtures they run, and the differential tooling.
            differential:
              - 'limerick/crates/**'
              - 'limerick/Cargo.toml'
              - 'limerick/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'mods/**'
              - 'limerick/testing/fixtures/**'
              - 'limerick/scripts/proof/**'
              - '.github/scripts/prove-diff-comment.sh'
              - '.github/workflows/ci.yml'
            promptfoo:
              - 'promptfoo/**'
              - '.github/workflows/ci.yml'

  agent-check:
    name: Agent proof gate
    # Proof bundles live in the PR body by default; structured comments remain
    # a legacy fallback. Push events to main/develop are post-merge, so the gate
    # already ran on the PR that produced the commit. Dependabot-authored bumps
    # have no useful gameplay-proof signal, even when a coordinator refreshes
    # their branch and becomes the synchronize-event actor.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0

      - name: Validate proof evidence (PR body or comment fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash limerick/scripts/agent-check.sh --source=pr "$PR_NUMBER"

  docs-consistency:
    name: Docs and repository artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check cited paths exist
        working-directory: ${{ github.workspace }}
        run: ./limerick/scripts/check-doc-paths.sh

      - name: Check tracked repository artifacts
        working-directory: ${{ github.workspace }}
        run: ./limerick/scripts/check-repository-artifacts.sh

  format-quality:
    name: Docs/data formatting (Prettier + markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped tooling (configs + package.json live at the repo root, not in
    # limerick/ which is this workflow's global default working-directory).
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check (md/json/yaml)
        run: npm run format:check

      - name: Markdownlint
        run: npm run lint:md

      - name: Portfolio-governance unit tests
        run: node --test .github/scripts/*.test.cjs

  python-quality:
    name: Python quality (ruff, mypy, yamllint, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Root-scoped: pyproject.toml + requirements-dev.txt live at the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Yamllint
        run: yamllint .

      - name: Pytest
        run: pytest

  promptfoo-quality:
    name: Promptfoo keyless end-to-end
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.promptfoo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: promptfoo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: promptfoo/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install promptfoo
        run: npm ci --ignore-scripts

      - name: Run offline seam tests
        run: npm test

      - name: Run keyless promptfoo dialogue
        run: npm run test:keyless

  shell-quality:
    name: Shell quality (shellcheck + shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped: `git ls-files '*.sh'` must run from the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          shellcheck -S warning "${shell_files[@]}"

      - name: shfmt (diff = fail)
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          shfmt -i 4 -ci -bn -d "${shell_files[@]}"

      - name: Proof-tooling unit tests
        run: |
          for t in limerick/scripts/tests/*.test.sh; do
            echo "== $t =="
            bash "$t"
          done

  toml-quality:
    name: TOML quality (taplo fmt + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped: taplo.toml (with its exclude globs) lives at the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Taplo format check
        run: taplo fmt --check

      - name: Taplo lint
        run: taplo lint

  runtime-suite:
    name: Runtime correctness suite
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/full-ci.yml
    secrets: inherit

  # Builds main and this PR, runs the same live scenario (limerick-server
  # against a scripted model server) and every --script fixture on both, and
  # fails on any difference the PR body does not declare in a
  # `toml intended-diffs` block (docs/agent/agent-check.md).
  differential-proof:
    name: Differential proof
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.differential == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      # Both sides build into the cached target, sharing dependencies.
      CARGO_TARGET_DIR: ${{ github.workspace }}/limerick/target
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: limerick -> target
          shared-key: prove-diff

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMBER" --json body --jq .body >"$RUNNER_TEMP/pr-body.md"

      - name: Run the differential (main vs this PR)
        run: |
          python3 limerick/scripts/proof/prove_diff.py \
            --scenario talk-and-task \
            --intended-markdown "$RUNNER_TEMP/pr-body.md" \
            --out "$RUNNER_TEMP/prove-diff"

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/prove-diff/report.md"
          if [[ -f "$report" ]]; then
            head -c 900000 "$report" >>"$GITHUB_STEP_SUMMARY"
          fi
          bash .github/scripts/prove-diff-comment.sh "$report" "$PR_NUMBER" "$RUN_URL" \
            || echo "::warning::could not post the differential report comment"

      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prove-diff
          path: |
            ${{ runner.temp }}/prove-diff/report.md
            ${{ runner.temp }}/prove-diff/base/run*/
            ${{ runner.temp }}/prove-diff/head/run*/
          if-no-files-found: ignore
          retention-days: 14

  playwright-launcher-windows:
    name: Playwright launcher lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: limerick/apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Run built-in launcher lifecycle tests
        run: node --test scripts/playwright-worktree-server.test.js

  # ── Aggregate required-checks gate ─────────────────────────────────────────
  # Branch protection requires THIS single job. It aggregates the fast lane and
  # the conditional complete correctness suite for runtime changes.
  ci-gate:
    name: CI gate
    needs:
      [
        changes,
        agent-check,
        docs-consistency,
        format-quality,
        python-quality,
        playwright-launcher-windows,
        promptfoo-quality,
        shell-quality,
        toml-quality,
        runtime-suite,
        differential-proof,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@v6

      - name: Require gated jobs to succeed or be skipped
        env:
          GATED_RESULTS: ${{ join(needs.*.result, ' ') }}
          PLAYWRIGHT_WINDOWS_RESULT: ${{ needs.playwright-launcher-windows.result }}
          RUNTIME_SUITE_REQUIRED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.runtime == 'true' }}
          RUNTIME_SUITE_RESULT: ${{ needs.runtime-suite.result }}
          DIFFERENTIAL_REQUIRED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.differential == 'true' }}
          DIFFERENTIAL_RESULT: ${{ needs.differential-proof.result }}
        run: bash .github/scripts/ci-gate.sh
