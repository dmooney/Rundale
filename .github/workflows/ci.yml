name: Rundale CI

# Jobs run on GitHub-hosted `ubuntu-latest` runners.
#
# Regression coverage for Linux (Tauri native dependencies) is now active
# by default. macOS-specific builds are currently skipped in CI to save
# credits, as the core logic is cross-platform.

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  # Re-run the full suite when a PR enters the merge queue, so semantic
  # conflicts between independently-green PRs are caught against latest main
  # before landing (F1).
  merge_group:
  schedule:
    # Nightly full run: catches toolchain drift, coverage regressions, and
    # flaky tests that per-PR path-filtering would otherwise let slip.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: parish

env:
  CARGO_TERM_COLOR: always
  NO_PROXY: localhost,127.0.0.1,::1

permissions:
  contents: read

jobs:
  # Detect which areas a PR changed so doc/chore/CI-agent PRs can skip the
  # heavy Rust/UI jobs (E1). The filter runs ONLY on pull_request; on
  # push / merge_group / schedule the outputs default to 'true' so nothing is
  # skipped at the merge gate or on the nightly run.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      ui: ${{ steps.filter.outputs.ui || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'parish/crates/**'
              - 'parish/Cargo.toml'
              - 'parish/Cargo.lock'
              - 'parish/testing/**'
              - 'mods/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'parish/apps/ui/**'
              - '.github/workflows/ci.yml'

  agent-check:
    name: Agent proof gate
    # Proof bundles are attached to PRs as structured comments (see
    # `just attach-proof`), so the gate only has a comment to read on
    # pull_request events. Push events to main/develop are post-merge —
    # the gate already ran on the PR that produced the commit. Dependabot
    # bumps Cargo.lock / Cargo.toml without touching engine logic; the
    # proof gate has no useful signal there.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0

      - name: Validate proof evidence (PR comment)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash parish/scripts/agent-check.sh --source=pr "$PR_NUMBER"

  rust-quality-gate:
    name: Rust quality gate (fmt, clippy, tests)
    needs: changes
    # Run on code PRs (rust changed) and always on push / merge_group / schedule.
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      # Pinned to 1.95.0 so a new stable Rust release does not silently
      # break PRs via newly-activated clippy lints. Bump deliberately in
      # a dedicated PR alongside any lint fixes the new version surfaces.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo nextest run --workspace --all-targets

  rust-coverage-ratchet:
    name: Rust coverage ratchet
    needs: changes
    # Skipped on doc/chore PRs (E2); runs on code PRs and on
    # push / merge_group / nightly schedule so the 60.8 floor still gates main.
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      # Keep the coverage job on the same pinned toolchain as rust-quality-gate
      # so coverage drift is from tests/code, not a surprise compiler update.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview

      # Distinct cache prefix: coverage instrumentation bakes -Cinstrument-coverage
      # into target/, so sharing a cache with the quality gate would force one
      # side to rebuild every run.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-coverage

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      # cargo-llvm-cov drives rustc's native LLVM coverage; cargo-nextest
      # runs the instrumented test binaries in parallel (one process per
      # core), where tarpaulin executes them serially. On an 8-vcpu runner
      # this is the main speedup for the ratchet.
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Enforce coverage floor
        run: cargo llvm-cov nextest --workspace --all-targets --exclude parish-client --fail-under-lines 60.8

  rust-multi-channel:
    name: Rust channel matrix
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Beta is a heads-up signal, not a merge blocker — run it on push to
        # main/develop only so PR runs aren't paying for two channel checks.
        toolchain: ${{ github.event_name == 'pull_request' && fromJSON('["stable"]') || fromJSON('["stable", "beta"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Compile workspace
        run: cargo check --workspace --all-targets

  docs-consistency:
    name: Docs consistency (paths cited in agent docs exist on disk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check cited paths exist
        working-directory: ${{ github.workspace }}
        run: ./parish/scripts/check-doc-paths.sh

  format-quality:
    name: Docs/data formatting (Prettier + markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check (md/json/yaml)
        run: npm run format:check

      - name: Markdownlint
        run: npm run lint:md

  python-quality:
    name: Python quality (ruff, mypy, yamllint, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Yamllint
        run: yamllint .

      - name: Pytest
        run: pytest

  shell-quality:
    name: Shell quality (shellcheck + shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: ShellCheck
        run: shellcheck -S warning $(git ls-files '*.sh')

      - name: shfmt (diff = fail)
        run: shfmt -i 4 -ci -bn -d $(git ls-files '*.sh')

  toml-quality:
    name: TOML quality (taplo fmt + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Taplo format check
        run: taplo fmt --check

      - name: Taplo lint
        run: taplo lint

  game-harness:
    name: Full game harness fixture sweep
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      # Build once, then run all fixtures in parallel against the prebuilt
      # binary (E3). The old serial `cargo run` per fixture scaled linearly
      # with the fixture count (110+ and growing).
      - name: Build engine once
        run: cargo build -p parish-engine

      - name: Run every fixture script (parallel)
        shell: bash
        run: |
          set -euo pipefail
          export bin="$PWD/target/debug/parish-engine"
          ls testing/fixtures/*.txt | xargs -P "$(nproc)" -I{} bash -c '
            f="$1"
            if ! out=$("$bin" --script "$f" 2>&1); then
              echo "=== FAIL: $f ==="
              printf "%s\n" "$out" | tail -n 20
              exit 1
            fi
            echo "ok: $f"
          ' _ {}

  harness-shadow:
    name: Harness shadow divergence ledger (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Measurement only: surfaces the legacy-vs-real-game_loop divergence set
    # (#1159) without blocking. Never fail the PR on this job.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Run harness corpus in shadow mode
        shell: bash
        # Jobs default to working-directory: parish, so the script path is
        # relative to that; the script itself resolves the repo root internally.
        run: bash scripts/harness-shadow.sh /tmp/harness-shadow-ledger.md

      - name: Upload divergence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-shadow-ledger
          path: |
            parish/target/harness-shadow-ledger.jsonl
            /tmp/harness-shadow-ledger.md
          if-no-files-found: ignore

  ui-quality:
    name: UI quality (build, check, unit)
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: parish/apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parish/apps/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Build UI
        run: npm run build

      - name: Unit tests
        run: npx vitest run

  ui-e2e:
    name: UI Playwright e2e
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: parish/apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parish/apps/ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Install Playwright browser (Linux-only OS deps)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      # Prebuild parish so Playwright's webServer starts under its 120s
      # timeout — a cold `cargo run` on this job was busting the deadline.
      - name: Prebuild parish web server binary
        working-directory: ${{ github.workspace }}/parish
        run: cargo build -p parish-engine

      - name: Run Playwright e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: parish/apps/ui/playwright-report/
          if-no-files-found: ignore
