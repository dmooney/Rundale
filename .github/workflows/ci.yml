name: Rundale CI

# Jobs run on GitHub-hosted `ubuntu-latest` runners.
#
# Regression coverage for Linux (Tauri native dependencies) is now active
# by default. macOS-specific builds are currently skipped in CI to save
# credits, as the core logic is cross-platform.

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: parish

env:
  CARGO_TERM_COLOR: always
  NO_PROXY: localhost,127.0.0.1,::1

permissions:
  contents: read

jobs:
  agent-check:
    name: Agent proof gate
    runs-on: ubuntu-latest
    # Proof bundles are attached to PRs as structured comments (see
    # `just attach-proof`), so the gate only has a comment to read on
    # pull_request events. Push events to main/develop are post-merge —
    # the gate already ran on the PR that produced the commit. Dependabot
    # bumps Cargo.lock / Cargo.toml without touching engine logic; the
    # proof gate has no useful signal there.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0

      - name: Validate proof evidence (PR comment)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash parish/scripts/agent-check.sh --source=pr "$PR_NUMBER"

  rust-quality-gate:
    name: Rust quality gate (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      # Pinned to 1.95.0 so a new stable Rust release does not silently
      # break PRs via newly-activated clippy lints. Bump deliberately in
      # a dedicated PR alongside any lint fixes the new version surfaces.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo nextest run --workspace --all-targets

  rust-coverage-ratchet:
    name: Rust coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      # Keep the coverage job on the same pinned toolchain as rust-quality-gate
      # so coverage drift is from tests/code, not a surprise compiler update.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview

      # Distinct cache prefix: coverage instrumentation bakes -Cinstrument-coverage
      # into target/, so sharing a cache with the quality gate would force one
      # side to rebuild every run.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-coverage

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      # cargo-llvm-cov drives rustc's native LLVM coverage; cargo-nextest
      # runs the instrumented test binaries in parallel (one process per
      # core), where tarpaulin executes them serially. On an 8-vcpu runner
      # this is the main speedup for the ratchet.
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Enforce coverage floor
        run: cargo llvm-cov nextest --workspace --all-targets --exclude parish-client --fail-under-lines 60.8

  rust-multi-channel:
    name: Rust channel matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Beta is a heads-up signal, not a merge blocker — run it on push to
        # main/develop only so PR runs aren't paying for two channel checks.
        toolchain: ${{ github.event_name == 'pull_request' && fromJSON('["stable"]') || fromJSON('["stable", "beta"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Compile workspace
        run: cargo check --workspace --all-targets

  docs-consistency:
    name: Docs consistency (paths cited in agent docs exist on disk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check cited paths exist
        working-directory: ${{ github.workspace }}
        run: ./parish/scripts/check-doc-paths.sh

  game-harness:
    name: Full game harness fixture sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Run every fixture script
        shell: bash
        run: |
          set -euo pipefail
          for fixture in testing/fixtures/*.txt; do
            echo "=== Running $fixture ==="
            cargo run -p parish-engine -- --script "$fixture" > /tmp/fixture.out
            tail -n 5 /tmp/fixture.out
          done

  harness-shadow:
    name: Harness shadow divergence ledger (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Measurement only: surfaces the legacy-vs-real-game_loop divergence set
    # (#1159) without blocking. Never fail the PR on this job.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Run harness corpus in shadow mode
        shell: bash
        # Jobs default to working-directory: parish, so the script path is
        # relative to that; the script itself resolves the repo root internally.
        run: bash scripts/harness-shadow.sh /tmp/harness-shadow-ledger.md

      - name: Upload divergence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-shadow-ledger
          path: |
            parish/target/harness-shadow-ledger.jsonl
            /tmp/harness-shadow-ledger.md
          if-no-files-found: ignore

  ui-quality:
    name: UI quality (build, check, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: parish/apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parish/apps/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: Build UI
        run: npm run build

      - name: Unit tests
        run: npx vitest run

  ui-e2e:
    name: UI Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: parish/apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parish/apps/ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Install Playwright browser (Linux-only OS deps)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      # Prebuild parish so Playwright's webServer starts under its 120s
      # timeout — a cold `cargo run` on this job was busting the deadline.
      - name: Prebuild parish web server binary
        working-directory: ${{ github.workspace }}/parish
        run: cargo build -p parish-engine

      - name: Run Playwright e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: parish/apps/ui/playwright-report/
          if-no-files-found: ignore
