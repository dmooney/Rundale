name: Rundale CI

# Jobs run on GitHub-hosted `ubuntu-latest` runners.
#
# Sub-minute fast lane for pull requests and main/develop pushes. The expensive
# Rust, coverage, game-harness, and UI runtime jobs live in `full-ci.yml`.

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: parish

env:
  CARGO_TERM_COLOR: always
  NO_PROXY: localhost,127.0.0.1,::1

permissions:
  contents: read

jobs:
  # Detect which areas a PR changed. The outputs are retained as a cheap
  # diagnostic and for local act parity; expensive path-sensitive jobs live in
  # `full-ci.yml`.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      ui: ${{ steps.filter.outputs.ui || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'parish/crates/**'
              - 'parish/Cargo.toml'
              - 'parish/Cargo.lock'
              - 'parish/testing/**'
              - 'parish/.config/nextest.toml'
              - 'mods/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'parish/apps/ui/**'
              - '.github/workflows/ci.yml'

  agent-check:
    name: Agent proof gate
    # Proof bundles are attached to PRs as structured comments (see
    # `just attach-proof`), so the gate only has a comment to read on
    # pull_request events. Push events to main/develop are post-merge —
    # the gate already ran on the PR that produced the commit. Dependabot
    # bumps Cargo.lock / Cargo.toml without touching engine logic; the
    # proof gate has no useful signal there.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0

      - name: Fetch PR base
        run: git fetch origin "${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Validate proof evidence (PR comment)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENT_CHECK_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: bash parish/scripts/agent-check.sh --source=pr "$PR_NUMBER"

  docs-consistency:
    name: Docs consistency (paths cited in agent docs exist on disk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check cited paths exist
        working-directory: ${{ github.workspace }}
        run: ./parish/scripts/check-doc-paths.sh

  format-quality:
    name: Docs/data formatting (Prettier + markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped tooling (configs + package.json live at the repo root, not in
    # parish/ which is this workflow's global default working-directory).
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check (md/json/yaml)
        run: npm run format:check

      - name: Markdownlint
        run: npm run lint:md

  python-quality:
    name: Python quality (ruff, mypy, yamllint, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Root-scoped: pyproject.toml + requirements-dev.txt live at the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Yamllint
        run: yamllint .

      - name: Pytest
        run: pytest

  shell-quality:
    name: Shell quality (shellcheck + shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped: `git ls-files '*.sh'` must run from the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          shellcheck -S warning "${shell_files[@]}"

      - name: shfmt (diff = fail)
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          shfmt -i 4 -ci -bn -d "${shell_files[@]}"

      - name: Proof-tooling unit tests
        run: |
          for t in parish/scripts/tests/*.test.sh; do
            echo "== $t =="
            bash "$t"
          done

  toml-quality:
    name: TOML quality (taplo fmt + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped: taplo.toml (with its exclude globs) lives at the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Taplo format check
        run: taplo fmt --check

      - name: Taplo lint
        run: taplo lint

  # ── Aggregate required-checks gate ─────────────────────────────────────────
  # Branch protection requires THIS single fast-lane job. Expensive full-suite
  # correctness jobs report through `.github/workflows/full-ci.yml`.
  ci-gate:
    name: CI gate
    needs:
      [
        changes,
        agent-check,
        docs-consistency,
        format-quality,
        python-quality,
        shell-quality,
        toml-quality,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No checkout, so override the workflow-level `working-directory: parish`
    # default (that dir doesn't exist here) to the always-present workspace root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Require gated jobs to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gated job results: $RESULTS"
          read -ra results <<< "$RESULTS"
          status=0
          for r in "${results[@]}"; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a required CI job ended with '$r'"
                status=1
                ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "CI gate: FAIL — a required job failed or was cancelled."
            exit 1
          fi
          echo "CI gate: PASS — all gated jobs succeeded or were legitimately skipped."
