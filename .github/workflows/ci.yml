name: Rundale CI

# Jobs run on GitHub-hosted `ubuntu-latest` runners.
#
# Sub-minute fast lane for pull requests and main/develop pushes. Pull requests
# that touch the shipped browser/server seam additionally run the complete
# Playwright contract.
# Other expensive Rust, coverage, game-harness, and UI runtime jobs live in
# `full-ci.yml`.

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: parish

env:
  CARGO_TERM_COLOR: always
  NO_PROXY: localhost,127.0.0.1,::1

permissions:
  contents: read

jobs:
  # Detect which areas a PR changed. Browser UI and parish-server seam changes
  # use this output to opt into the complete Playwright contract; other
  # expensive path-sensitive jobs live in `full-ci.yml`.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      ui: ${{ steps.filter.outputs.ui || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'parish/crates/**'
              - 'parish/Cargo.toml'
              - 'parish/Cargo.lock'
              - 'parish/testing/**'
              - 'parish/.config/nextest.toml'
              - 'mods/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'parish/apps/ui/**'
              - 'parish/crates/parish-server/**'
              - '.github/workflows/ci.yml'

  agent-check:
    name: Agent proof gate
    # Proof bundles live in the PR body by default; structured comments remain
    # a legacy fallback. Push events to main/develop are post-merge, so the gate
    # already ran on the PR that produced the commit. Dependabot-authored bumps
    # have no useful gameplay-proof signal, even when a coordinator refreshes
    # their branch and becomes the synchronize-event actor.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0

      - name: Validate proof evidence (PR body or comment fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash parish/scripts/agent-check.sh --source=pr "$PR_NUMBER"

  docs-consistency:
    name: Docs consistency (paths cited in agent docs exist on disk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check cited paths exist
        working-directory: ${{ github.workspace }}
        run: ./parish/scripts/check-doc-paths.sh

  format-quality:
    name: Docs/data formatting (Prettier + markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped tooling (configs + package.json live at the repo root, not in
    # parish/ which is this workflow's global default working-directory).
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check (md/json/yaml)
        run: npm run format:check

      - name: Markdownlint
        run: npm run lint:md

      - name: Portfolio-governance unit tests
        run: node --test .github/scripts/*.test.cjs

  python-quality:
    name: Python quality (ruff, mypy, yamllint, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Root-scoped: pyproject.toml + requirements-dev.txt live at the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Yamllint
        run: yamllint .

      - name: Pytest
        run: pytest

  shell-quality:
    name: Shell quality (shellcheck + shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped: `git ls-files '*.sh'` must run from the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          shellcheck -S warning "${shell_files[@]}"

      - name: shfmt (diff = fail)
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          shfmt -i 4 -ci -bn -d "${shell_files[@]}"

      - name: Proof-tooling unit tests
        run: |
          for t in parish/scripts/tests/*.test.sh; do
            echo "== $t =="
            bash "$t"
          done

  toml-quality:
    name: TOML quality (taplo fmt + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-scoped: taplo.toml (with its exclude globs) lives at the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Taplo format check
        run: taplo fmt --check

      - name: Taplo lint
        run: taplo lint

  ui-e2e:
    name: UI Playwright e2e
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: parish/apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parish/apps/ui/package-lock.json

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Run managed-server integration races
        run: npm run test:playwright-launcher-integration

      - name: Install Playwright browser (Linux-only OS deps)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      - name: Prebuild parish web server binary
        working-directory: ${{ github.workspace }}/parish
        run: cargo build -p parish-server

      - name: Run Playwright e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: parish/apps/ui/playwright-report/
          if-no-files-found: ignore

  playwright-launcher-windows:
    name: Playwright launcher lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: parish/apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run built-in launcher lifecycle tests
        run: node --test scripts/playwright-worktree-server.test.js

  # ── Aggregate required-checks gate ─────────────────────────────────────────
  # Branch protection requires THIS single job. It aggregates the fast lane and
  # the conditional complete Playwright contract for shipped browser/server
  # seam changes.
  ci-gate:
    name: CI gate
    needs:
      [
        changes,
        agent-check,
        docs-consistency,
        format-quality,
        python-quality,
        playwright-launcher-windows,
        shell-quality,
        toml-quality,
        ui-e2e,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@v6

      - name: Require gated jobs to succeed or be skipped
        env:
          GATED_RESULTS: ${{ join(needs.*.result, ' ') }}
          PLAYWRIGHT_WINDOWS_RESULT: ${{ needs.playwright-launcher-windows.result }}
          UI_E2E_REQUIRED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true' }}
          UI_E2E_RESULT: ${{ needs.ui-e2e.result }}
        run: bash .github/scripts/ci-gate.sh
