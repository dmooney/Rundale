name: "Dependabot review"

# Classifies Dependabot updates and flags major versions for coordinator review.
# This workflow deliberately never enables or executes a merge: the portfolio
# coordinator lands every dependency PR only after its proof, risk, CI, and
# review gates have cleared.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "dependabot-review-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 5
    steps:
      - name: "Fetch Dependabot metadata"
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: "Leave patch and minor updates for the coordinator"
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: echo "Patch/minor update classified; merge remains coordinator-owned."

      - name: "Flag majors for coordinator review"
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "Major version bump - coordinator review required. This workflow never enables merge; all Dependabot updates remain open until proof, risk, CI, and review gates clear."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
