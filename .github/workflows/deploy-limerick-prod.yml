name: Deploy limerick-prod

# Deploys the Limerick Endpoints server and publishes Rundale's Endpoint
# definitions to limerick-prod on every merge to main that changes them. The
# game is unreleased with no users, so deploys run without approval.
# One-time Google Cloud setup: endpoints/deploy/setup-github-deploy.sh.

on:
  push:
    branches:
      - main
    paths:
      - "endpoints/**"
      - "mods/rundale/endpoints/**"
      - ".gcloudignore"
      - ".github/workflows/deploy-limerick-prod.yml"
  workflow_dispatch:

concurrency:
  group: deploy-limerick-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy and publish
    runs-on: ubuntu-latest
    environment: limerick-prod
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            server:
              - 'endpoints/apps/server/**'
              - 'endpoints/packages/**'
              - 'endpoints/Dockerfile.server'
              - 'endpoints/package.json'
              - 'endpoints/pnpm-lock.yaml'
              - 'endpoints/deploy/**'
              - '.gcloudignore'
              - '.github/workflows/deploy-limerick-prod.yml'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: endpoints/pnpm-lock.yaml

      - name: Install the Endpoints workspace
        working-directory: endpoints
        run: pnpm install --frozen-lockfile

      # Sign in only after dependencies install, so their install scripts never
      # run with deploy credentials.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Install the Cloud SQL Auth Proxy
        run: |
          curl -fsSLo /usr/local/bin/cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.26.0/cloud-sql-proxy.linux.amd64
          chmod +x /usr/local/bin/cloud-sql-proxy

      - name: Build, migrate and deploy the server
        if: steps.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
        run: endpoints/deploy/limerick-prod.sh deploy "${GITHUB_SHA::12}"

      # Runs after any deploy, so a definition can use a provider the same
      # merge enabled. Before release each Endpoint is v1, replaced in place.
      - name: Publish Endpoint definitions
        run: |
          endpoints/deploy/limerick-prod.sh definitions replace
          endpoints/deploy/limerick-prod.sh definitions verify
