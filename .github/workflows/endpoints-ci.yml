name: Parish Endpoints CI

on:
  pull_request:
    paths:
      - "endpoints/**"
      - ".github/workflows/endpoints-ci.yml"
      - "justfile"
  push:
    branches:
      - main
      - develop
    paths:
      - "endpoints/**"
      - ".github/workflows/endpoints-ci.yml"
      - "justfile"
  workflow_dispatch:

concurrency:
  group: endpoints-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Endpoints quality and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: endpoints
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: parish
          POSTGRES_PASSWORD: parish
          POSTGRES_DB: parish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parish -d parish_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL_TEST: postgres://parish:parish@127.0.0.1:5432/parish_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: endpoints/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: DATABASE_URL="$DATABASE_URL_TEST" pnpm db:migrate

      - name: Run Endpoints quality gate
        run: pnpm check
