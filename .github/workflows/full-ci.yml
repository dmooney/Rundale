name: Rundale Full CI

# Expensive correctness gates preserved outside the sub-minute `ci.yml` fast
# lane. These jobs intentionally run on main/develop pushes, merge-queue
# entries, nightly schedule, and manual dispatch.

on:
  push:
    branches:
      - main
      - develop
  merge_group:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: parish

env:
  CARGO_TERM_COLOR: always
  NO_PROXY: localhost,127.0.0.1,::1

permissions:
  contents: read

jobs:
  rust-quality-gate:
    name: Rust quality gate (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and integration tests
        run: |
          set -o pipefail
          cargo nextest run --workspace --all-targets --profile ci 2>&1 \
            | tee nextest-run.log

      - name: Flaky-test report
        if: always()
        run: |
          if [ ! -f nextest-run.log ]; then
            echo "No nextest log found — skipping flaky report."
            exit 0
          fi
          flaky=$(grep -E '^\s*FLAKY ' nextest-run.log || true)
          if [ -z "$flaky" ]; then
            echo "No flaky tests detected." >> "$GITHUB_STEP_SUMMARY"
            echo "No flaky tests detected."
            exit 0
          fi
          {
            echo "### ⚠️ Flaky tests detected (#1176)"
            echo ""
            echo "These tests failed on their first attempt but passed on retry."
            echo "The run is **not** failed by this, but the nondeterminism should be fixed."
            echo ""
            echo '```'
            echo "$flaky"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$flaky" | while IFS= read -r line; do
            name=$(echo "$line" | awk '{print $NF}')
            echo "::warning title=Flaky test::${name} failed then passed on retry (#1176)"
          done

  rust-coverage-ratchet:
    name: Rust coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-coverage

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Enforce coverage floor
        env:
          NEXTEST_PROFILE: ci
        run: cargo llvm-cov nextest --workspace --all-targets --exclude parish-client --ignore-filename-regex 'build\.rs' --fail-under-lines 60.8

  rust-multi-channel:
    name: Rust channel matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Compile workspace
        run: cargo check --workspace --all-targets

  game-harness:
    name: Full game harness fixture sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native deps (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Build engine once
        run: cargo build -p parish-engine

      - name: Run every fixture script (parallel)
        shell: bash
        run: |
          set -euo pipefail
          runner="$(mktemp)"
          cat > "$runner" <<'EOF'
          set -euo pipefail
            f="$1"
            if ! out="$("$BIN" --script "$f" 2>&1)"; then
              echo "=== FAIL: $f ==="
              printf "%s\n" "$out" | tail -n 20
              exit 1
            fi
            echo "ok: $f"
          EOF
          export BIN="$PWD/target/debug/parish-engine"
          find testing/fixtures -maxdepth 1 -name '*.txt' -print0 \
            | xargs -0 -P "$(nproc)" -I{} bash "$runner" {}

      - name: Build server + client
        run: cargo build -p parish-server -p parish-client

      - name: parish-client smoke test
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/parish-mcp-backend.sh start
          trap 'bash scripts/parish-mcp-backend.sh stop' EXIT
          out=$(PARISH_SERVER=http://127.0.0.1:3030 ./target/debug/parish "look")
          echo "$out"
          grep -q "Kilteevan" <<<"$out" || {
            echo "::error::parish-client smoke: 'look' output did not include the starting location"
            exit 1
          }

  ui-quality:
    name: UI quality (build, check, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: parish/apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parish/apps/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Build UI
        run: npm run build

      - name: Unit tests
        run: npx vitest run

  ui-e2e:
    name: UI Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: parish/apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parish/apps/ui/package-lock.json

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Run managed-server integration races
        run: npm run test:playwright-launcher-integration

      - name: Install Playwright browser (Linux-only OS deps)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      - name: Prebuild parish web server binary
        working-directory: ${{ github.workspace }}/parish
        run: cargo build -p parish-server

      - name: Run Playwright e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: parish/apps/ui/playwright-report/
          if-no-files-found: ignore

  full-ci-gate:
    name: Full CI gate
    needs:
      [
        rust-quality-gate,
        rust-coverage-ratchet,
        rust-multi-channel,
        game-harness,
        ui-quality,
        ui-e2e,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Require full-suite jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "full-suite job results: $RESULTS"
          read -ra results <<< "$RESULTS"
          status=0
          for r in "${results[@]}"; do
            case "$r" in
              success) ;;
              *)
                echo "::error::a full-suite CI job ended with '$r'"
                status=1
                ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "Full CI gate: FAIL — a full-suite job failed, was skipped, or was cancelled."
            exit 1
          fi
          echo "Full CI gate: PASS — all full-suite jobs succeeded."
