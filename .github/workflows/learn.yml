name: Self-improving learn loop

# Triggered on each push to main: mines recent dev-time failure signals
# (CI failures, rejected proof bundles, review-bot comments, Stop-hook
# blocks), distils them into lessons in the existing LEARNINGS.md bullet
# style, and opens a follow-up PR. See parish/scripts/learn/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      since_days:
        description: "How many days of signals to scan"
        required: false
        default: "14"
      dry_run:
        description: "If true, only print the diff (don't open a PR)"
        required: false
        default: "false"

concurrency:
  group: learn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  distil:
    name: Distil signals into LEARNINGS.md
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip if the previous push WAS the loop's own PR being merged, to
    # avoid feedback amplification.
    if: ${{ !contains(github.event.head_commit.message, 'chore(learnings)') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r parish/scripts/learn/requirements.txt

      - name: Run learn loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEARN_MODEL: claude-sonnet-4-6
        run: |
          set -euo pipefail
          SINCE="${{ github.event.inputs.since_days || '14' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          ARGS=(--since-days "$SINCE")
          if [ "$DRY" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python parish/scripts/learn/driver.py "${ARGS[@]}"

      - name: Diff summary
        if: always()
        run: |
          if git diff --quiet -- LEARNINGS.md; then
            echo "LEARNINGS.md unchanged."
          else
            echo "::group::LEARNINGS.md diff"
            git --no-pager diff -- LEARNINGS.md
            echo "::endgroup::"
          fi

      - name: Open follow-up PR
        if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: learn/auto-distil
          base: main
          delete-branch: true
          commit-message: |
            chore(learnings): distill lessons from recent signals (auto)
          title: "chore(learnings): distill lessons from recent signals (auto)"
          body: |
            Auto-generated by `.github/workflows/learn.yml`.

            Source: `parish/scripts/learn/` — distils dev-time failure
            signals (CI failures, rejected proof bundles, review-bot
            comments, Stop-hook blocks) into lessons appended to
            `LEARNINGS.md` in the existing bullet style.

            Review pointers:
            - Each new bullet must cite a real file path.
            - Bullets are 2–3 lines max; reject anything longer.
            - Reject anything that paraphrases an existing bullet.

            Rejected candidates from this run are in
            `docs/proofs/learn-runs/`.
          labels: |
            auto
            learnings
          add-paths: |
            LEARNINGS.md
            docs/proofs/learn-runs/**
