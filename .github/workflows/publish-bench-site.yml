name: Publish bench site

# Build the static rundale-bench **v2** results site (promptfoo benchmark of
# record) and deploy it to GitHub Pages. Triggers when the v2 leaderboard data
# or the site source change on main. The site reads
# promptfoo/leaderboard/leaderboard.jsonl directly at build time — no Python
# data-generation step. Uses no event payload input in run: steps, so there is
# no workflow-injection surface.
on:
  push:
    branches: [main]
    paths:
      - "promptfoo/leaderboard/**"
      - "promptfoo/bench-site/**"
      - "promptfoo/catalog/**"
      - "promptfoo/v2/MANIFEST.json"
      - "promptfoo/config/judge.yaml"
      - ".github/workflows/publish-bench-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: promptfoo/bench-site/pnpm-lock.yaml
      - name: Install
        working-directory: promptfoo/bench-site
        run: pnpm install --frozen-lockfile
      - name: Check
        working-directory: promptfoo/bench-site
        run: pnpm check
      - name: Build
        working-directory: promptfoo/bench-site
        run: pnpm build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: promptfoo/bench-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
