name: Release

# Tag-driven release pipeline.
#
# Production trigger:
#   git push origin vX.Y.Z   →  builds + publishes a GitHub Release.
#
# Human dry-run:
#   workflow_dispatch with `dry_run: true` builds the artifacts but skips
#   tagging, releasing, and uploading. The packaged tarball is still attached
#   to the workflow run as a downloadable artifact for inspection.
#
# Claude execution path:
#   parish/scripts/release.sh <version>      # bump + commit + tag locally
#   git push origin <branch>                 # land the bump
#   git push origin v<version>               # this workflow takes over
#
# The tag version is the source of truth and must match parish-cli's
# Cargo.toml `[package].version` — the validate-tag job enforces this.
#
# Platform matrix:
#   - Linux x86_64       (CLI tarball + .deb + .AppImage)
#   - macOS x86_64       (CLI tarball + .app.tar.gz + .dmg)
#   - macOS aarch64      (CLI tarball + .app.tar.gz + .dmg)
#   - Windows x86_64     (CLI zip + .msi + .exe NSIS installer)
#
# All bundles are unsigned for 0.1.0 — users will see Gatekeeper / SmartScreen
# warnings. Code signing is queued for 0.2.0.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version (without leading v), e.g. 0.2.0"
        required: true
        type: string
      dry_run:
        description: "Build artifacts but do not publish a Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write   # required to create the GitHub Release on tag push

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.set.outputs.tag }}
      dry_run: ${{ steps.set.outputs.dry_run }}
    steps:
      - name: Determine version + dry-run from event
        id: set
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF##*/}"
            version="${tag#v}"
            dry_run="false"
          else
            version="${{ inputs.version }}"
            tag="v${version}"
            dry_run="${{ inputs.dry_run }}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$tag dry_run=$dry_run"

  validate-tag:
    name: Validate tag matches Cargo.toml
    needs: resolve
    # Only enforced on real tag pushes. workflow_dispatch dry-runs are
    # allowed to test the build pipeline before any version bump lands.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compare tag version with parish-cli Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ needs.resolve.outputs.version }}"
          actual="$(awk '/^\[package\]/{p=1; next} p && /^version = "/{gsub(/^version = "|"$/, ""); print; exit}' parish/crates/parish-cli/Cargo.toml)"
          echo "tag version:        $expected"
          echo "Cargo.toml version: $actual"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Tag $expected does not match parish-cli Cargo.toml ($actual). Run parish/scripts/release.sh $expected."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_archive: tar.gz
            cli_ext: ""
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            cli_archive: tar.gz
            cli_ext: ""
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            cli_archive: tar.gz
            cli_ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_archive: zip
            cli_ext: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: parish
          # Per-target cache so Linux/macOS/Windows builds don't poison each other.
          key: release-${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parish/apps/ui/package-lock.json

      - name: Install Linux native deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Install frontend deps
        working-directory: parish/apps/ui
        run: npm ci

      - name: Build parish CLI (release)
        working-directory: parish
        # No --locked: a freshly-bumped workspace member version would race
        # ahead of Cargo.lock until the next regular CI run picks up the
        # refreshed lockfile. release.sh refreshes it best-effort locally.
        run: cargo build -p parish --release --target ${{ matrix.target }}

      - name: Package CLI archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          stage="$(mktemp -d)"
          name="parish-v${version}-${{ matrix.target }}"
          mkdir -p "$stage/$name"
          cp parish/target/${{ matrix.target }}/release/parish${{ matrix.cli_ext }} "$stage/$name/"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "$stage/$name/"
          ( cd "$stage" && tar czf "$name.tar.gz" "$name" )
          mkdir -p dist
          mv "$stage/$name.tar.gz" "dist/$name.tar.gz"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -la dist

      - name: Package CLI archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          stage="$(mktemp -d)"
          name="parish-v${version}-${{ matrix.target }}"
          mkdir -p "$stage/$name"
          cp parish/target/${{ matrix.target }}/release/parish${{ matrix.cli_ext }} "$stage/$name/"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "$stage/$name/"
          mkdir -p dist
          ( cd "$stage" && 7z a -tzip "$OLDPWD/dist/$name.zip" "$name" )
          ( cd dist && sha256sum "$name.zip" > "$name.zip.sha256" )
          ls -la dist

      - name: Build Tauri desktop bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: parish/crates/parish-tauri
          args: --target ${{ matrix.target }}
          # No tagName / releaseId — we collect artifacts ourselves and let
          # the publish job attach them to the Release. tauri-action just
          # builds and uploads to the workflow's artifact store.
          includeUpdaterJson: false

      - name: Collect Tauri bundle outputs
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="parish/target/${{ matrix.target }}/release/bundle"
          if [[ ! -d "$bundle_dir" ]]; then
            echo "::error::Tauri bundle directory missing: $bundle_dir"
            ls -la parish/target/${{ matrix.target }}/release/ || true
            exit 1
          fi
          echo "Bundle contents:"
          find "$bundle_dir" -type f -print
          mkdir -p dist
          # Copy every bundle artifact into dist/, preserving filenames.
          # Tauri emits each format into its own subdirectory (dmg/, deb/, msi/, etc.).
          find "$bundle_dir" -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.deb" \
            -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.msi" \
            -o -name "*.exe" \) \
            -exec cp {} dist/ \;
          ls -la dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: parish-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    # Hard gate: only real tag pushes can publish. workflow_dispatch is
    # dry-run-only — it can't slip a release out without a tag landing.
    needs: [resolve, validate-tag, build]
    if: github.event_name == 'push' && needs.resolve.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: parish-*
          path: dist
          merge-multiple: true

      - name: List collected artifacts
        shell: bash
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Rundale ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.rpm
            dist/*.msi
            dist/*.exe

  dry-run-summary:
    name: Dry-run summary
    needs: [resolve, build]
    if: needs.resolve.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        shell: bash
        run: |
          {
            echo "## Dry run for ${{ needs.resolve.outputs.tag }}"
            echo
            echo "- Built artifacts for all platforms in the matrix."
            echo "- No tag was created."
            echo "- No GitHub Release was published."
            echo "- Per-platform artifacts are downloadable from this run:"
            echo "  - \`parish-linux-x86_64\`"
            echo "  - \`parish-macos-x86_64\`"
            echo "  - \`parish-macos-aarch64\`"
            echo "  - \`parish-windows-x86_64\`"
          } >> "$GITHUB_STEP_SUMMARY"
