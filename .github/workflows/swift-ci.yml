# Swift / iOS quality gates for the native client (#2103).
#
# Required when a pull request touches mobile/** or this workflow. Wired into
# the aggregate CI gate as a conditional job (success when selected, skipped
# otherwise). Does not replace #2045 ./verify or #2046 device/TestFlight.

name: Swift quality

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: swift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-quality:
    name: Swift lint, packages, and Xcode lane
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Add iOS Rust targets
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim --toolchain "$channel"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: limerick -> target
          shared-key: swift-mobile-ffi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install pinned SwiftLint and SwiftFormat
        run: |
          set -euo pipefail
          swiftlint_v="$(sed -n 's/^swiftlint *= *"\([^"]*\)".*/\1/p' mobile/tool-versions.toml | head -n1)"
          swiftformat_v="$(sed -n 's/^swiftformat *= *"\([^"]*\)".*/\1/p' mobile/tool-versions.toml | head -n1)"
          brew install swiftlint swiftformat
          echo "pinned swiftlint=${swiftlint_v} installed=$(swiftlint version)"
          echo "pinned swiftformat=${swiftformat_v} installed=$(swiftformat --version)"

      - name: Runner unit tests (no simulator)
        run: python3 -m unittest discover -s mobile/scripts -p 'test_swift_quality.py'

      - name: Fast Swift quality (lint, format, packages)
        run: python3 mobile/scripts/swift_quality.py --fast

      - name: Xcode app build, app-unit, deterministic UI, coverage collect
        run: |
          set -euo pipefail
          simulator="$(python3 mobile/scripts/pick-ios-simulator.py)"
          echo "Using simulator $simulator"
          python3 mobile/scripts/swift_quality.py \
            --no-lint --no-format-check --no-packages \
            --xcode --coverage \
            --simulator "$simulator"

      - name: Upload Swift quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-quality-report
          path: |
            mobile/.verification/swift-quality/
          if-no-files-found: warn
          retention-days: 14
