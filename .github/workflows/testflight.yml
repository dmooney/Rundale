name: TestFlight

# Uploads an internal TestFlight build on every merge to main that changes what
# the iPhone app ships, so the owner can try it without a Mac session, and on
# Run workflow. CI's required gate passed the PR first: a full `mobile-verify`
# pass recorded from the author's Mac (verify_record.py), or the hosted smoke
# gate (`verify.py --smoke`). CI tested the PR head's input tree, which the
# squash merge matches unless main moved under it; the upload runs
# `release.py testflight --verify none`. `release.py` archives with a stored
# Apple Distribution certificate and App Store profile, and exports and uploads
# with an App Store Connect API key, instead of an Xcode account. Apple's
# processing, export compliance and the Internal Beta **Testing** status still
# follow the upload (mobile/testflight.md).
#
# The nightly `gate` job checks what the smoke gate left out, after the build
# shipped: when main's input tree has no recorded full pass, it runs the full
# gate (over an hour on this runner), records the pass, and on failure opens or
# updates a "Nightly mobile-verify failed" issue that links an artifact of the failed
# tests' evidence (failures/ and the .xcresult bundles).

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "mods/**"
      - "limerick/crates/**"
      - "limerick/Cargo.toml"
      - "limerick/Cargo.lock"
      - "limerick/config/**"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "!**/AGENTS.md"
      - ".github/workflows/testflight.yml"
  # The nightly full gate for whatever main gained without a recorded pass.
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload
    # Only main's builds ship: a Run workflow from another branch uploads nothing.
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    # About 15 minutes.
    timeout-minutes: 60
    environment: testflight
    # One upload at a time, in merge order; a cancelled upload could leave App
    # Store Connect holding a half-processed build.
    concurrency:
      group: testflight
      cancel-in-progress: false
    steps:
      # Full history: without App Store Connect builds to count from, the
      # build number falls back to HEAD's commit count.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A push that leaves every app input as it was builds the same app. It is
      # compared with main before the push, so a push of several commits that
      # changed the app before its last commit still uploads.
      - name: Check that the push changed the app
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$GITHUB_SHA^"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] &&
            [ "$(python3 mobile/scripts/verify_record.py tree "$GITHUB_SHA")" = \
              "$(python3 mobile/scripts/verify_record.py tree "$base")" ]; then
            echo "No app input changed in this push; nothing new to upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 26.6
        if: steps.changed.outputs.upload == 'true'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Install the Rust toolchain and iOS targets
        if: steps.changed.outputs.upload == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install XcodeGen
        if: steps.changed.outputs.upload == 'true'
        run: brew install xcodegen

      # The iOS Rust libraries' target directory. The crates.io dependencies
      # are reused; a checkout makes the workspace's own sources newer than
      # their cached products, so those recompile.
      # Saved on main, so pull requests' mobile-verify runs start from it.
      - name: Restore the Rust mobile build
        id: rust-cache
        if: steps.changed.outputs.upload == 'true'
        uses: actions/cache/restore@v6
        with:
          path: mobile/.build/rust-mobile/cargo-target
          key: rust-mobile-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', 'limerick/Cargo.toml', 'limerick/Cargo.lock', 'limerick/crates/**') }}
          restore-keys: |
            rust-mobile-${{ runner.os }}-

      - name: Write the private Firebase file and API key
        if: steps.changed.outputs.upload == 'true'
        env:
          FIREBASE_PLIST_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST_B64 }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          echo "$FIREBASE_PLIST_B64" | base64 --decode > mobile/Rundale/Resources/GoogleService-Info.plist
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # The archive signs manually with one stored Apple Distribution
      # certificate and its App Store profile. Automatic signing on a fresh
      # runner would create a new development certificate every run until the
      # account's certificate limit stops the archive.
      - name: Import the distribution certificate and profile
        if: steps.changed.outputs.upload == 'true'
        env:
          DISTRIBUTION_CERTIFICATE_P12_B64: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12_B64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          DISTRIBUTION_PROFILE_B64: ${{ secrets.DISTRIBUTION_PROFILE_B64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          # Registered first, so cleanup finds it even if a later line fails.
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$DISTRIBUTION_CERTIFICATE_P12_B64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -f pkcs12 \
            -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          read -r -a keychains <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          profile="$RUNNER_TEMP/distribution.mobileprovision"
          echo "$DISTRIBUTION_PROFILE_B64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/distribution-profile.plist"
          uuid="$(plutil -extract UUID raw "$RUNNER_TEMP/distribution-profile.plist")"
          name="$(plutil -extract Name raw "$RUNNER_TEMP/distribution-profile.plist")"
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          security find-identity -v -p codesigning "$keychain"
          echo "Distribution profile: $name ($uuid)"
          echo "RUNDALE_DISTRIBUTION_PROFILE=$name" >> "$GITHUB_ENV"

      - name: Sign and upload
        if: steps.changed.outputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 mobile/scripts/release.py testflight --verify none

      # Saved even when signing or the upload fails after the Rust build.
      - name: Save the Rust mobile build
        if: ${{ !cancelled() && steps.changed.outputs.upload == 'true' && steps.rust-cache.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: mobile/.build/rust-mobile/cargo-target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Upload the release report
        if: always() && steps.changed.outputs.upload == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testflight-report
          path: |
            mobile/.build/release/receipt.json
            mobile/.build/release/release.log
          if-no-files-found: warn
          retention-days: 14

      - name: Remove the API key and signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi

  gate:
    name: Nightly full mobile-verify gate
    if: github.event_name == 'schedule'
    runs-on: macos-26
    # The full gate took 75 minutes on this runner.
    timeout-minutes: 150
    # Its own group: a gate run never delays or replaces a merge's upload.
    concurrency:
      group: testflight-nightly-gate
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      # Records the pass and reports a failure in an issue.
      statuses: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A recorded pass anywhere on main's input tree, from a Mac or an
      # earlier night, leaves nothing to check. Needs only git, gh and Python.
      - name: Find a recorded full pass for main
        id: recorded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 mobile/scripts/verify_record.py check --latest "$GITHUB_SHA"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 26.6
        if: steps.recorded.outputs.run == 'true'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Install the Rust toolchain and iOS targets
        if: steps.recorded.outputs.run == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install XcodeGen
        if: steps.recorded.outputs.run == 'true'
        run: brew install xcodegen

      # The same cache as the upload job's.
      - name: Restore the Rust mobile build
        id: rust-cache
        if: steps.recorded.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: mobile/.build/rust-mobile/cargo-target
          key: rust-mobile-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', 'limerick/Cargo.toml', 'limerick/Cargo.lock', 'limerick/crates/**') }}
          restore-keys: |
            rust-mobile-${{ runner.os }}-

      # Prints its summary, with each failed test's assertion, to the log.
      - name: Run the full mobile-verify gate
        id: gate
        if: steps.recorded.outputs.run == 'true'
        env:
          # Sized for the hosted runner: six simulator clones outran the
          # command limit there (#2276).
          RUNDALE_PARALLEL_WORKERS: "2"
          RUNDALE_COMMAND_TIMEOUT_MINUTES: "100"
        # Tests whose result depends on machine speed run only in local runs
        # (verify.py TIME_SENSITIVE_TESTS).
        run: python3 mobile/scripts/verify.py --phase all --skip-time-sensitive

      # Saved even when a later test fails: the Rust build finished first.
      - name: Save the Rust mobile build
        if: ${{ !cancelled() && steps.recorded.outputs.run == 'true' && steps.rust-cache.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: mobile/.build/rust-mobile/cargo-target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      # The next night then finds this tree verified.
      - name: Record the pass
        if: steps.recorded.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 mobile/scripts/verify_record.py record

      - name: Upload the verification report
        id: report
        if: always() && steps.recorded.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-verify-nightly-report
          path: |
            mobile/.verification/verify.json
            mobile/.verification/verify.junit.xml
            mobile/.verification/summary.txt
            mobile/.verification/logs/
            mobile/.verification/failures/
          if-no-files-found: warn
          retention-days: 14

      # Nobody watches the nightly runner, so a failed gate also uploads the
      # failed tests' evidence (failures/: digests, screenshots, UI hierarchy,
      # runner and crash logs) and the .xcresult bundles behind it. The report
      # artifact already carries exported failures; only this unwatched gate needs
      # the large result bundles for offline diagnosis.
      - name: Upload the failure evidence
        id: evidence
        if: failure() && steps.recorded.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-verify-nightly-failure-evidence
          path: |
            mobile/.verification/failures/
            mobile/.verification/xcresults/
          if-no-files-found: warn
          retention-days: 14

      - name: Report the failure in an issue
        if: failure() && steps.recorded.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.gate.outcome == 'failure' && 'The full mobile-verify gate failed' || steps.gate.outcome == 'success' && 'Recording the mobile-verify pass failed after the gate passed' || 'Setting up the full mobile-verify gate failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          title="Nightly mobile-verify failed"
          summary="$(cat mobile/.verification/summary.txt 2>/dev/null || echo 'mobile-verify wrote no summary')"
          body="$(
            cat <<EOF
          ${FAILED} on ${GITHUB_SHA}.

          Run: ${RUN_URL}

          Failure evidence (failure.md per failed test, screenshot, UI hierarchy, runner and crash logs, .xcresult; kept 14 days): ${EVIDENCE_URL:-not uploaded}

          \`\`\`\`text
          ${summary}
          \`\`\`\`
          EOF
          )"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # A passing night closes the failure issue an earlier night opened.
      - name: Close the failure issue
        if: success() && steps.recorded.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly mobile-verify failed"
          gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" |
            while read -r number; do
              gh issue close "$number" --comment "The full mobile-verify gate passed on ${GITHUB_SHA}: ${RUN_URL}"
            done
