name: "Triage audit"

on:
  schedule:
    - cron: "0 9 * * MON"
  issues:
    types: [opened, reopened, edited, labeled, unlabeled, closed]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - closed
      - edited
      - synchronize
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: |
            .github/triage-labels.json
            .github/portfolio-roadmap.json
            .github/scripts/portfolio-audit.cjs
            docs/requirements/roadmap.md
          sparse-checkout-cone-mode: false
      - name: "Audit issue readiness, authoritative PR linkage, and WIP"
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const {
              auditPortfolio,
              auditRoadmap,
            } = require('./.github/scripts/portfolio-audit.cjs');
            const vocab = JSON.parse(fs.readFileSync('.github/triage-labels.json', 'utf8'));
            const roadmapConfig = JSON.parse(
              fs.readFileSync('.github/portfolio-roadmap.json', 'utf8'),
            );
            const roadmapText = fs.readFileSync('docs/requirements/roadmap.md', 'utf8');

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issues = allIssues.filter(i => !i.pull_request);

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            async function loadLinkage(items, kind) {
              const result = new Map();
              for (let offset = 0; offset < items.length; offset += 25) {
                const chunk = items.slice(offset, offset + 25);
                const fields = chunk.map(item => kind === 'issue'
                  ? `item_${item.number}: issue(number: ${item.number}) {
                       number
                       closedByPullRequestsReferences(first: 20, includeClosedPrs: false) {
                         nodes { number state }
                       }
                     }`
                  : `item_${item.number}: pullRequest(number: ${item.number}) {
                       number
                       closingIssuesReferences(first: 20) { nodes { number state } }
                     }`
                ).join('\n');
                const data = await github.graphql(
                  `query($owner: String!, $repo: String!) {
                     repository(owner: $owner, name: $repo) { ${fields} }
                   }`,
                  { owner: context.repo.owner, repo: context.repo.repo },
                );
                for (const node of Object.values(data.repository)) {
                  if (!node) continue;
                  const refs = kind === 'issue'
                    ? node.closedByPullRequestsReferences.nodes
                        .filter(pr => pr.state === 'OPEN')
                        .map(pr => pr.number)
                    : node.closingIssuesReferences.nodes
                        .filter(issue => issue.state === 'OPEN')
                        .map(issue => issue.number);
                  result.set(node.number, refs);
                }
              }
              return result;
            }

            const issueLinkage = await loadLinkage(issues, 'issue');
            const prLinkage = await loadLinkage(prs, 'pr');
            const result = auditPortfolio({
              issues: issues.map(issue => ({
                ...issue,
                openClosingPrNumbers: issueLinkage.get(issue.number) || [],
              })),
              pullRequests: prs.map(pr => ({
                ...pr,
                closingIssueNumbers: prLinkage.get(pr.number) || [],
              })),
              vocabulary: vocab,
            });

            const issueStates = {};
            for (const entry of roadmapConfig.entries) {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: entry.issue,
              });
              issueStates[entry.issue] = data.state.toUpperCase();
            }
            const roadmapFindings = auditRoadmap(
              roadmapConfig.entries,
              issueStates,
              roadmapText,
            );

            const issueProblems = result.issueFindings.filter(item => item.problems.length);
            const lackingPriority = issueProblems.filter(item =>
              item.problems.includes('exactly one P0-P3 severity label'));
            const lackingTheme = issueProblems.filter(item =>
              item.problems.includes('at least one canonical theme label'));
            const activeReadiness = issueProblems.filter(item => item.active);

            const fmt = (list) => list
              .sort((a, b) => a.number - b.number)
              .map(i => `- #${i.number} — ${i.title}${i.problems ? `: ${i.problems.join(', ')}` : ''}`)
              .join('\n') || '_none_';

            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const filter = (q) => `https://github.com/${repo}/issues?q=${encodeURIComponent(q)}`;

            const summary = core.summary
              .addHeading('Portfolio and triage audit', 2)
              .addRaw(`**${issues.length}** open issues; **${prs.length}** open PRs.\n\n`)
              .addHeading(`${lackingPriority.length} lack exactly one P0/P1/P2/P3 severity label`, 3)
              .addRaw(`[Filter](${filter(`is:open is:issue -label:P0 -label:P1 -label:P2 -label:P3`)})\n\n`)
              .addRaw(fmt(lackingPriority))
              .addHeading(`${lackingTheme.length} lack any theme label`, 3)
              .addRaw(fmt(lackingTheme))
              .addHeading(`${activeReadiness.length} active issues fail a readiness/linkage gate`, 3)
              .addRaw(fmt(activeReadiness))
              .addHeading(`${issueProblems.length} total issue findings`, 3)
              .addRaw(fmt(issueProblems))
              .addHeading(`${result.unlinkedPullRequests.length} PRs have no authoritative closing issue`, 3)
              .addRaw(fmt(result.unlinkedPullRequests))
              .addHeading(`${roadmapFindings.length} roadmap/epic status mismatches`, 3)
              .addRaw(fmt(roadmapFindings.map(item => ({
                number: item.issue,
                title: `${item.row}: expected ${item.expected}; found ${item.actual || 'missing'}`,
              }))))
              .addHeading('WIP buffers', 3)
              .addRaw(`- Implementing: **${result.wip.implementing}/${result.wip.implementationLimit}**\n`)
              .addRaw(`- CI/review: **${result.wip.ciReview}/${result.wip.reviewLimit}**\n`)
              .addRaw('\nTriage with `/backlog`; portfolio contract: `docs/agent/improvement-drain.md`.\n');

            await summary.write();

            if (issueProblems.length > 0 || result.unlinkedPullRequests.length > 0 ||
                roadmapFindings.length > 0 ||
                result.wip.implementationExceeded || result.wip.reviewExceeded) {
              core.warning(
                `${issueProblems.length} issue finding(s), ` +
                `${result.unlinkedPullRequests.length} unlinked PR(s), ` +
                `${roadmapFindings.length} roadmap mismatch(es), ` +
                `WIP ${result.wip.implementing}/${result.wip.ciReview}`,
              );
            }
