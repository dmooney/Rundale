[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-28T00:00:00Z
reason = "Every minimatch release is listed as affected and the fix is minimatch 11, a new major that no consumer has adopted (the latest eslint, @eslint/eslintrc and @typescript-eslint/typescript-estree still require minimatch 3 or 10). In bug-report the copies are minimatch 3.1.5 (via @eslint/eslintrc and @eslint/config-array under eslint 9.39.5) and minimatch 10.2.6 (via @typescript-eslint/typescript-estree 8.71.0). All are lint tooling in devDependencies, not shipped in the production image. The flaw is in firstPhasePreProcess(), reached only when a caller passes optimizationLevel >= 2 (the default is 1); minimatch 3.1.5 has no optimizationLevel code at all, and no package in this dependency tree sets the option for these copies (checked by searching the installed packages). The patterns come from repository eslint and tsconfig configuration, not from attacker input. Reassess when a consumer moves to minimatch 11."
