<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cycle CD D pawns at 3x map scale</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        width: 2100px;
        margin: 0;
        padding: 34px;
        background: #f4f1e8;
        color: #27221b;
        font: 22px/1.35 Arial, Helvetica, sans-serif;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 38px;
      }

      .sub {
        margin: 0 0 26px;
        color: #6e665b;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 26px;
      }

      .card {
        padding: 10px;
        background: #fffdf8;
        border: 1px solid #cfc3af;
      }

      .label {
        margin: 0 0 8px;
        font-weight: 700;
      }

      img {
        display: block;
        width: 100%;
        height: 620px;
        object-fit: contain;
        background: #efe8db;
      }

      .note {
        margin-top: 24px;
        color: #6e665b;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Cycle CD: D-style pawns at 3x overhead map scale</h1>
    <p class="sub">Focused follow-up after choosing Cycle CC D's character treatment and the 3x map-scale direction.</p>

    <div class="grid">
      <section class="card">
        <p class="label">A richer character warmth</p>
        <img src="idea-cd-a-d-pawns-rich-3x-map.png" alt="Rich D-style pawns on 3x overhead map" />
      </section>
      <section class="card">
        <p class="label">B flatter gameplay base</p>
        <img src="idea-cd-b-d-pawns-flat-map-3x.png" alt="Flatter D-style pawns on 3x overhead map" />
      </section>
    </div>

    <p class="note">Preferred base: B for flatter map discipline; borrow a little of A's pawn warmth in the next pass.</p>
  </body>
</html>
