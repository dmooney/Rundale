# Corrected production-path profile for Google Gemini 3.5 Flash Lite via OpenRouter.
# The model requires reasoning. Google may spend more than 1,000 tokens at the
# "low" thinking level, so the completion budget must leave room for the
# player-visible JSON response after hidden reasoning.
[provider]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "google/gemini-3.5-flash-lite"

[provider.intent]
name = "simulator"

[provider.simulation]
name = "simulator"

[provider.reaction]
name = "simulator"

[engine.inference.dialogue_generation]
max_tokens = 2048
temperature = 0.7
frequency_penalty = 0.5
json_mode = true
enable_thinking = true
reasoning_effort = "low"
