# Exact production-path profile for Gemini 3.7 Flash through Google's native
# Interactions API. GOOGLE_API_KEY is resolved from the environment and is
# never persisted. Qualified by the immutable 2026-08-14 low-thinking run.
[provider]
name = "google"
base_url = "https://generativelanguage.googleapis.com/v1"
model = "gemini-3.7-flash"

[provider.intent]
name = "simulator"

[provider.simulation]
name = "simulator"

[provider.reaction]
name = "simulator"

[engine.inference.dialogue_generation]
max_tokens = 4096
temperature = 0.7
frequency_penalty = 0.5
json_mode = true
enable_thinking = true
reasoning_effort = "low"
