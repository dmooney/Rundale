# Exact qualified production-path profile for Google Gemini 3.7 Flash via OpenRouter.
# OPENROUTER_API_KEY is resolved from the environment and is never persisted.
[provider]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "google/gemini-3.7-flash"

[provider.intent]
name = "simulator"

[provider.simulation]
name = "simulator"

[provider.reaction]
name = "simulator"

[engine.inference.dialogue_generation]
max_tokens = 4096
temperature = 0.7
frequency_penalty = 0.5
json_mode = true
enable_thinking = true
reasoning_effort = "low"
