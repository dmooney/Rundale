# Exact production-path profile for OpenAI GPT-5.6 Sol via OpenRouter.
# OPENROUTER_API_KEY is resolved from the environment and is never persisted.
[provider]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-5.6-sol"

[provider.intent]
name = "simulator"

[provider.simulation]
name = "simulator"

[provider.reaction]
name = "simulator"

[engine.inference.dialogue_generation]
max_tokens = 768
temperature = 0.7
frequency_penalty = 0.5
json_mode = true
enable_thinking = false
reasoning_effort = "none"
