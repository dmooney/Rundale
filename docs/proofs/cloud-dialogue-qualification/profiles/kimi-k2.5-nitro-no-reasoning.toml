# Exact production-path profile for the controlled Kimi K2.5 retest.
# OPENROUTER_API_KEY is resolved from the environment and is never persisted.
[provider]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "moonshotai/kimi-k2.5:nitro"

[provider.intent]
name = "simulator"

[provider.simulation]
name = "simulator"

[provider.reaction]
name = "simulator"

[engine.inference.dialogue_generation]
max_tokens = 768
temperature = 0.7
frequency_penalty = 0.5
json_mode = true
enable_thinking = false
