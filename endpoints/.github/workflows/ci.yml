name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: limerick
          POSTGRES_PASSWORD: limerick
          POSTGRES_DB: limerick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U limerick -d limerick_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL_TEST: postgres://limerick:limerick@127.0.0.1:5432/limerick_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="$DATABASE_URL_TEST" pnpm db:migrate
      - run: pnpm check
