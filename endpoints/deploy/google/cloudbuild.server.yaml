steps:
  - name: gcr.io/cloud-builders/docker
    dir: endpoints
    args:
      - build
      - --file
      - Dockerfile.server
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
# Builds run as limerick-build, a user-specified service account, which Cloud
# Build accepts only with a logs bucket or Cloud Logging alone.
options:
  logging: CLOUD_LOGGING_ONLY
