services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: limerick
      POSTGRES_PASSWORD: limerick
      POSTGRES_DB: limerick
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limerick -d limerick"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - limerick-postgres:/var/lib/postgresql/data

volumes:
  limerick-postgres:
