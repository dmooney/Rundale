[workspace]
resolver = "2"
members = [
    "crates/limerick-core",
    "crates/limerick-server",
    "crates/limerick-engine",
    "crates/limerick-mcp",
    "crates/limerick-tauri",
    "crates/limerick-geo-tool",
    "crates/limerick-types",
    "crates/limerick-config",
    "crates/limerick-providers",
    "crates/limerick-setup",
    "crates/limerick-inference",
    "crates/limerick-world",
    "crates/limerick-palette",
    "crates/limerick-npc",
    "crates/limerick-npc-tool",
    "crates/limerick-mod",
    "crates/limerick-editor",
    "crates/limerick-chronicle",
    "crates/limerick-diagnostics",
    "crates/limerick-persistence",
    "crates/limerick-input",
    "crates/limerick-client",
    "crates/limerick-harness",
    "crates/limerick-scenario",
]
# limerick-mcp is a default member so a plain `cargo build` / `just build` produces the
# stdio MCP binary as part of the normal build — without it, a cold worktree has no
# limerick-mcp binary at session init, the launcher's old synchronous build overran the
# MCP init window, and the `mcp__limerick__*` tools never registered (limerick-mcp-cold-register).
default-members = ["crates/limerick-engine", "crates/limerick-mcp"]

# ---------------------------------------------------------------------------
# Workspace-level version pins (#698)
#
# All shared external dependencies are declared here with a canonical version.
# Individual crates reference them with `{ workspace = true }` and may add
# extra features with `{ workspace = true, features = ["extra"] }`.
#
# Internal crate paths are also listed here so path references stay in sync.
# ---------------------------------------------------------------------------
[workspace.dependencies]

# Internal crates
limerick-types = { path = "crates/limerick-types" }
limerick-config = { path = "crates/limerick-config" }
limerick-providers = { path = "crates/limerick-providers" }
limerick-setup = { path = "crates/limerick-setup" }
limerick-inference = { path = "crates/limerick-inference" }
limerick-world = { path = "crates/limerick-world" }
limerick-palette = { path = "crates/limerick-palette" }
limerick-npc = { path = "crates/limerick-npc" }
limerick-mod = { path = "crates/limerick-mod" }
limerick-editor = { path = "crates/limerick-editor" }
limerick-chronicle = { path = "crates/limerick-chronicle" }
limerick-diagnostics = { path = "crates/limerick-diagnostics" }
limerick-persistence = { path = "crates/limerick-persistence" }
limerick-input = { path = "crates/limerick-input" }
limerick-core = { path = "crates/limerick-core" }
limerick-engine = { path = "crates/limerick-engine" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = { version = "1.2", features = ["chrono04"] }
fs2 = "0.4"
sha2 = "0.11"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "sync-secret-service", "crypto-rust", "vendored"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# HTTP client — base features; crates needing json/stream add them locally
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# HuggingFace Hub client (Apache-2.0). Used by limerick-inference for the
# vllm-mlx onboarding download path. `tokio` feature gives the async API.
hf-hub = { version = "0.5", default-features = false, features = ["tokio"] }

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# Time and dates
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-client"] }

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Configuration / environment
toml = "1.1"
dotenvy = "0.15"

# Miscellaneous shared utilities
rand = "0.10"
strsim = "0.11"
regex = "1"
governor = "0.10"
lru = "0.18"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

# Dev / test utilities
tempfile = "3"
wiremock = "0.6"
tokio-test = "0.4"
serial_test = "4"
rand_chacha = "0.10"
tracing-test = "0.2"
windows-sys = "0.61"
libc = "0.2"

# Temporary upstream security pins for target-specific paths retained in the
# lockfile. Both crates keep their published package versions while the pinned
# git trees move quick-xml to 0.41, fixing RUSTSEC-2026-0194 and
# RUSTSEC-2026-0195. The wayland-scanner tree also contains unreleased breaking
# codegen, edition-2024, and MSRV changes; neither patched crate may become
# reachable on a supported target while these pins remain. The Security audit
# workflow enforces that invariant. Remove each patch after its next crates.io
# release contains the cited commit.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
wayland-scanner = { git = "https://github.com/Smithay/wayland-rs", rev = "d07c4f91f28b42e5a485823ffd9d8d5a210b1053" }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
