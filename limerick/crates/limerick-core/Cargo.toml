[package]
name = "limerick-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Orchestration layer for the Limerick engine: game session, IPC, mod loading, prompts"

[features]
# `desktop` (default) is the full desktop composition: local-inference
# bootstrap, the Limerick Designer backend, on-disk chronicle writers, and
# debug diagnostics. `mobile` is the portable configuration built with
# `--no-default-features --features mobile`; it keeps the leaf crates (world,
# NPC, input, persistence, mod loading, palette) and excludes every
# desktop-only dependency. CI checks the mobile configuration.
default = ["desktop"]
desktop = [
    "dep:limerick-editor",
    "dep:limerick-chronicle",
    "dep:limerick-diagnostics",
    "limerick-inference/desktop",
]
mobile = ["limerick-inference/mobile"]

[dependencies]
limerick-types = { workspace = true }
limerick-config = { workspace = true }
limerick-inference = { workspace = true }
limerick-world = { workspace = true }
limerick-palette = { workspace = true }
limerick-npc = { workspace = true }
limerick-mod = { workspace = true }
limerick-editor = { workspace = true, optional = true }
limerick-chronicle = { workspace = true, optional = true }
limerick-diagnostics = { workspace = true, optional = true }
limerick-persistence = { workspace = true }
limerick-input = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
toml = { workspace = true }
base64 = "0.23"
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
regex = { workspace = true }
serial_test = { workspace = true }

# Integration tests that use the desktop-only Designer backend or
# diagnostics. Every other test also builds and runs under the mobile
# configuration.
[[test]]
name = "ipc_field_parity"
required-features = ["desktop"]

[[test]]
name = "normalize_mod"
required-features = ["desktop"]
