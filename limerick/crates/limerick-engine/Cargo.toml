[package]
name = "limerick-engine"
version = "0.1.0"
edition = "2024"
description = "An Irish Living World Text Adventure — in-process engine entry point (headless REPL / web server / Tauri launch)"
license = "GPL-3.0-only"
publish = false
default-run = "limerick-engine"

[[bin]]
name = "limerick-engine"
path = "src/main.rs"

[lib]
name = "limerick_engine"
path = "src/lib.rs"

[dependencies]
limerick-core = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true, features = ["env"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
keyring = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
limerick-types = { workspace = true }
serial_test = { workspace = true }
