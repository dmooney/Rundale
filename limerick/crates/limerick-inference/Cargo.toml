[package]
name = "limerick-inference"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "LLM inference queue and provider clients (OpenAI/Anthropic/simulator) for Limerick"

[features]
# `desktop` keeps the local-model bootstrap (limerick-setup, re-exported as
# `setup`), the Ollama/vllm process handle (`client`) and HuggingFace model
# download (`hf_downloader`) at their historical public paths. `mobile` is the
# portable queue/worker/validation/transport surface for hosts that cannot
# manage local model processes.
default = ["desktop"]
desktop = ["dep:limerick-setup", "dep:hf-hub"]
mobile = []

[dependencies]
limerick-types = { workspace = true }
limerick-config = { workspace = true }
limerick-providers = { workspace = true }
# limerick-setup owns the local-inference bootstrap (GPU detect, model select,
# Ollama/vllm provider bootstrap). It was split out of this crate; we depend on
# it and re-export it at the unchanged `limerick_inference::setup::*` path so
# downstream consumers need no import change. The edge is one-directional:
# limerick-setup does NOT depend back on limerick-inference (it reaches the client
# factory and rate limiter via limerick-providers), so there is no cycle.
limerick-setup = { workspace = true, optional = true }
# reqwest stays a direct dep: validate.rs (provider reachability/auth probes)
# and hf_downloader.rs (model download) make their own HTTP calls. Only the
# `json` feature is needed here; the streaming clients (and the `stream`
# feature) live in limerick-providers. (The Ollama/vllm reachability + warmup
# HTTP calls moved out with setup/ into limerick-setup.)
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hf-hub = { workspace = true, optional = true }

tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }

# These targets exercise the desktop-only bootstrap (`setup`, `hf_downloader`).
[[test]]
name = "hf_downloader_tests"
required-features = ["desktop"]

[[test]]
name = "http_mock_tests"
required-features = ["desktop"]

[[example]]
name = "vllm_mlx_spawn"
required-features = ["desktop"]
