[package]
name = "limerick-mobile-ffi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "C boundary between the native iPhone client and the shared Limerick engine"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# The shared engine in its portable configuration. There is no mobile-only
# runtime: the boundary drives `limerick_core::turn::TurnEngine`.
limerick-core = { path = "../limerick-core", default-features = false, features = ["mobile"] }
# The iPhone app's bug report (`bug_report`). Portable only: the GitHub
# reporter (`github` feature) stays off.
limerick-diagnostics = { path = "../limerick-diagnostics", default-features = false }
serde_json = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# Edits a closed save to reproduce an interrupted new game (#2210).
rusqlite = { workspace = true }
tempfile = { workspace = true }
