[package]
name = "limerick-persistence"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "SQLite save/load with WAL journal and branching saves for the Limerick engine"

[dependencies]
limerick-types = { workspace = true }
limerick-world = { workspace = true }
limerick-npc = { workspace = true }
