  <path d="M2 80 C236 79 475 76 713 79 C883 81 1045 80 1200 77 L1200 82 L0 82 Z" fill="#3b2b1a" opacity=".26"/>
  <rect x="0" y="0" width="1200" height="82" fill="transparent" filter="url(#grain)"/>
