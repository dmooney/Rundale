<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 82" preserveAspectRatio="none">
  <defs>
    <filter id="grain" x="-4%" y="-20%" width="108%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.16" numOctaves="4" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
