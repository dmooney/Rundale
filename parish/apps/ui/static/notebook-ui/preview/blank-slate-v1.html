<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Blank Parish Notebook UI Concept V1</title>
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #252315;
			}

			body {
				display: grid;
				place-items: center;
				padding: 24px;
			}

			.concept {
				position: relative;
				width: min(100vw - 48px, 1672px);
				aspect-ratio: 1672 / 941;
				overflow: hidden;
				background:
					radial-gradient(
						circle at 18% 20%,
						rgba(210, 218, 174, 0.5),
						transparent 23%
					),
					radial-gradient(
						circle at 68% 22%,
						rgba(151, 169, 105, 0.52),
						transparent 31%
					),
					radial-gradient(
						circle at 32% 74%,
						rgba(108, 118, 73, 0.62),
						transparent 32%
					),
					radial-gradient(
						circle at 78% 82%,
						rgba(94, 104, 78, 0.52),
						transparent 30%
					),
					linear-gradient(135deg, #5f6844 0%, #8a9460 42%, #626b47 100%);
				box-shadow:
					0 24px 70px rgba(0, 0, 0, 0.55),
					inset 0 0 0 2px rgba(34, 25, 14, 0.55);
			}

			.concept::before {
				content: '';
				position: absolute;
				inset: 0;
				background:
					linear-gradient(
						26deg,
						transparent 0 39%,
						rgba(176, 143, 91, 0.35) 40% 45%,
						transparent 46%
					),
					linear-gradient(
						146deg,
						transparent 0 48%,
						rgba(198, 168, 112, 0.3) 49% 53%,
						transparent 54%
					),
					radial-gradient(
						ellipse at 50% 48%,
						transparent 48%,
						rgba(24, 18, 10, 0.36) 100%
					);
				mix-blend-mode: multiply;
				pointer-events: none;
			}

			.concept::after {
				content: '';
				position: absolute;
				inset: 0;
				background-image:
					linear-gradient(rgba(34, 25, 14, 0.045) 1px, transparent 1px),
					linear-gradient(90deg, rgba(34, 25, 14, 0.035) 1px, transparent 1px);
				background-size: 48px 48px;
				opacity: 0.7;
				pointer-events: none;
			}

			.asset {
				position: absolute;
				z-index: 2;
				display: block;
				object-fit: fill;
				user-select: none;
				-webkit-user-drag: none;
				filter: drop-shadow(0 10px 14px rgba(20, 14, 8, 0.3));
			}

			.top {
				left: 3.2%;
				top: 2.6%;
				width: 93.5%;
				height: 10.2%;
			}

			.rail {
				left: 2.8%;
				top: 18.2%;
				width: 12.4%;
				height: 72.4%;
			}

			.page {
				right: 9.4%;
				top: 10.9%;
				width: 28.4%;
				height: 68.2%;
			}

			.tabs {
				position: absolute;
				right: 3.5%;
				top: 16.7%;
				z-index: 3;
				width: 8.3%;
				display: grid;
				gap: 1.9vh;
			}

			.tabs img {
				width: 100%;
				height: 6.8vh;
				min-height: 54px;
				object-fit: fill;
				filter: drop-shadow(0 6px 8px rgba(20, 14, 8, 0.26));
			}

			.actions {
				position: absolute;
				left: 50%;
				bottom: 10.3%;
				z-index: 4;
				width: 34%;
				transform: translateX(-50%);
				display: grid;
				grid-template-columns: repeat(5, 1fr);
				gap: 1.3%;
			}

			.actions img {
				width: 100%;
				aspect-ratio: 1.02 / 1;
				object-fit: fill;
				filter: drop-shadow(0 7px 10px rgba(20, 14, 8, 0.28));
			}

			.intent {
				left: 27.4%;
				bottom: 2.7%;
				width: 45.6%;
				height: 12.4%;
			}

			.map-card {
				left: 2.6%;
				bottom: 2.4%;
				width: 10%;
				height: 13.5%;
			}

			.time-card {
				left: 12.7%;
				bottom: 2.4%;
				width: 10%;
				height: 13.5%;
			}

			.active {
				right: 2.8%;
				bottom: 2.5%;
				width: 25.8%;
				height: 13.8%;
			}

			@media (max-width: 720px) {
				body {
					align-items: start;
					padding: 0;
				}

				.concept {
					width: 100vw;
					min-height: 100vh;
					aspect-ratio: auto;
				}

				.top {
					left: 0;
					top: 0;
					width: 100%;
					height: 14%;
				}

				.rail {
					left: 3%;
					top: 48%;
					width: 20%;
					height: 40%;
					object-fit: fill;
				}

				.page {
					left: 25%;
					right: auto;
					top: 42%;
					width: 66%;
					height: 47%;
				}

				.tabs {
					left: auto;
					right: 1.5%;
					top: 44%;
					width: 17%;
					grid-template-columns: 1fr;
					gap: 1.2vh;
				}

				.tabs img {
					height: 48px;
				}

				.actions {
					left: 26%;
					bottom: 11.5%;
					width: 68%;
					transform: none;
				}

				.intent {
					left: 4%;
					bottom: 2%;
					width: 92%;
					height: 10%;
				}

				.map-card,
				.time-card,
				.active {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<main class="concept" aria-label="Blank parish notebook UI concept">
			<img
				class="asset top"
				src="/notebook-ui/generated/top-banner-v1.png"
				alt=""
			/>
			<img
				class="asset rail"
				src="/notebook-ui/generated/people-rail-v1.png"
				alt=""
			/>
			<img
				class="asset page"
				src="/notebook-ui/generated/notebook-page-v1.png"
				alt=""
			/>
			<nav class="tabs" aria-hidden="true">
				<img src="/notebook-ui/generated/tab-v1-notes.png" alt="" />
				<img src="/notebook-ui/generated/tab-v1-people.png" alt="" />
				<img src="/notebook-ui/generated/tab-v1-places.png" alt="" />
				<img src="/notebook-ui/generated/tab-v1-rumours.png" alt="" />
				<img src="/notebook-ui/generated/tab-v1-journal.png" alt="" />
			</nav>
			<div class="actions" aria-hidden="true">
				<img src="/notebook-ui/generated/action-card-v1-a.png" alt="" />
				<img src="/notebook-ui/generated/action-card-v1-b.png" alt="" />
				<img src="/notebook-ui/generated/action-card-v1-c.png" alt="" />
				<img src="/notebook-ui/generated/action-card-v1-a.png" alt="" />
				<img src="/notebook-ui/generated/action-card-v1-b.png" alt="" />
			</div>
			<img
				class="asset intent"
				src="/notebook-ui/generated/intent-slip-v1.png"
				alt=""
			/>
			<img
				class="asset map-card"
				src="/notebook-ui/generated/small-card-v1-a.png"
				alt=""
			/>
			<img
				class="asset time-card"
				src="/notebook-ui/generated/small-card-v1-b.png"
				alt=""
			/>
			<img
				class="asset active"
				src="/notebook-ui/generated/active-intents-card-v1.png"
				alt=""
			/>
		</main>
	</body>
</html>
