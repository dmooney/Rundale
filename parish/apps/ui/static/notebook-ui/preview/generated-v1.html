<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Generated Notebook UI Assets V1</title>
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #292719;
				color: #eadbb7;
				font-family: Georgia, serif;
			}

			body {
				padding: 22px;
			}

			h1 {
				margin: 0 0 16px;
				font-size: 18px;
				font-style: italic;
				font-weight: 400;
			}

			.sheet {
				width: min(100%, 1280px);
				display: block;
				margin-bottom: 22px;
				background:
					linear-gradient(
						45deg,
						rgba(255, 255, 255, 0.08) 25%,
						transparent 25% 75%,
						rgba(255, 255, 255, 0.08) 75%
					),
					linear-gradient(
						45deg,
						rgba(255, 255, 255, 0.08) 25%,
						transparent 25% 75%,
						rgba(255, 255, 255, 0.08) 75%
					),
					#45402c;
				background-position:
					0 0,
					10px 10px;
				background-size: 20px 20px;
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
				gap: 16px;
				align-items: center;
			}

			figure {
				margin: 0;
				min-height: 160px;
				padding: 14px;
				display: grid;
				place-items: center;
				background:
					linear-gradient(
						45deg,
						rgba(255, 255, 255, 0.08) 25%,
						transparent 25% 75%,
						rgba(255, 255, 255, 0.08) 75%
					),
					linear-gradient(
						45deg,
						rgba(255, 255, 255, 0.08) 25%,
						transparent 25% 75%,
						rgba(255, 255, 255, 0.08) 75%
					),
					#45402c;
				background-position:
					0 0,
					10px 10px;
				background-size: 20px 20px;
				border: 1px solid rgba(234, 219, 183, 0.25);
			}

			figure.wide {
				grid-column: 1 / -1;
			}

			img {
				max-width: 100%;
				max-height: 260px;
				object-fit: contain;
			}

			figcaption {
				margin-top: 10px;
				color: #d2bf93;
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<h1>Generated Notebook UI Assets V1</h1>
		<img
			class="sheet"
			src="/notebook-ui/generated/notebook-ui-sheet-v1-alpha.png"
			alt="Full transparent generated asset sheet"
		/>
		<section class="grid">
			<figure class="wide">
				<img src="/notebook-ui/generated/top-banner-v1.png" alt="" />
				<figcaption>top-banner-v1.png</figcaption>
			</figure>
			<figure>
				<img src="/notebook-ui/generated/people-rail-v1.png" alt="" />
				<figcaption>people-rail-v1.png</figcaption>
			</figure>
			<figure>
				<img src="/notebook-ui/generated/notebook-page-v1.png" alt="" />
				<figcaption>notebook-page-v1.png</figcaption>
			</figure>
			<figure>
				<img src="/notebook-ui/generated/tab-v1-notes.png" alt="" />
				<figcaption>tab-v1-notes.png</figcaption>
			</figure>
			<figure>
				<img src="/notebook-ui/generated/action-card-v1-a.png" alt="" />
				<figcaption>action-card-v1-a.png</figcaption>
			</figure>
			<figure>
				<img src="/notebook-ui/generated/small-card-v1-a.png" alt="" />
				<figcaption>small-card-v1-a.png</figcaption>
			</figure>
			<figure class="wide">
				<img src="/notebook-ui/generated/intent-slip-v1.png" alt="" />
				<figcaption>intent-slip-v1.png</figcaption>
			</figure>
			<figure class="wide">
				<img src="/notebook-ui/generated/active-intents-card-v1.png" alt="" />
				<figcaption>active-intents-card-v1.png</figcaption>
			</figure>
		</section>
	</body>
</html>
