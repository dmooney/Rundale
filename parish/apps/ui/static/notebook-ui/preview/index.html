<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Parish Notebook UI Asset Preview</title>
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #3d3825;
				color: #2a2118;
				font-family: Georgia, serif;
			}

			body {
				padding: 24px;
			}

			.scene {
				position: relative;
				width: min(1200px, calc(100vw - 48px));
				aspect-ratio: 16 / 9;
				margin: 0 auto 24px;
				background:
					linear-gradient(rgba(20, 14, 8, 0.06), rgba(20, 14, 8, 0.18)),
					url('/notebook-ui/scene-crossroads.png') center / cover;
				box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
				overflow: hidden;
			}

			.top {
				position: absolute;
				left: 0;
				right: 0;
				top: 0;
				height: 70px;
				background: url('/notebook-ui/assets/paper-strip.svg') center / 100%
					100%;
			}

			.rail {
				position: absolute;
				left: 0;
				top: 190px;
				width: 145px;
				height: 450px;
				padding: 24px 18px;
				background: url('/notebook-ui/assets/left-rail.svg') center / 100% 100%;
			}

			.page {
				position: absolute;
				right: 70px;
				top: 80px;
				width: 312px;
				height: 500px;
				padding: 58px 38px 40px 58px;
				background: url('/notebook-ui/assets/notebook-page.svg') center / 100%
					100%;
			}

			.tabs {
				position: absolute;
				right: 10px;
				top: 116px;
				display: grid;
				gap: 10px;
			}

			.tab {
				width: 78px;
				height: 66px;
				display: grid;
				place-items: center;
				background: url('/notebook-ui/assets/notebook-tab.svg') center / 100%
					100%;
				font-size: 13px;
			}

			.actions {
				position: absolute;
				left: 50%;
				bottom: 86px;
				transform: translateX(-50%);
				display: flex;
			}

			.action {
				width: 94px;
				height: 70px;
				display: grid;
				place-items: center;
				background: url('/notebook-ui/assets/action-card.svg') center / 100%
					100%;
			}

			.action img {
				width: 34px;
				height: 34px;
			}

			.intent {
				position: absolute;
				left: 50%;
				bottom: 22px;
				width: 640px;
				height: 78px;
				transform: translateX(-50%);
				background: url('/notebook-ui/assets/intent-slip.svg') center / 100%
					100%;
			}

			.small {
				position: absolute;
				left: 20px;
				bottom: 0;
				width: 116px;
				height: 104px;
				display: grid;
				place-items: center;
				background: url('/notebook-ui/assets/card-small.svg') center / 100% 100%;
			}

			.small img {
				width: 42px;
			}

			.portrait {
				width: 58px;
				height: 70px;
				background: url('/notebook-ui/assets/portrait-slot.svg') center /
					contain no-repeat;
			}

			.asset-grid {
				width: min(1200px, calc(100vw - 48px));
				margin: 0 auto;
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
				gap: 14px;
			}

			.tile {
				min-height: 120px;
				padding: 16px;
				display: grid;
				place-items: center;
				background: rgba(245, 230, 198, 0.7);
				border: 1px solid rgba(40, 32, 20, 0.3);
			}

			.tile img {
				max-width: 100%;
				max-height: 92px;
			}
		</style>
	</head>
	<body>
		<main class="scene" aria-label="Composed asset preview">
			<div class="top"></div>
			<aside class="rail">
				<div class="portrait"></div>
				<div class="portrait"></div>
				<div class="portrait"></div>
			</aside>
			<section class="page">Blank notebook page asset</section>
			<nav class="tabs">
				<div class="tab">Notes</div>
				<div class="tab">People</div>
				<div class="tab">Places</div>
			</nav>
			<div class="actions">
				<div class="action">
					<img src="/notebook-ui/assets/icon-talk.svg" alt="" />
				</div>
				<div class="action">
					<img src="/notebook-ui/assets/icon-ask.svg" alt="" />
				</div>
				<div class="action">
					<img src="/notebook-ui/assets/icon-help.svg" alt="" />
				</div>
				<div class="action">
					<img src="/notebook-ui/assets/icon-observe.svg" alt="" />
				</div>
				<div class="action">
					<img src="/notebook-ui/assets/icon-leave.svg" alt="" />
				</div>
			</div>
			<div class="intent"></div>
			<div class="small">
				<img src="/notebook-ui/assets/icon-map.svg" alt="" />
			</div>
		</main>
		<section class="asset-grid" aria-label="Individual assets">
			<div class="tile">
				<img src="/notebook-ui/assets/paper-card.svg" alt="paper card" />
			</div>
			<div class="tile">
				<img src="/notebook-ui/assets/notebook-page.svg" alt="notebook page" />
			</div>
			<div class="tile">
				<img src="/notebook-ui/assets/notebook-tab.svg" alt="tab" />
			</div>
			<div class="tile">
				<img src="/notebook-ui/assets/action-card.svg" alt="action card" />
			</div>
			<div class="tile">
				<img src="/notebook-ui/assets/intent-slip.svg" alt="intent slip" />
			</div>
			<div class="tile">
				<img src="/notebook-ui/assets/portrait-slot.svg" alt="portrait slot" />
			</div>
			<div class="tile">
				<img src="/notebook-ui/assets/icon-time.svg" alt="time icon" />
			</div>
			<div class="tile">
				<img src="/notebook-ui/assets/icon-map.svg" alt="map icon" />
			</div>
		</section>
	</body>
</html>
