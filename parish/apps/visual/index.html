<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Rundale Visual</title>
        <link rel="stylesheet" href="/src/styles.css" />
        <script type="module" src="/src/main.js"></script>
    </head>
    <body>
        <main class="game-shell" aria-label="Rundale visual game">
            <section id="game-stage" class="game-stage" aria-label="Scene"></section>

            <header class="top-hud" aria-label="Scene status">
                <p id="location-label">Rundale</p>
                <p id="status-label" aria-live="polite">Loading</p>
            </header>

            <section class="bottom-hud" aria-label="Game text">
                <p id="caption" class="caption" aria-live="polite">Loading scene</p>
                <div id="action-prompt" class="action-prompt" hidden>
                    <button id="action-button" type="button"></button>
                    <span id="action-label"></span>
                </div>
                <details id="command-panel" class="command-panel">
                    <summary aria-label="Command fallback" title="Command fallback"></summary>
                    <form id="command-form" class="command-form">
                        <input
                            id="command-input"
                            name="command"
                            type="text"
                            placeholder="Type a command"
                            autocomplete="off"
                        />
                        <button type="submit">Send</button>
                    </form>
                </details>
                <details class="log-panel">
                    <summary aria-label="Story log" title="Story log"></summary>
                    <ol id="turn-log" class="turn-log" aria-live="polite"></ol>
                </details>
            </section>

            <details class="settings-panel">
                <summary aria-label="Connection settings" title="Connection settings"></summary>
                <form id="settings-form" class="settings-form">
                    <input
                        id="backend-url"
                        name="backendUrl"
                        type="url"
                        aria-label="Backend server URL"
                        placeholder="same origin"
                        autocomplete="off"
                    />
                    <div class="settings-actions">
                        <button
                            class="icon-button connect-button"
                            type="submit"
                            aria-label="Connect to backend"
                            title="Connect to backend"
                        ></button>
                        <button
                            id="refresh-button"
                            class="icon-button refresh-button"
                            type="button"
                            aria-label="Refresh scene"
                            title="Refresh scene"
                        ></button>
                    </div>
                </form>
            </details>
        </main>
    </body>
</html>
