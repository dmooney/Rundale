[package]
name = "parish-client"
version = "0.1.0"
edition = "2024"
description = "Synchronous CLI client for the Parish game server"
license = "GPL-3.0-only"
publish = false
default-run = "parish"

[[bin]]
name = "parish"
path = "src/main.rs"

[dependencies]
reqwest = { workspace = true, features = ["json", "cookies"] }
clap = { workspace = true, features = ["env"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = "5"
