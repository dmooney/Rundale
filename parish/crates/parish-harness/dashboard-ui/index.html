<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parish Harness Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #151823;
      --panel-2: #11141d;
      --line: #232838;
      --line-soft: #1b2030;
      --ink: #d8dae2;
      --ink-dim: #8a8fa3;
      --ink-faint: #5c6175;
      --brass: #c9b99a;
      --brass-dim: #9d8f74;
      --blue: #7fa3d8;
      --blue-deep: #5080c0;
      --green: #6dbf6d;
      --red: #d2706a;
      --amber: #cfa14e;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: "Avenir Next", Avenir, Seravek, "Segoe UI", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--ink);
      padding: 2rem clamp(1.25rem, 4vw, 3rem) 3rem; max-width: 1180px; margin: 0 auto;
      line-height: 1.5; font-size: 15px;
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,185,154,.045), transparent);
    }
    h1 {
      font-size: 1.15rem; color: var(--brass); font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase;
    }
    h1::after { content: ""; display: block; width: 2.2rem; height: 2px; background: var(--brass-dim); margin-top: .5rem; border-radius: 1px; opacity: .6; }
    h2 { font-size: .8rem; margin: 1.5rem 0 .75rem; color: var(--brass-dim); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    h3 { font-size: .72rem; margin: 1.75rem 0 .6rem; color: var(--ink-dim); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 2px; }
    code { font-family: var(--mono); font-size: .85em; color: var(--ink-dim); }
    .badge {
      display: inline-flex; align-items: center; gap: .35em;
      padding: .12rem .55rem; border-radius: 99px;
      font-size: .68rem; font-weight: 600; letter-spacing: .05em;
      font-family: var(--mono); border: 1px solid transparent;
    }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge-completed { background: rgba(109,191,109,.08); color: var(--green); border-color: rgba(109,191,109,.25); }
    .badge-gated { background: rgba(210,112,106,.08); color: var(--red); border-color: rgba(210,112,106,.25); }
    .badge-in_progress { background: rgba(127,163,216,.08); color: var(--blue); border-color: rgba(127,163,216,.25); }
    .badge-in_progress::before { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    table {
      width: 100%; border-collapse: separate; border-spacing: 0; font-size: .84rem;
      background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 10px; overflow: hidden;
    }
    th {
      text-align: left; padding: .6rem .85rem; border-bottom: 1px solid var(--line);
      color: var(--ink-faint); font-weight: 600; font-size: .68rem;
      letter-spacing: .1em; text-transform: uppercase; background: var(--panel);
      white-space: nowrap;
    }
    td { padding: .55rem .85rem; border-bottom: 1px solid var(--line-soft); color: var(--ink-dim); }
    td:first-child { font-family: var(--mono); color: var(--ink-faint); }
    tbody tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(127,163,216,.045); }
    tr.clickable { cursor: pointer; }
    tr.clickable td { transition: background .12s ease; }
    #detail { margin-top: 1.5rem; display: none; }
    #detail.visible { display: block; animation: rise .25s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    .axes-radar { display: block; margin: .25rem 0 .5rem; max-width: 100%; height: auto; }
    .radar-panel { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 10px; padding: .5rem 1rem; display: inline-block; }
    .finding {
      background: var(--panel-2); border: 1px solid var(--line-soft);
      border-left: 3px solid var(--sev, #5c4a30); padding: .65rem .9rem; margin: .5rem 0;
      border-radius: 8px; font-size: .84rem; color: var(--ink-dim); line-height: 1.55;
    }
    .finding.severity-critical { --sev: #d2706a; }
    .finding.severity-high { --sev: #cf8a4e; }
    .finding.severity-medium { --sev: #cfa14e; }
    .finding.severity-low { --sev: #5c4a30; }
    .finding-head { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; margin-bottom: .25rem; }
    .finding-cat { color: var(--ink); font-weight: 600; }
    .finding-sev { font-family: var(--mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--sev, var(--ink-faint)); }
    .finding-turn { font-family: var(--mono); font-size: .72rem; color: var(--ink-faint); }
    .finding-sig {
      display: inline-block; margin-top: .4rem; font-family: var(--mono); font-size: .68rem;
      color: var(--ink-faint); background: rgba(127,163,216,.06);
      border: 1px solid var(--line-soft); border-radius: 5px; padding: .1rem .45rem;
      word-break: break-all;
    }
    .turn-gallery { display: flex; gap: .5rem; flex-wrap: wrap; margin: .5rem 0; }
    .turn-thumb { display: flex; flex-direction: column; align-items: center; gap: .2rem; }
    .turn-thumb img { width: 80px; height: 60px; object-fit: cover; border: 1px solid #2a2a2a; border-radius: 3px; background: #111; cursor: zoom-in; transition: border-color .12s ease; }
    .turn-thumb img:hover { border-color: #7fa3d8; }
    .turn-thumb.clickable { cursor: default; }
    .turn-thumb.clickable:hover img, .turn-thumb.active img { border-color: #5080c0; }
    .turn-thumb.active img { box-shadow: 0 0 0 1px #5080c0; }
    .turn-thumb-label { font-size: .68rem; color: #666; }
    .turn-thumb-label.log-link { cursor: pointer; color: var(--blue); }
    .turn-thumb-label.log-link:hover { text-decoration: underline; text-underline-offset: 2px; }
    /* Lightbox overlay */
    #zoom-overlay {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.88);
      align-items: center; justify-content: center;
      cursor: zoom-out; outline: none;
    }
    #zoom-overlay.open { display: flex; animation: overlay-in .15s ease both; }
    @keyframes overlay-in { from { opacity: 0; } }
    #zoom-overlay img {
      max-width: min(96vw, 1200px); max-height: 90vh;
      object-fit: contain; border-radius: 4px;
      box-shadow: 0 4px 32px rgba(0,0,0,.7);
      cursor: default;
    }
    #zoom-close {
      position: fixed; top: 1rem; right: 1.25rem;
      font-size: 1.6rem; line-height: 1; color: #bbb;
      background: none; border: none; cursor: pointer;
      padding: .25rem .5rem; border-radius: 4px;
    }
    #zoom-close:hover { color: #fff; background: rgba(255,255,255,.08); }
    .turn-log { margin: .5rem 0 1rem; background: #14141c; border: 1px solid #23232e; border-radius: 5px; padding: .6rem .8rem; font-size: .82rem; }
    .turn-log h4 { font-size: .9rem; color: #a89880; margin: 0 0 .4rem; }
    .tl-line { margin: .15rem 0; line-height: 1.45; }
    .tl-speaker { color: #9bb3e0; font-weight: 600; margin-right: .35rem; }
    .turn-log details { margin-top: .5rem; border-top: 1px solid #23232e; padding-top: .4rem; }
    .turn-log summary { cursor: pointer; color: #8a8a96; font-size: .78rem; }
    .tl-infer { margin: .5rem 0; }
    .tl-infer-head { font-size: .72rem; color: #666; margin-bottom: .2rem; }
    .tl-infer pre { white-space: pre-wrap; word-break: break-word; background: #0d0d13; border: 1px solid #20202a; border-radius: 4px; padding: .4rem .5rem; margin: .15rem 0; font-size: .75rem; color: #cfcfd6; }
    #turn-log:not(:empty) { margin-top: 1.5rem; }
    .error-msg { color: #c06060; padding: .5rem; background: #1a0f0f; border-radius: 4px; margin: .5rem 0; font-size: .82rem; }
    .loading { color: #888; font-style: italic; }
    .back-btn { cursor: pointer; color: #9bb3e0; border: none; background: none; font-size: .9rem; padding: .25rem 0; margin-bottom: .5rem; }
    .back-btn:hover { text-decoration: underline; }
    .quality-score { font-size: 1.2rem; font-weight: 700; color: #9bb3e0; }
    .run-meta { font-size: .8rem; color: #666; margin: .25rem 0; }
    .sse-status { font-size: .75rem; color: #668; margin-left: .5rem; }
    /* trends view */
    .trends-svg { display: block; overflow: visible; margin: .5rem 0; max-width: 100%; height: auto; }
    .trends-no-data { color: #666; font-style: italic; font-size: .85rem; }
    .trend-point { cursor: pointer; }
    .trend-point:hover circle { r: 6; }
    /* ab view */
    .ab-form { display: flex; gap: .75rem; align-items: flex-end; margin: .5rem 0 1rem; }
    .ab-form label { display: flex; flex-direction: column; gap: .2rem; font-size: .82rem; color: #888; }
    .ab-form input { background: #1a2030; border: 1px solid #2a3a4a; border-radius: 4px; color: #e0e0e0; padding: .3rem .5rem; width: 80px; }
    .ab-form button { background: #1a3050; color: #9bb3e0; border: 1px solid #2a4060; border-radius: 4px; padding: .3rem .75rem; cursor: pointer; font-size: .85rem; }
    .ab-form button:hover { background: #203860; }
    .ab-table { font-size: .82rem; }
    .delta-pos { color: #6dbf6d; }
    .delta-neg { color: #c06060; }
    .delta-zero { color: #666; }
    .ab-findings { margin-top: .5rem; }
    .ab-sig { font-size: .75rem; font-family: monospace; color: #888; }
    .nav-tabs { display: flex; gap: .25rem; margin-bottom: 1rem; }
    .nav-tab { background: #1a1a2a; border: 1px solid #2a2a3a; border-radius: 4px 4px 0 0; padding: .3rem .75rem; cursor: pointer; font-size: .85rem; color: #888; }
    .nav-tab.active { background: #1a2a3a; color: #9bb3e0; border-bottom-color: #1a2a3a; }
    /* Wide table scrolls within its own container instead of overflowing the page. */
    #runs-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #runs-container table { min-width: 560px; }
    #runs-container td { white-space: nowrap; }
    /* Mobile: tighten padding, let the A/B form and nav tabs wrap. */
    @media (max-width: 640px) {
      body { padding: 1.25rem 1rem 2.5rem; font-size: 14px; }
      h1 { font-size: 1rem; }
      .nav-tabs { flex-wrap: wrap; }
      .ab-form { flex-wrap: wrap; }
      .ab-form input { width: 100%; }
      .run-meta { word-break: break-word; }
      /* A 12-column table can't fit a phone even with horizontal scroll, so make
         it FIT: drop the min-width, let cells wrap, and hide the low-priority
         timing/model/configuration metadata. Cost remains visible at a glance;
         tap a run for the full telemetry. */
      #runs-container { overflow-x: visible; }
      #runs-container table { min-width: 0; }
      #runs-container th, #runs-container td { white-space: normal; padding: .5rem .45rem; }
      #runs-container th:nth-child(5), #runs-container td:nth-child(5),
      #runs-container th:nth-child(6), #runs-container td:nth-child(6),
      #runs-container th:nth-child(7), #runs-container td:nth-child(7),
      #runs-container th:nth-child(10), #runs-container td:nth-child(10),
      #runs-container th:nth-child(11), #runs-container td:nth-child(11),
      #runs-container th:nth-child(12), #runs-container td:nth-child(12) { display: none; }
    }
  </style>
</head>
<body>
  <h1>Parish Harness Dashboard</h1>
  <div class="nav-tabs" id="main-nav">
    <button class="nav-tab active" data-tab="runs">Runs</button>
    <button class="nav-tab" data-tab="trends">Trends</button>
    <button class="nav-tab" data-tab="ab">A/B Compare</button>
  </div>

  <div id="runs-view">
    <h2>Recent Runs <button id="refresh-btn" style="font-size:.75rem;cursor:pointer;margin-left:.5rem;background:#1a2a2a;color:#9bb3e0;border:1px solid #2a3a3a;border-radius:3px;padding:.1rem .4rem;">Refresh</button></h2>
    <div id="runs-container"><span class="loading">Loading...</span></div>
  </div>
  <div id="detail">
    <button class="back-btn" id="back-btn">&#8592; Back to runs</button>
    <div id="detail-container"></div>
  </div>

  <div id="trends-view" style="display:none">
    <h2>Trends
      <span style="font-size:.8rem;color:#666;font-weight:400;margin-left:.5rem">
        Branch: <input id="trends-branch" placeholder="(all)" style="background:#1a2030;border:1px solid #2a3040;border-radius:3px;color:#e0e0e0;padding:.15rem .4rem;font-size:.8rem;width:100px;">
        <button id="trends-load-btn" style="font-size:.75rem;cursor:pointer;margin-left:.3rem;background:#1a2a2a;color:#9bb3e0;border:1px solid #2a3a3a;border-radius:3px;padding:.1rem .4rem;">Load</button>
      </span>
    </h2>
    <div id="trends-container"><span class="loading">Loading...</span></div>
  </div>

  <div id="ab-view" style="display:none">
    <h2>A/B Compare</h2>
    <div class="ab-form">
      <label>Run A <input id="ab-a" type="number" min="1" placeholder="id"></label>
      <label>Run B <input id="ab-b" type="number" min="1" placeholder="id"></label>
      <button id="ab-compare-btn">Compare</button>
    </div>
    <div id="ab-container"></div>
  </div>

  <footer style="margin-top:2rem;padding-top:.75rem;border-top:1px solid #1e1e2a;font-size:.75rem;color:#555;">
    <span id="cost-footer">Cost: loading…</span>
  </footer>

  <!-- Lightbox overlay for full-size turn frame zoom. -->
  <div id="zoom-overlay" role="dialog" aria-modal="true" aria-label="Full-size frame" tabindex="-1">
    <button id="zoom-close" aria-label="Close">&times;</button>
    <img id="zoom-img" src="" alt="Full-size turn frame">
  </div>

  <!-- Per-turn inference log: appended at the end of the page, grows naturally. -->
  <div id="turn-log"></div>

  <script>
    // Injected by the serve binary from `git remote get-url origin`; empty when
    // the repo has no GitHub origin, in which case shas render unlinked.
    window.COMMIT_BASE = "__COMMIT_BASE__";
  </script>
  <script>
    const $ = id => document.getElementById(id);
    let currentRunId = null;
    let sse = null;

    // Render a git sha as a GitHub commit link when COMMIT_BASE is set, else
    // plain code. Short-form (8 chars) display; GitHub resolves the short sha.
    function shaCell(sha) {
      const short = sha ? sha.substring(0, 8) : '—';
      if (!sha || !window.COMMIT_BASE) return `<code>${short}</code>`;
      return `<a href="${window.COMMIT_BASE}/commit/${sha}" target="_blank" rel="noopener"><code>${short}</code></a>`;
    }

    function fmtUsd(value) {
      return `$${Number(value || 0).toFixed(4)}`;
    }

    function fmtDuration(value) {
      return value == null ? '—' : `${Math.round(value).toLocaleString()} ms`;
    }

    function fmtCount(value) {
      return Number(value || 0).toLocaleString();
    }

    function engineRouteSummary(config) {
      const models = config?.engine_models || {};
      const entries = Object.entries(models);
      if (!entries.length) return '—';
      return entries.map(([category, route]) =>
        `${escHtml(category)}: ${escHtml(route.provider)}/${escHtml(route.model)}`
      ).join('<br>');
    }

    function actorSummary(config) {
      const actors = [['player', config?.player], ['judge', config?.judge]]
        .filter(([, actor]) => actor);
      if (!actors.length) return '—';
      return actors.map(([role, actor]) => {
        const model = actor.model ? ` · ${escHtml(actor.model)}` : '';
        return `${role}: ${escHtml(actor.mode)}${model}`;
      }).join('<br>');
    }

    async function loadRuns() {
      const c = $('runs-container');
      c.innerHTML = '<span class="loading">Loading...</span>';
      try {
        const runs = await fetch('/api/runs').then(r => r.json());
        if (!runs.length) { c.innerHTML = '<span class="loading">No runs yet.</span>'; return; }
        c.innerHTML = '';
        const tbl = document.createElement('table');
        tbl.innerHTML = `<thead><tr>
          <th>ID</th><th>Status</th><th>Quality</th><th>Cost</th><th>Avg response</th>
          <th>Engine</th><th>Gate</th><th>Turns</th><th>Findings</th><th>Git SHA</th>
          <th>Branch</th><th>Started</th>
        </tr></thead><tbody></tbody>`;
        const tbody = tbl.querySelector('tbody');
        for (const r of runs) {
          const tr = document.createElement('tr');
          tr.className = 'clickable';
          tr.addEventListener('click', () => { location.hash = 'run/' + r.id; });
          const status_badge = `<span class="badge badge-${r.status}">${r.status}</span>`;
          const quality = r.quality_score != null ? r.quality_score.toFixed(1) : '—';
          const gate = r.gate_reason ? `${r.gate_reason} @t${r.gate_turn}` : '—';
          tr.innerHTML = `<td>${r.id}</td><td>${status_badge}</td><td>${quality}</td>
            <td>${fmtUsd(r.cost_usd)}</td><td>${fmtDuration(r.avg_response_ms)}</td>
            <td>${engineRouteSummary(r.config)}</td><td>${gate}</td><td>${r.turn_count}</td>
            <td>${r.finding_count}</td><td>${shaCell(r.git_sha)}</td><td>${r.git_branch||'—'}</td>
            <td>${(r.started_at||'').substring(0,16)}</td>`;
          tbody.appendChild(tr);
        }
        c.appendChild(tbl);
      } catch (e) {
        c.innerHTML = `<div class="error-msg">Failed to load runs: ${e.message}</div>`;
      }
    }

    // Hash router: `#run/<id>` is a deep-linkable run page (shareable URL,
    // browser back/forward, survives refresh); any other hash shows the list.
    function router() {
      const m = location.hash.match(/^#run\/(\d+)(?:\/turn\/(\d+))?/);
      if (m) {
        if (activeTab !== 'runs') switchTab('runs');
        const id = parseInt(m[1], 10);
        const turn = m[2] != null ? parseInt(m[2], 10) : null;
        // Already on this run? just open the turn log (no detail re-fetch).
        if (currentRunId === id && $('detail').className === 'visible') {
          if (turn != null) showTurnLog(id, turn);
        } else {
          showDetail(id, turn);
        }
      } else {
        if (sse) { sse.close(); sse = null; }
        currentRunId = null;
        $('detail').className = '';
        $('runs-view').style.display = '';
        clearTurnLog();
      }
    }

    // Clear the page-end inference-log block (on run switch / back to list).
    function clearTurnLog() {
      const tl = $('turn-log');
      if (tl) tl.innerHTML = '';
    }

    async function showDetail(runId, openTurn = null) {
      clearTurnLog();
      currentRunId = runId;
      $('runs-view').style.display = 'none';
      $('detail').className = 'visible';
      const c = $('detail-container');
      c.innerHTML = '<span class="loading">Loading run detail...</span>';
      try {
        const d = await fetch(`/api/runs/${runId}`).then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        });
        renderDetail(d, c);
        subscribeSSE(runId);
        // Deep-linked to a specific turn: open its log after the detail renders.
        if (openTurn != null) showTurnLog(runId, openTurn);
      } catch (e) {
        c.innerHTML = `<div class="error-msg">Failed to load run ${runId}: ${e.message}</div>`;
      }
    }

    // Pure SVG 7-axis radar (spider) chart — the sole axis visualization. No
    // external library; the dashboard is offline/zero-dependency. Returns '' when
    // there is no axis data so the caller simply renders no chart.
    const RADAR_LABELS = {
      narrative_coherence: 'narrative', character_fidelity: 'character',
      world_responsiveness: 'world resp.', intent_fidelity: 'intent',
      immersion: 'immersion', progression: 'progression', common_sense: 'common sense',
    };
    function buildAxesRadar(axes) {
      if (!axes || !axes.length) return '';
      const W = 380, H = 280, cx = W / 2, cy = H / 2, maxR = 96;
      const n = axes.length;
      const ang = i => (-Math.PI / 2) + (i / n) * Math.PI * 2;
      const at = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
      // Concentric rings + scale labels at 20/40/60/80/100.
      let rings = '';
      for (let v = 20; v <= 100; v += 20) {
        const rr = (v / 100) * maxR;
        const poly = axes.map((_, i) => at(i, rr).map(c => c.toFixed(1)).join(',')).join(' ');
        rings += `<polygon points="${poly}" fill="none" stroke="#23232e" stroke-width="1"/>`;
        rings += `<text x="${cx + 3}" y="${(cy - rr + 3).toFixed(1)}" fill="#4a4a55" font-size="8">${v}</text>`;
      }
      // Spokes + axis labels.
      let spokes = '', labels = '';
      axes.forEach((ax, i) => {
        const [ex, ey] = at(i, maxR);
        spokes += `<line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#23232e" stroke-width="1"/>`;
        const [lx, ly] = at(i, maxR + 14);
        const cos = Math.cos(ang(i));
        const anchor = cos > 0.3 ? 'start' : cos < -0.3 ? 'end' : 'middle';
        const name = RADAR_LABELS[ax.axis] || ax.axis.replace(/_/g, ' ');
        labels += `<text x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}" text-anchor="${anchor}" fill="#8a8a96" font-size="9">${escHtml(name)}</text>`;
      });
      // Data polygon (clamped 0-100) + vertices with scores.
      const dataPts = axes.map((ax, i) => {
        const score = Math.max(0, Math.min(100, ax.score));
        return at(i, (score / 100) * maxR).map(c => c.toFixed(1)).join(',');
      }).join(' ');
      let verts = '';
      axes.forEach((ax, i) => {
        const score = Math.max(0, Math.min(100, ax.score));
        const [px, py] = at(i, (score / 100) * maxR);
        verts += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.5" fill="#5080c0"/>`;
        const [tx, ty] = at(i, (score / 100) * maxR + 9);
        verts += `<text x="${tx.toFixed(1)}" y="${(ty + 3).toFixed(1)}" text-anchor="middle" fill="#9bb3e0" font-size="8">${Math.round(ax.score)}</text>`;
      });
      return `<svg class="axes-radar" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar chart of the ${n} quality axes">
        ${rings}${spokes}
        <polygon points="${dataPts}" fill="rgba(80,128,192,.18)" stroke="#5080c0" stroke-width="1.5"/>
        ${verts}${labels}
      </svg>`;
    }

    function renderDetail(d, container) {
      const s = d.summary;
      const quality = s.quality_score != null ? `<span class="quality-score">${s.quality_score.toFixed(1)}</span>` : '—';
      const status_badge = `<span class="badge badge-${s.status}">${s.status}</span>`;
      const gate_info = s.gate_reason ? `<br>Gate: ${s.gate_reason} at turn ${s.gate_turn}` : '';
      const costPerTurn = s.turn_count ? s.cost_usd / s.turn_count : 0;
      const timing = d.timing || {};
      const flags = (s.config?.flags || []).map(flag =>
        `${escHtml(flag.name)}=${flag.on ? 'on' : 'off'}`
      ).join(', ') || '—';

      let html = `<h2>Run #${s.id} ${status_badge} <span class="sse-status" id="sse-status"></span></h2>
        <div class="run-meta">
          Quality: ${quality}${gate_info}<br>
          Git: ${shaCell(s.git_sha)} on <em>${s.git_branch||'?'}</em>
          ${s.git_dirty ? '<strong style="color:#c09040"> (dirty)</strong>' : ''}<br>
          Turns: ${s.turn_count} &nbsp; Findings: ${s.finding_count}<br>
          Cost: ${fmtUsd(s.cost_usd)} &nbsp; Cost/turn: ${fmtUsd(costPerTurn)}<br>
          Tokens: ${fmtCount(s.player_tokens)} player &nbsp; ${fmtCount(s.judge_tokens)} judge<br>
          Response time: avg ${fmtDuration(timing.avg_ms)} &nbsp; p95 ${fmtDuration(timing.p95_ms)} &nbsp; max ${fmtDuration(timing.max_ms)} (${timing.measured_turns || 0} measured turns)<br>
          Engine models:<br>${engineRouteSummary(s.config)}<br>
          Actors:<br>${actorSummary(s.config)}<br>
          Feature flags: ${flags}<br>
          Started: ${s.started_at||'?'} &nbsp; Ended: ${s.ended_at||'in progress'}
        </div>`;

      // Axes radar — the per-vertex scores are drawn on the chart itself.
      if (d.axes.length > 0) {
        html += `<h3>Quality Axes</h3>`;
        html += buildAxesRadar(d.axes);
      }

      // Findings.
      if (d.findings.length > 0) {
        html += `<h3>Findings (${d.findings.length})</h3>`;
        for (const f of d.findings) {
          const link = f.issue_url ? ` <a href="${f.issue_url}" target="_blank">[issue]</a>` : '';
          html += `<div class="finding severity-${f.severity}">
            <div class="finding-head">
              <span class="finding-cat">${escHtml(f.category)}</span>
              <span class="finding-sev">${escHtml(f.severity)}</span>
              <span class="finding-turn">turn ${f.turn_index??'—'}</span>${link}
            </div>
            <div>${escHtml(f.description)}</div>
            <span class="finding-sig">${escHtml(f.signature)}</span>
          </div>`;
        }
      }

      // Turn gallery — thumbnails zoom on image click; turns with a transcript
      // show a clickable label that opens the inference log.
      if (d.turns.length > 0) {
        const anyLog = d.turns.some(t => t.has_transcript);
        const hint = anyLog ? ' <span style="font-size:.7rem;color:#666;font-weight:400">— click a label to view inference log; click image to zoom</span>' : ' <span style="font-size:.7rem;color:#666;font-weight:400">— click an image to zoom</span>';
        html += `<h3>Turns (${d.turns.length})${hint}</h3><div class="turn-gallery" id="turn-gallery">`;
        for (const t of d.turns) {
          const imgSrc = `/api/runs/${s.id}/turns/${t.turn_index}/frame.png`;
          const clk = t.has_transcript ? ' clickable' : '';
          const labelCls = t.has_transcript ? ' log-link' : '';
          html += `<div class="turn-thumb${clk}" data-turn="${t.turn_index}">
            <img src="${imgSrc}" alt="turn ${t.turn_index}" loading="lazy" title="Click to zoom — turn ${t.turn_index}: ${escHtml(t.player_input)}" data-zoom-src="${imgSrc}">
            <span class="turn-thumb-label${labelCls}">t${t.turn_index} ${(t.game_clock||'')}</span>
          </div>`;
        }
        html += `</div>`;
      }

      container.innerHTML = html;

      // Wire image clicks → zoom lightbox.
      container.querySelectorAll('.turn-thumb img[data-zoom-src]').forEach(img => {
        img.addEventListener('click', (e) => {
          e.stopPropagation();
          openZoom(img.dataset.zoomSrc, img.alt);
        });
      });

      // Wire label clicks (transcript turns only) → deep-link to that turn's log.
      container.querySelectorAll('.turn-thumb .turn-thumb-label.log-link').forEach(el => {
        el.addEventListener('click', () => {
          const turn = el.closest('.turn-thumb').dataset.turn;
          location.hash = 'run/' + s.id + '/turn/' + turn;
        });
      });
    }

    // Fetch and render one turn's inference log into the #turn-log panel: the
    // dialogue exchange by default, with a collapsible raw prompt/response.
    async function showTurnLog(runId, turnIdx) {
      const panel = $('turn-log');
      if (!panel) return;
      document.querySelectorAll('.turn-thumb').forEach(t =>
        t.classList.toggle('active', t.dataset.turn === String(turnIdx)));
      panel.innerHTML = '<span class="loading">Loading turn log…</span>';
      let log;
      try {
        const r = await fetch(`/api/runs/${runId}/turns/${turnIdx}/transcript`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        log = await r.json();
      } catch (e) {
        panel.innerHTML = `<div class="error-msg">No inference log for turn ${turnIdx}: ${e.message}</div>`;
        return;
      }
      let html = `<h4>Turn ${log.turn_index ?? turnIdx} — inference log</h4>`;
      const exchanges = log.exchanges && log.exchanges.length
        ? log.exchanges
        : (log.player_input ? [{ speaker: 'You', text: log.player_input }] : []);
      for (const ex of exchanges) {
        html += `<div class="tl-line"><span class="tl-speaker">${escHtml(ex.speaker || '')}</span>${escHtml(ex.text || '')}</div>`;
      }
      const infers = log.inferences || [];
      if (infers.length) {
        html += `<details><summary>Raw prompt / response (${infers.length} call${infers.length === 1 ? '' : 's'})</summary>`;
        for (const inf of infers) {
          const meta = [inf.category, inf.model, inf.latency_ms != null ? inf.latency_ms + 'ms' : null]
            .filter(Boolean).join(' · ');
          html += `<div class="tl-infer"><div class="tl-infer-head">${escHtml(meta)}</div>`;
          if (inf.prompt != null) html += `<pre>${escHtml(inf.prompt)}</pre>`;
          if (inf.response != null) html += `<pre>${escHtml(inf.response)}</pre>`;
          html += `</div>`;
        }
        html += `</details>`;
      }
      panel.innerHTML = html;
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function subscribeSSE(runId) {
      if (sse) { sse.close(); sse = null; }
      const statusEl = $('sse-status');
      try {
        sse = new EventSource(`/api/runs/${runId}/stream`);
        sse.onopen = () => { if (statusEl) statusEl.textContent = '(live)'; };
        sse.onmessage = (e) => {
          // Future: handle live TurnEvent updates here.
          console.log('sse event', e.data);
        };
        sse.onerror = () => { if (statusEl) statusEl.textContent = ''; };
      } catch (_) {}
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Lightbox zoom ─────────────────────────────────────────────────────────

    function openZoom(src, alt) {
      const overlay = $('zoom-overlay');
      const img = $('zoom-img');
      img.src = src;
      img.alt = alt || 'Full-size turn frame';
      overlay.classList.add('open');
      overlay.focus();
    }

    function closeZoom() {
      const overlay = $('zoom-overlay');
      overlay.classList.remove('open');
      $('zoom-img').src = '';
    }

    // Close on overlay background click (but not the image itself).
    $('zoom-overlay').addEventListener('click', (e) => {
      if (e.target === $('zoom-overlay')) closeZoom();
    });
    $('zoom-close').addEventListener('click', closeZoom);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('zoom-overlay').classList.contains('open')) closeZoom();
    });

    $('back-btn').addEventListener('click', () => { location.hash = ''; });
    $('refresh-btn').addEventListener('click', loadRuns);

    // ── Tab navigation ─────────────────────────────────────────────────────
    const VIEWS = { runs: 'runs-view', trends: 'trends-view', ab: 'ab-view' };
    let activeTab = 'runs';

    function switchTab(tab) {
      activeTab = tab;
      // Hide detail when switching away from runs.
      if (tab !== 'runs') {
        if (sse) { sse.close(); sse = null; }
        $('detail').className = '';
      }
      Object.entries(VIEWS).forEach(([key, id]) => {
        $(id).style.display = key === tab ? '' : 'none';
      });
      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      if (tab === 'trends') loadTrends();
    }

    document.querySelectorAll('.nav-tab').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // ── Trends view ───────────────────────────────────────────────────────
    async function loadTrends() {
      const c = $('trends-container');
      const branch = $('trends-branch').value.trim();
      const url = branch ? `/api/timeline?branch=${encodeURIComponent(branch)}` : '/api/timeline';
      c.innerHTML = '<span class="loading">Loading...</span>';
      try {
        const points = await fetch(url).then(r => r.json());
        renderTrends(points, c);
      } catch (e) {
        c.innerHTML = `<div class="error-msg">Failed to load timeline: ${e.message}</div>`;
      }
    }

    function renderTrends(points, container) {
      if (!points.length) {
        container.innerHTML = '<span class="trends-no-data">No completed runs yet.</span>';
        return;
      }

      // Filter to points with a quality score.
      const scored = points.filter(p => p.quality_score != null);
      if (!scored.length) {
        container.innerHTML = '<span class="trends-no-data">No scored runs yet.</span>';
        return;
      }

      // Build SVG line chart (quality score over runs).
      const W = 600, H = 160, PAD = { top: 16, right: 16, bottom: 32, left: 40 };
      const iW = W - PAD.left - PAD.right;
      const iH = H - PAD.top - PAD.bottom;
      const n = scored.length;
      const minQ = Math.min(...scored.map(p => p.quality_score));
      const maxQ = Math.max(...scored.map(p => p.quality_score));
      const rangeQ = (maxQ - minQ) || 1;

      const xOf = i => PAD.left + (n === 1 ? iW / 2 : (i / (n - 1)) * iW);
      const yOf = q => PAD.top + iH - ((q - minQ) / rangeQ) * iH;

      // Polyline points.
      const pts = scored.map((p, i) => `${xOf(i).toFixed(1)},${yOf(p.quality_score).toFixed(1)}`).join(' ');

      // Y-axis labels.
      const yLabels = [minQ, (minQ + maxQ) / 2, maxQ].map(v =>
        `<text x="${PAD.left - 4}" y="${yOf(v).toFixed(1)}" text-anchor="end" fill="#666" font-size="10">${v.toFixed(0)}</text>`
      ).join('');

      // Data circles + tooltips.
      const circles = scored.map((p, i) => {
        const sha = (p.git_sha || '').substring(0, 7);
        const date = p.commit_date ? p.commit_date.substring(0, 10) : '';
        const tip = `run ${p.run_id} q=${p.quality_score.toFixed(1)} ${sha} ${date}`;
        return `<circle class="trend-point" cx="${xOf(i).toFixed(1)}" cy="${yOf(p.quality_score).toFixed(1)}" r="4" fill="#5080c0" stroke="#0f1117" stroke-width="1.5">
          <title>${escHtml(tip)}</title></circle>`;
      }).join('');

      // X-axis ticks (show SHA for up to 6 points).
      const showEvery = Math.max(1, Math.ceil(n / 6));
      const xLabels = scored.map((p, i) => {
        if (i % showEvery !== 0 && i !== n - 1) return '';
        const sha = (p.git_sha || '').substring(0, 6);
        return `<text x="${xOf(i).toFixed(1)}" y="${(PAD.top + iH + 14).toFixed(1)}" text-anchor="middle" fill="#555" font-size="9">${sha}</text>`;
      }).join('');

      const svg = `<svg class="trends-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
        <line x1="${PAD.left}" y1="${PAD.top + iH}" x2="${PAD.left + iW}" y2="${PAD.top + iH}" stroke="#2a2a2a" stroke-width="1"/>
        <line x1="${PAD.left}" y1="${PAD.top}" x2="${PAD.left}" y2="${PAD.top + iH}" stroke="#2a2a2a" stroke-width="1"/>
        ${yLabels}
        ${n > 1 ? `<polyline points="${pts}" fill="none" stroke="#5080c0" stroke-width="1.5"/>` : ''}
        ${circles}
        ${xLabels}
        <text x="${(W / 2).toFixed(0)}" y="${H - 2}" text-anchor="middle" fill="#444" font-size="9">commit (newest right)</text>
      </svg>`;

      container.innerHTML = `<div>${svg}</div><p style="font-size:.78rem;color:#666;margin-top:.4rem">${scored.length} scored run(s) shown. Click a dot to open that run.</p>`;

      // Wire up dot click to showDetail.
      container.querySelectorAll('.trend-point').forEach((el, i) => {
        el.addEventListener('click', () => { location.hash = 'run/' + scored[i].run_id; });
      });
    }

    $('trends-load-btn').addEventListener('click', loadTrends);

    // ── A/B Compare view ──────────────────────────────────────────────────
    $('ab-compare-btn').addEventListener('click', async () => {
      const aVal = $('ab-a').value.trim();
      const bVal = $('ab-b').value.trim();
      if (!aVal || !bVal) {
        $('ab-container').innerHTML = '<div class="error-msg">Enter both run IDs.</div>';
        return;
      }
      const c = $('ab-container');
      c.innerHTML = '<span class="loading">Comparing...</span>';
      try {
        const resp = await fetch(`/api/compare?a=${encodeURIComponent(aVal)}&b=${encodeURIComponent(bVal)}`);
        if (!resp.ok) {
          const j = await resp.json();
          c.innerHTML = `<div class="error-msg">${escHtml(j.error || 'compare failed')}</div>`;
          return;
        }
        const cmp = await resp.json();
        renderAbCompare(cmp, c);
      } catch (e) {
        c.innerHTML = `<div class="error-msg">Error: ${e.message}</div>`;
      }
    });

    function renderAbCompare(cmp, container) {
      const runMeta = (s) => {
        const q = s.quality_score != null ? s.quality_score.toFixed(1) : '—';
        const sha = (s.git_sha || '').substring(0, 8);
        return `run #${s.id} &nbsp; <span class="badge badge-${s.status}">${s.status}</span> &nbsp; quality=${q} &nbsp; cost=${fmtUsd(s.cost_usd)} &nbsp; avg response=${fmtDuration(s.avg_response_ms)} &nbsp; <code>${sha}</code> on <em>${s.git_branch||'?'}</em>`;
      };

      let html = `<h3>Run A</h3><div class="run-meta">${runMeta(cmp.a)}</div>`;
      html += `<h3>Run B</h3><div class="run-meta">${runMeta(cmp.b)}</div>`;
      html += `<p style="font-size:.8rem;color:#888;margin:.4rem 0">Gate: A=${escHtml(cmp.gate_diff[0])} &nbsp; B=${escHtml(cmp.gate_diff[1])}</p>`;

      if (cmp.axis_deltas.length) {
        html += `<h3>Axis Deltas (B − A)</h3>
          <table class="ab-table"><thead><tr>
            <th>Axis</th><th>A</th><th>B</th><th>Delta</th>
          </tr></thead><tbody>`;
        for (const d of cmp.axis_deltas) {
          const cls = d.delta > 0 ? 'delta-pos' : d.delta < 0 ? 'delta-neg' : 'delta-zero';
          const sign = d.delta > 0 ? '+' : '';
          html += `<tr>
            <td>${d.axis.replace(/_/g,' ')}</td>
            <td>${d.a_score}</td><td>${d.b_score}</td>
            <td class="${cls}">${sign}${d.delta}</td>
          </tr>`;
        }
        html += `</tbody></table>`;
      }

      if (cmp.findings_only_in_a.length) {
        html += `<h3>Findings only in A (${cmp.findings_only_in_a.length})</h3><div class="ab-findings">`;
        for (const sig of cmp.findings_only_in_a) {
          html += `<div class="ab-sig">${escHtml(sig)}</div>`;
        }
        html += `</div>`;
      }
      if (cmp.findings_only_in_b.length) {
        html += `<h3>Findings only in B (${cmp.findings_only_in_b.length})</h3><div class="ab-findings">`;
        for (const sig of cmp.findings_only_in_b) {
          html += `<div class="ab-sig">${escHtml(sig)}</div>`;
        }
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    // Load the list, then route — so a deep-linked `#run/<id>` opens that run's
    // page on first load and on every back/forward navigation.
    window.addEventListener('hashchange', router);
    loadRuns().then(router);

    // ── Cost footer ───────────────────────────────────────────────────────
    async function loadCost() {
      try {
        const r = await fetch('/api/cost');
        if (!r.ok) return;
        const c = await r.json();
        const footer = document.getElementById('cost-footer');
        if (!footer) return;
        footer.textContent =
          `Cost: $${c.total_cost_usd.toFixed(4)} | ` +
          `Runs: ${c.total_runs} | ` +
          `Player tokens: ${c.total_player_tokens} | ` +
          `Judge tokens: ${c.total_judge_tokens}`;
      } catch (_) { /* network not ready */ }
    }
    loadCost();
  </script>
</body>
</html>
