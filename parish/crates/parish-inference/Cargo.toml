[package]
name = "parish-inference"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "LLM inference queue and provider clients (OpenAI/Anthropic/simulator) for Parish"

[dependencies]
parish-types = { workspace = true }
parish-config = { workspace = true }
parish-providers = { workspace = true }
# reqwest stays a direct dep: validate.rs (provider reachability/auth probes),
# hf_downloader.rs (model download), and setup/ (Ollama/vllm reachability +
# warmup) all make their own HTTP calls. Only the `json` feature is needed
# here; the streaming clients (and the `stream` feature) live in
# parish-providers.
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hf-hub = { workspace = true }

tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
