[package]
name = "parish-inference"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "LLM inference queue and provider clients (OpenAI/Anthropic/simulator) for Parish"

[dependencies]
parish-types = { workspace = true }
parish-config = { workspace = true }
parish-providers = { workspace = true }
# parish-setup owns the local-inference bootstrap (GPU detect, model select,
# Ollama/vllm provider bootstrap). It was split out of this crate; we depend on
# it and re-export it at the unchanged `parish_inference::setup::*` path so
# downstream consumers need no import change. The edge is one-directional:
# parish-setup does NOT depend back on parish-inference (it reaches the client
# factory and rate limiter via parish-providers), so there is no cycle.
parish-setup = { workspace = true }
# reqwest stays a direct dep: validate.rs (provider reachability/auth probes)
# and hf_downloader.rs (model download) make their own HTTP calls. Only the
# `json` feature is needed here; the streaming clients (and the `stream`
# feature) live in parish-providers. (The Ollama/vllm reachability + warmup
# HTTP calls moved out with setup/ into parish-setup.)
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hf-hub = { workspace = true }

tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
