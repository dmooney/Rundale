[package]
name = "parish-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Axum web server for Parish — serves the Svelte UI in a browser for testing"
default-run = "parish-server"

[[bin]]
name = "parish-server"
path = "src/main.rs"

[lib]
name = "parish_server"
path = "src/lib.rs"

[dependencies]
parish-core = { workspace = true }
parish-palette = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true, features = ["env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
rand = { workspace = true }
tokio-util = { workspace = true }
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
reqwest = { workspace = true, features = ["json"] }
rusqlite = { workspace = true }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
governor = { workspace = true }
lru = { workspace = true }
toml = { workspace = true }
tower-sessions = "0.15"
mime_guess = "2"
keyring = { workspace = true }

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }
wiremock = { workspace = true }
tower = "0.5"
tokio-tungstenite = "0.30"
futures-util = "0.3"
