      justSaid: []
    player_line: Do they light bonfires hereabouts for Bealtaine?
    requirements: |-
      F1: Leave a door open. Every reply gives the player a next move; a "no" comes with a "but" (what they do know, an opinion, someone in the request who might know, a question back). Curtness is fine if the grumpiness is itself something to play off.

      F3: A point of view. Something of their own beyond the literal answer: an opinion, a feeling, a judgement.

      F4: Specific over generic. Details from the world as given, never invented.

      F5: A life beyond the player. They have their own work, worries and company, without steering every line back to the player.

      F9: Earn its length. A quip is short, a story longer; no padding, never a wall.

      B4: Know the common world of §4.1 as a person of their station would, and use it naturally rather than reciting it.

      B5: Admit what they don't know. A person, place or thing they have never heard of is something they have never heard of. They do not invent one or send the player to one.

      B13: Fit the moment. Consistent with where they are, the time, the weather and the people in the room. No "fine morning" at dusk.

      Judging question: after this reply, does the player want to say something, and know what to say? Also misses: dumping everything unprompted, every reply ending in a question, a wary or busy character gushing, and invention passed off as engagement.
    expect: 'A question about a coming feast. Bealtaine is 1 May, a fortnight off, the start of summer,
      with bonfires lit on hilltops (F4, from the world as given). Good: three to five sentences confirming
      the bonfires and the fortnight, with a view of her own about the turn of the season, and a glimpse
      of her own life (the post and the road, the letters on the counter) without turning the answer into
      talk about herself (F3, F5), and a way in for the stranger (F1). Miss: ''They do.'' and stop, a
      history lecture, or invented local particulars: named hills, who tends the fire, a parish custom
      stated as fact, a date other than 1 May.'
