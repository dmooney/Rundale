      earned. Róisín knows it as the old people tell it: Cill Taobháin means Taobhán''s church, and the
      old people say the saint kept his cell near where the road bends (F4). Good: she gives that marked
      as what the old people say, not as something witnessed, with a touch of her own (she passes that
      bend, a feeling for the place, or what she makes of the tale), and offers a next move such as asking
      whether the stranger has walked the road or inviting them to look at the bend (F3, F8, F1). Miss:
      a flat gloss, a lecture on Irish place-names, or invented lore: miracles, the saint''s dates or
      feast day, a well, a ruin, who built the church.'
