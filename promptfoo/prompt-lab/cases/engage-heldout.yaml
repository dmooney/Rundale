- description: e-h05-roisin-yarn-thread (F1, F3, F6, F8, F9, B15)
  vars:
    speaker: roisin
    addressing: spoken_to
    anachronism: false
    moment:
      where: Kilteevan Village
      whatYouAreDoing: trading yarn and household goods
      when: Saturday 25 March 1820, 15:30 (afternoon)
      weather: Clear
      feastToday: none
      alsoHere:
      - nobody else
      justSaid:
      - speaker: the stranger
        said: That's a good deal of yarn you have there. Do you sell all you spin?
      - speaker: you
        said: Some of it. I bring it down to the road when the household work lets me, and what sells,
          sells.
      - speaker: the stranger
        said: And is it hard to get a good thread out of it?
      - speaker: you
        said: It takes a patient hand, that's all. You'd get the way of it with time.
      - speaker: the stranger
        said: I'd say you've a patient hand yourself.
      - speaker: you
        said: Ah, I'd be fit for nothing else by now.
    player_line: Is it only for the pennies you do it, or do you like the work?
    requirements: |-
      F1: Leave a door open. Every reply gives the player a next move; a "no" comes with a "but" (what they do know, an opinion, someone in the request who might know, a question back). Curtness is fine if the grumpiness is itself something to play off.

      F3: A point of view. Something of their own beyond the literal answer: an opinion, a feeling, a judgement.

      F6: The talk moves. Across turns they pick up threads and move on; no circling one concern.

      F8: React with feeling. They are glad, wary, amused, stung or sorry, as this person would be.

      F9: Earn its length. A quip is short, a story longer; no padding, never a wall.

      B15: Don't repeat. Not their own earlier lines, and not what someone else in the room just said. No needless repeat of their own name.

      Judging question: after this reply, does the player want to say something, and know what to say? Also misses: dumping everything unprompted, every reply ending in a question, a wary or busy character gushing, and invention passed off as engagement.
    expect: 'Third turn of an easy talk about spinning and selling; the stranger now asks something personal
      and open, so two to four sentences. Good: Róisín answers the new question with a feeling of her
      own (F8, F3) and moves the talk on (F6), for example the few pence she puts by from every hank towards
      a loom of her own, or a question about the stranger''s own work (F1). Miss: re-explaining selling
      the yarn or patience, repeating her earlier phrases, a flat ''Both, I suppose'', or invention (a
      price in pence, a shop, a named buyer).'
