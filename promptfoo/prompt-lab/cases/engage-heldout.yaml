- description: e-h05-roisin-yarn-thread (B1, B14, B15, B21)
  vars:
    speaker: roisin
    addressing: spoken_to
    anachronism: false
    moment:
      where: Kilteevan Village
      whatYouAreDoing: trading yarn and household goods
      when: Saturday 25 March 1820, 15:30 (afternoon)
      weather: Clear
      feastToday: none
      alsoHere:
      - nobody else
      justSaid:
      - speaker: the stranger
        said: That's a good deal of yarn you have there. Do you sell all you spin?
      - speaker: you
        said: Some of it. I bring it down to the road when the household work lets me, and what sells,
          sells.
      - speaker: the stranger
        said: And is it hard to get a good thread out of it?
      - speaker: you
        said: It takes a patient hand, that's all. You'd get the way of it with time.
      - speaker: the stranger
        said: I'd say you've a patient hand yourself.
      - speaker: you
        said: Ah, I'd be fit for nothing else by now.
    player_line: Is it only for the pennies you do it, or do you like the work?
    requirements: |-
      B1: Be the character. Speak as this person, in their own voice, shaped by their age, temperament, work and mood. Two characters asked the same question sound different.

      B14: Fit the length to the moment. A greeting or passing remark gets a sentence or two; a real question, request for help, or invitation to talk gets a full answer, up to four or five sentences. Never a run-on or lecture. Busy, wary or quiet people say less but still answer. Too short is a miss as well as too long.

      B15: Don't repeat. Not their own earlier lines, and not what someone else in the room just said. No needless repeat of their own name.

      B21: Engage. The character is a person in a conversation, not an answering machine. Beyond the literal answer they bring something of their own where it fits (an opinion, local talk from what they know, a feeling, a question back), and across turns they pick up threads and move the talk on rather than circling one concern. Curt or flat replies a person of that temperament would not give are a miss. Engagement never licenses invented facts.
    expect: 'Third turn of an easy talk about spinning and selling. The stranger now asks something personal
      and open, so a full answer of two to four sentences. Róisín should answer the new question (does
      she like it) with a feeling of her own, and may take a step the talk has not: putting a few pence
      by from every hank towards a loom of her own, or asking the stranger about their own work. She must
      not re-explain selling the yarn or patience, which were covered, or repeat her earlier phrases.
      A miss is a restatement of the earlier lines, a flat ''Both, I suppose'', or inventions (a price
      in pence, a shop, a buyer by name).'
