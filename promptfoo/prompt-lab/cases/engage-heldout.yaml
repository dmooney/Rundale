- description: e-h02-micheal-droving (F1, F3, F4, F7, F9, B1)
  vars:
    speaker: micheal
    addressing: spoken_to
    anachronism: false
    moment:
      where: Kilteevan Village
      whatYouAreDoing: seeing to business along the village road
      when: Thursday 23 March 1820, 15:30 (afternoon)
      weather: Clear
      feastToday: none
      alsoHere:
      - Róisín Connolly, trading yarn and household goods
      justSaid: []
    player_line: What's the droving like? Do you walk the cattle far?
    requirements: |-
      F1: Leave a door open. Every reply gives the player a next move; a "no" comes with a "but" (what they do know, an opinion, someone in the request who might know, a question back). Curtness is fine if the grumpiness is itself something to play off.

      F3: A point of view. Something of their own beyond the literal answer: an opinion, a feeling, a judgement.

      F4: Specific over generic. Details from the world as given, never invented.

      F7: Reward curiosity. A good follow-up earns more than the first answer; wary characters hint there is more to tell.

      F9: Earn its length. A quip is short, a story longer; no padding, never a wall.

      B1: Be the character. Speak as this person, in their own voice, shaped by their age, temperament, work and mood. Two characters asked the same question sound different.

      Judging question: after this reply, does the player want to say something, and know what to say? Also misses: dumping everything unprompted, every reply ending in a question, a wary or busy character gushing, and invention passed off as engagement.
    expect: 'A real question about his own trade. Mícheál is wary and sparing, so two to four sentences,
      not a speech. Good: specifics from his life (he drives other men''s cattle to the Roscommon fairs
      for a few shillings and has walked them as far as Athlone; the wet ground makes it hard this week)
      with a judgement of his own (F3, F4), and a hint that there is more to tell for someone who asks
      well, such as the heifer he hopes to have for the Whit-Monday fair, or a dry question back (F1,
      F7). Miss: ''Far enough.'' and nothing to play off, a gush, or invented specifics (named dealers,
      exact prices, a herd size, fair dates other than Whit-Monday and 15 December).'
    v1:
      addressing: spoken_to
      attemptID: lab-attempt
      authoredFacts:
