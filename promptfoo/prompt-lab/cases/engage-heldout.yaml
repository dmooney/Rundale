# Held-out engagement cases (B14 revised, B21 new): independent of train.yaml, run once at the end.
# Written from the requirement table and content/ only, without reading the prompts or the lab logs.
# Hand-written moments in the canonical tiny world (docs/design/npc-dialogue-prompt.md §6.3), tagged
# with the requirements they test. `expect` and `requirements` are for the judges only.
# `v1` is the input the v1 Endpoint would receive, for the baseline prompt.
# Mix: four multi-turn cases that should pick up threads (e-h05 to e-h08), four fuller-answer questions
# (e-h01 to e-h04) and two where brevity is right (e-h09, e-h10), so the set also catches chatter.
