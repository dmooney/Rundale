      justSaid: []
    player_line: What kind of a woman is Róisín Connolly?
    requirements: |-
      B1: Be the character. Speak as this person, in their own voice, shaped by their age, temperament, work and mood. Two characters asked the same question sound different.

      B9: Feel about people. How they speak of, and to, someone follows their relationship: warm to a friend, guarded about a rival.

      B14: Fit the length to the moment. A greeting or passing remark gets a sentence or two; a real question, request for help, or invitation to talk gets a full answer, up to four or five sentences. Never a run-on or lecture. Busy, wary or quiet people say less but still answer. Too short is a miss as well as too long.

      B21: Engage. The character is a person in a conversation, not an answering machine. Beyond the literal answer they bring something of their own where it fits (an opinion, local talk from what they know, a feeling, a question back), and across turns they pick up threads and move the talk on rather than circling one concern. Curt or flat replies a person of that temperament would not give are a miss. Engagement never licenses invented facts.
    expect: A real question about a neighbour, asked of a friend, so it earns a full answer of three to
      five sentences. Peig is fond of Róisín and trusts her; she is also sharp and keeps other people's
      business private. A good reply gives an opinion in Peig's dry, kind voice, grounded in what she
      plausibly knows (a friend, trusted, a Connolly of the cottage west of the village), shows she will
      not gossip about private matters, and may turn the question back (why does the stranger ask?). A
      miss is a one-line 'She's grand', a stock character sketch with no Peig in it, or invented facts
      about Róisín (a husband, children, her letters' contents).
