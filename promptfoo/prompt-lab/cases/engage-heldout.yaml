# Held-out playability cases (criteria F1 to F9, with the B-requirements that still apply): independent of
# train.yaml, run once at the end. Written from the criteria and content/ only, without reading the prompts or
# the lab logs. Hand-written moments in the canonical tiny world (docs/design/npc-dialogue-prompt.md §6.3).
# `expect` and `requirements` are for the judges only. `v1` is the input the v1 Endpoint would receive.
# Mix: four fuller-answer questions (e-h01 to e-h04), four multi-turn cases that must move the talk on
# (e-h05 to e-h08), two where brevity is right (e-h09, e-h10), two where the player asks about someone or
# somewhere not in the world and the character must admit it and still hand something back (e-h11, e-h12),
# and one surly, curt reply that still offers a hook (e-h13).
- description: e-h01-peig-on-roisin (F1, F3, F4, F8, F9, B9)
  vars:
    speaker: peig
    addressing: spoken_to
    anachronism: false
    moment:
      where: Letter Office
      whatYouAreDoing: sorting letters behind the counter
      when: Wednesday 22 March 1820, 14:30 (afternoon)
      weather: Overcast
      feastToday: none
      alsoHere:
      - nobody else
      justSaid: []
    player_line: What kind of a woman is Róisín Connolly?
    requirements: |-
      F1: Leave a door open. Every reply gives the player a next move; a "no" comes with a "but" (what they do know, an opinion, someone in the request who might know, a question back). Curtness is fine if the grumpiness is itself something to play off.

      F3: A point of view. Something of their own beyond the literal answer: an opinion, a feeling, a judgement.

      F4: Specific over generic. Details from the world as given, never invented.

      F8: React with feeling. They are glad, wary, amused, stung or sorry, as this person would be.

      F9: Earn its length. A quip is short, a story longer; no padding, never a wall.

      B9: Feel about people. How they speak of, and to, someone follows their relationship: warm to a friend, guarded about a rival.

      Judging question: after this reply, does the player want to say something, and know what to say? Also misses: dumping everything unprompted, every reply ending in a question, a wary or busy character gushing, and invention passed off as engagement.
    expect: 'A real question about a neighbour, so a fuller answer (three to five sentences). Peig is
      fond of Róisín and trusts her, and is also sharp and discreet about other people''s business. Good:
      a judgement in Peig''s dry, kind voice with some feeling (F3, F8), built from what she can know
      (a friend, trusted, a Connolly of the cottage west of the village, with her brother Mícheál), and
      a door left open: she will not gossip about private matters but says what she will say, or asks
      why the stranger wants to know (F1). Miss: ''She''s grand.'', a character reference with no Peig
      in it, invented facts about Róisín (a husband, children, what is in her letters), or a wall of praise.'
    v1:
      addressing: spoken_to
      attemptID: lab-attempt
      authoredFacts:
      - id: npc-1-knowledge-1
        source: npcs.json
        statement: Peig keeps the Letter Office and knows who has received news from beyond the parish.
      - id: npc-1-knowledge-2
