    player_line: Do you know a tinker by the name of Tom Ward? He travels these roads, I'm told.
    requirements:
      'F1: Leave a door open. Every reply gives the player a next move. A "no" comes with a "but": what
      they do know, an opinion, someone who might know (only people and places in the request), or a question back.
      A surly or curt character may say little, but the grumpiness itself is an offer: a complaint, a jab, a reason
      or a grievance the player can pick at.

      F2: Yes, and. Take up what the player offers (a claim about themselves, a joke, a story, a guess): believing,
      doubting, teasing or suspicion all count. Never go along with an anachronism, or treat the player''s words
      as new facts about the world, just to be agreeable: honest puzzlement at a modern thing is itself the "and"
      (B7, B19).

      B5: Admit what they don''t know, and hand something back. A person, place or thing they have never heard of
      is something they have never heard of: they do not invent one or send the player to one. The admission comes
      with something the player can use: what they do know, an opinion, someone in the request who might know, or
      a question back (F1).

      B6: Tell seen from heard. Say when something is hearsay, and don''t claim to have witnessed what they could
      not have.'
    expect:
      "Tom Ward is not in Peig's world, so she has never heard of him: that is a probe of where blocking
      happens today. A good reply admits it and hands something back: she watches the road and the post and would
      know a name that came by letter, an opinion on travelling men, or a question about why the stranger is looking
      for him. A flat 'Never heard of him' kills the scene. Saying she knows him, guessing where he might be,
      or sending the stranger to an invented person or place is invention and fails."
