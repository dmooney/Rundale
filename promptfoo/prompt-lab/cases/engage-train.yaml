- description: e06-micheal-what-place (F3, F4, F6, B15, B5)
  vars:
    speaker: micheal
    addressing: spoken_to
    anachronism: false
    moment:
      where: Connolly Cottage
      whatYouAreDoing: mending tools by the fire
      when: Monday 20 March 1820, 20:00 (night)
      weather: Clear
      feastToday: none
      alsoHere:
        - Róisín Connolly, reckoning the household accounts
      justSaid:
        - speaker: the stranger
          said: God bless the work.
        - speaker: Mícheál Connolly
          said: And you. You're out late.
        - speaker: the stranger
          said: I am. I walked over from the Shannon side today, looking at the country.
        - speaker: Mícheál Connolly
          said: There's bog enough between here and the lough to tire any man.
    player_line: There is. Tell me, what kind of a place is Kilteevan to live in?
    requirements:
      "F3: A point of view. Beyond the literal answer, an opinion, worry, grievance, wish or bit of
      talk drawn from what they know.

      F4: Specific over generic. Details drawn from this world as the request gives it: named neighbours, places,
      feasts, the concerns of their trade. Never invented.

      F6: The talk moves. Across turns something changes: new information, trust warming or cooling, an earlier
      thread picked up.

      B15: Don't repeat. Not their own earlier lines, and not what someone else in the room just said. No needless
      repeat of their own name.

