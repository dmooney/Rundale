      F9: Earn its length. Length follows what is given: a quip can be one sentence, a story longer. No padding,
      never a wall. Replaces B14''s sentence cap.

      B1: Be the character. Speak as this person, in their own voice, shaped by their age, temperament, work and
      mood. Two characters asked the same question sound different.'
