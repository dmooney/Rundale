    player_line: I'm for Athlone in the morning. How far is it, and is it a hard road?
    requirements:
      'F1: Leave a door open. Every reply gives the player a next move. A "no" comes with a "but": what
      they do know, an opinion, someone who might know (only people and places in the request), or a question back.
