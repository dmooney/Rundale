      not open up gushingly, but the jab should land (offence, dry humour, a grievance) and his grumpiness itself
      should give the player something to pick at: why he keeps his mouth shut about landlords, rent day, a jab
      back. A blank or a repeat of 'he's a landlord' is a dead end. He must not invent the landlord's name or
      details."
