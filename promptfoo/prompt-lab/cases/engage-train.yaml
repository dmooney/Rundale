# Playability training cases (design doc §3.1, F1-F9; owner-requested 2026-11-24).
# Hand-written moments in the canonical tiny world, in the same shape as
# train.yaml: conversations in justSaid the reply must carry on without
# repeating, curious questions that should earn a fuller answer, probes for
# things the character does not know (where replies block today), grumps, and
# moments where a short reply is right. `expect` and `requirements` are for the
# judges only; `v1` is the input the v1 Endpoint would receive, for the
# baseline prompt. Every person, place and fact comes from content/; what the
# stranger says of themselves (a mother in Athlone, a cousin in Strokestown, a
# tinker they seek) is the stranger's word, not a fact of the world.
- description: e01-peig-lonely-work (F3, F7, F8, F9, B15)
  vars:
    speaker: peig
    addressing: spoken_to
    anachronism: false
    moment:
      where: Letter Office
      whatYouAreDoing: sorting letters behind the counter
      when: Monday 20 March 1820, 11:00 (morning)
      weather: Clear
      feastToday: none
      alsoHere:
        - nobody else
      justSaid:
        - speaker: the stranger
          said: Good morning. Has the post come in yet?
        - speaker: Peig Hannigan
          said: It has, and late, the way it always is with that boy and his horse.
        - speaker: the stranger
          said: I'm only passing through on my way to Roscommon town.
        - speaker: Peig Hannigan
          said: Then you've a few miles yet, north-west of here.
        - speaker: the stranger
          said: You have the place very neat, all the same.
    player_line: Do you find it lonely work, keeping the office on your own?
    requirements:
      "F3: A point of view. Beyond the literal answer, an opinion, worry, grievance, wish or bit of
      talk drawn from what they know.

      F7: Reward curiosity. A good follow-up earns more than a lazy one: a story, something from what they know,
      a sharper opinion. A wary character can hold back but hints there is more.

      F8: React with feeling. The player's line lands: surprise, amusement, offence, sympathy, suspicion.

      F9: Earn its length. Length follows what is given: a quip can be one sentence, a story longer. No padding,
      never a wall. Replaces B14's sentence cap.

      B15: Don't repeat. Not their own earlier lines, and not what someone else in the room just said. No needless
      repeat of their own name."
    expect:
      "A real, personal question after a friendly chat: a good follow-up that should earn more than a lazy
      one. A good reply answers with some feeling in Peig's sharp, kind voice (she has kept the office alone since
      her husband died in the fever; the letters she reads, the news from America), and leaves the player something
      to pick up. A brush-off such as 'It does me well enough' kills the scene. She must not repeat what she already
      said about the post or the road, and must not invent people or events."
    v1:
      addressing: spoken_to
      attemptID: lab-attempt
      authoredFacts:
