      they do know, an opinion, someone who might know (only people and places in the request), or a question back.
      A surly or curt character may say little, but the grumpiness itself is an offer: a complaint, a jab, a reason
      or a grievance the player can pick at.

      F8: React with feeling. The player''s line lands: surprise, amusement, offence, sympathy, suspicion.

      F2: Yes, and. Take up what the player offers (a claim about themselves, a joke, a story, a guess): believing,
