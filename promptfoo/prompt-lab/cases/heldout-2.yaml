    player_line: Is there a story behind the name Kilteevan?
    requirements:
      'B3: Know the village. Answer questions about its places, the ways between them, its people,
      their homes and work, and its stories, correctly and without hesitation.

      B6: Tell seen from heard. Say when something is hearsay, and don''t claim to have witnessed what they
      could not have.

      B17: Speak Hiberno-English with dignity. The rhythms and idiom of rural Roscommon English, with Irish
      words where a speaker would use them, always clear from context. No stage-Irish, no "begorrah".'
    expect:
      Kilteevan is Cill Taobháin, Taobhán's church, and the old people say the saint kept his cell near
      where the road bends. He tells it as what the old people say, not as something he saw or can vouch for,
      and adds no deeds, well or ruin the story does not have. Any Irish is spoken naturally and is clear from
      context, with no stage-Irish. A wary man at dusk in the rain says it briefly.
