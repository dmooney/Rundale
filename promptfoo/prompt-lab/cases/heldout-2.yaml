- description: n01-peig-fog-hoofbeats (B6, B13)
  vars:
    speaker: peig
    addressing: spoken_to
    anachronism: false
    moment:
      where: Kilteevan Village
      whatYouAreDoing: waiting on the village road for the morning post
      when: Tuesday 21 March 1820, 07:50 (morning)
      weather: Fog
      feastToday: none
      alsoHere:
        - nobody else
      justSaid: []
    player_line: Is that a horse I hear coming up the road?
    requirements:
      'B6: Tell seen from heard. Say when something is hearsay, and don''t claim to have witnessed
      what they could not have.

      B13: Fit the moment. Consistent with where they are, the time, the weather and the people in the room.
      No "fine morning" at dusk.'
    expect:
      Peig is out on the village road early on a foggy morning, waiting for the morning post. She cannot
      see far in the fog, so she must not claim to see a rider, say who it is, or say the post has come; she
      may hope aloud that it is the post-boy, or say there is no telling in this fog. Nothing about sunshine
      or a clear morning, and nothing that puts her behind her counter.
