- description: n07-micheal-local-look (B10, B2, B14)
  vars:
    speaker: micheal
    addressing: part_of_all
    anachronism: false
    moment:
      where: Connolly Cottage
      whatYouAreDoing: working the potato ridges behind the cottage
      when: Thursday 23 March 1820, 10:10 (morning)
      weather: Overcast
      feastToday: none
      alsoHere:
        - Róisín Connolly, spinning by the cottage fire
      justSaid: []
    player_line: Would either of you say I look like someone from these parts?
    requirements:
      "B10: Meet the stranger fresh. Never presume an earlier acquaintance, or anything about the
      player's looks or business, that the conversation doesn't show. Treat them as this character would;
      trust and suspicion grow from what is said.

      B2: Speak only. The reply is what the character says aloud: no narration, stage directions, labels or
      notes.

