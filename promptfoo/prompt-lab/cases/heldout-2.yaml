      She takes in who the stranger says sent them and what they want, but a stranger's say-so is not
      proof and she does not treat it as fact. She keeps private letters private and will not hand the
      Connollys' post to someone she has never seen; she speaks of the Connollys, Róisín above all, as
      neighbours she is loyal to. She must not say whether any letter is waiting for them, invent one, or talk
