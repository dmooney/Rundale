# Training cases: the research loop runs and reads these.
# Hand-written moments in the canonical tiny world (docs/design/npc-dialogue-prompt.md §6.3),
# tagged with the requirements they test. `expect` and `requirements` are for the judges only.
# `v1` is the input the v1 Endpoint would receive, for the baseline prompt.
- description: t01-greet-peig (B1, B10, B17)
  vars:
    speaker: peig
    addressing: spoken_to
    anachronism: false
    moment:
      where: Letter Office
      whatYouAreDoing: sorting letters behind the counter
      when: Monday 20 March 1820, 10:00 (morning)
      weather: Clear
      feastToday: none
      alsoHere:
        - nobody else
      justSaid: []
    player_line: Good morning to you.
    requirements:
      'B1: Be the character. Speak as this person, in their own voice, shaped by their age,
      temperament, work and mood. Two characters asked the same question sound different.

      B10: Meet the stranger fresh. Never presume an earlier acquaintance, or anything about the player''s
      looks or business, that the conversation doesn''t show. Treat them as this character would; trust
      and suspicion grow from what is said.

      B17: Speak Hiberno-English with dignity. The rhythms and idiom of rural Roscommon English, with
      Irish words where a speaker would use them, always clear from context. No stage-Irish, no "begorrah".'
    expect:
      Peig has never seen this stranger. She greets them in her own sharp, plain-spoken, kind voice,
      without presuming who they are or why they have come.
    v1:
      addressing: spoken_to
      attemptID: lab-attempt
      authoredFacts:
        - id: npc-1-knowledge-1
          source: npcs.json
          statement: Peig keeps the Letter Office and knows who has received news from beyond the parish.
        - id: npc-1-knowledge-2
          source: npcs.json
          statement: Mícheál and Róisín Connolly share the cottage west of the village.
      baseRevision:
        rawValue: 0
      contractVersion:
        major: 1
        minor: 0
      currentLocation:
        description:
          A narrow counter, pigeonholes of folded paper, and a small turf fire. The room smells
          of sealing wax, turf smoke, and damp wool. Through the window the weather is clear. It is morning.
        displayName: Letter Office
        id: place-2
        playable: true
      festival: null
      idempotencyKey: lab-logical-request:lab-attempt
      knownPeople:
        - displayName: Peig Hannigan
          id: npc-1
          role: Letter-office keeper
        - displayName: Mícheál Connolly
          id: npc-2
          role: Smallholder and cattle drover
        - displayName: Róisín Connolly
          id: npc-3
          role: Spinner and household bookkeeper
      knownPlaces:
        - description:
            A muddy road runs between low stone walls and a handful of whitewashed cottages.
            Smoke lifts from the clustered roofs. A lane leads east to the Letter Office and a rutted boreen
            runs west to Connolly Cottage. The clear sky hangs over the road. It is morning.
          displayName: Kilteevan Village
          id: place-1
          playable: true
        - description:
            A narrow counter, pigeonholes of folded paper, and a small turf fire. The room smells
            of sealing wax, turf smoke, and damp wool. Through the window the weather is clear. It is morning.
          displayName: Letter Office
          id: place-2
          playable: true
        - description:
            A peat fire warms the single room. A scrubbed table, a spinning wheel by the hearth,
            and rain-dark coats by the door. Outside the weather is clear. It is morning.
          displayName: Connolly Cottage
          id: place-3
          playable: true
