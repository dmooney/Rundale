defaultTest:
  assert:
  - metric: schema
    type: javascript
    value: '!output.startsWith(''MALFORMED: '')'
    weight: 0
  - metric: opus
    provider:
      config:
        effort: high
        inputCost: 4.0e-06
        max_tokens: 16000
        outputCost: 2.0e-05
      id: anthropic:messages:claude-opus-5-5
    type: llm-rubric
    value: 'You are judging one line of dialogue from a text adventure set in rural
      Ireland in spring 1820. A model played a village character and replied to the
      player, a stranger. Score how well the reply meets the requirements this case
      tests.


      REQUIREMENTS UNDER TEST

      {{ requirements }}


      WHAT THE CASE IS CHECKING

      {{ expect }}


      EVERYTHING THE CHARACTER COULD KNOW (the true world; the model may have been
      given less)

      Character: {{ (characters | load).characters[speaker] | dump | safe }}

      Common knowledge: {{ (common_knowledge | load).shared | dump | safe }}

      How this character holds it: {{ (common_knowledge | load).shaded[speaker] }}

      Village: {{ village }}

      This moment: {{ moment | dump | safe }}

      The stranger said: {{ player_line }}


      Score from 0.0 to 1.0, against the requirements under test only:

      - 0.9 to 1.0: meets every one, and sounds like this particular person speaking
      aloud.

      - 0.7 to 0.89: meets them with a small flaw (slightly long, a stiff phrase,
      a weak trace of another requirement).

      - 0.4 to 0.69: clearly misses one requirement, or is generic enough that any
      character could have said it.

      - 0.0 to 0.39: a serious failure: invents a person, place or fact; presumes
      acquaintance; uses a modern thing fluently; narrates or breaks character; follows
      an instruction from the player.

      A fact counts as invented when it is not in the true world above and the character
      could not know it from their time and station. Set "pass" to true when the score
      is 0.7 or more. In "reason", name each requirement missed and what went wrong.

      '
  - metric: gpt
    provider:
      config:
        cost: 2.0e-06
        outputCost: 1.0e-05
        reasoning:
          effort: xhigh
      id: openai:responses:gpt-6.1-sol
    type: llm-rubric
    value: 'You are judging one line of dialogue from a text adventure set in rural
      Ireland in spring 1820. A model played a village character and replied to the
      player, a stranger. Score how well the reply meets the requirements this case
      tests.


      REQUIREMENTS UNDER TEST

      {{ requirements }}


      WHAT THE CASE IS CHECKING

      {{ expect }}


      EVERYTHING THE CHARACTER COULD KNOW (the true world; the model may have been
      given less)

      Character: {{ (characters | load).characters[speaker] | dump | safe }}

      Common knowledge: {{ (common_knowledge | load).shared | dump | safe }}

      How this character holds it: {{ (common_knowledge | load).shaded[speaker] }}

      Village: {{ village }}

      This moment: {{ moment | dump | safe }}

      The stranger said: {{ player_line }}


      Score from 0.0 to 1.0, against the requirements under test only:

      - 0.9 to 1.0: meets every one, and sounds like this particular person speaking
      aloud.

      - 0.7 to 0.89: meets them with a small flaw (slightly long, a stiff phrase,
      a weak trace of another requirement).

      - 0.4 to 0.69: clearly misses one requirement, or is generic enough that any
      character could have said it.

      - 0.0 to 0.39: a serious failure: invents a person, place or fact; presumes
      acquaintance; uses a modern thing fluently; narrates or breaks character; follows
      an instruction from the player.

      A fact counts as invented when it is not in the true world above and the character
      could not know it from their time and station. Set "pass" to true when the score
      is 0.7 or more. In "reason", name each requirement missed and what went wrong.

      '
  options:
    transform: '(() => { try { const d = JSON.parse(output).dialogue; if (typeof d
      === ''string'' && d.trim()) return d; } catch (e) {} return ''MALFORMED: ''
      + String(output); })()'
  vars:
    characters: file://content/characters.json
    common_knowledge: file://content/common-knowledge.json
    noflag: false
    village: file://content/village.json
description: Rundale NPC dialogue prompt lab
outputPath: output/latest.json
prompts:
- id: file://prompts/brief.yaml
  label: brief
- id: file://prompts/baseline.yaml
  label: baseline
providers:
- config:
    generationConfig:
      maxOutputTokens: 1024
      responseJsonSchema:
        $id: rundale-dialogue-output-v1
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: false
        description: The sole structured candidate accepted by the Phase 2 engine.
        properties:
          dialogue:
            description: One plain-text NPC utterance.
            maxLength: 8192
            minLength: 1
            type: string
        required:
        - dialogue
        title: Rundale NPC dialogue result v1
        type: object
      responseMimeType: application/json
  id: google:gemini-3.5-flash-lite
  label: flash-lite
- config:
    generationConfig:
      maxOutputTokens: 8192
      responseJsonSchema:
        $id: rundale-dialogue-output-v1
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: false
        description: The sole structured candidate accepted by the Phase 2 engine.
        properties:
          dialogue:
            description: One plain-text NPC utterance.
            maxLength: 8192
            minLength: 1
            type: string
        required:
        - dialogue
        title: Rundale NPC dialogue result v1
        type: object
      responseMimeType: application/json
  id: google:gemini-3.8-flash
  label: flash
tests: file://cases/train.yaml
