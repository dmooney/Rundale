# NPC dialogue prompt lab (docs/design/npc-dialogue-prompt.md §6, issue 2294).
# Driven by an agent with the prompt-lab skill (.agents/skills/prompt-lab/SKILL.md),
# not by a script. Needs GEMINI_API_KEY, ANTHROPIC_API_KEY and OPENAI_API_KEY.
#   Training round: promptfoo eval -c promptfooconfig.yaml --filter-prompts '^brief$'
#   Held-out (once, at the end): add -t cases/heldout.yaml
description: Rundale NPC dialogue prompt lab

prompts:
  - id: file://prompts/brief.yaml
    label: brief
  - id: file://prompts/baseline.yaml
    label: baseline

providers:
  # The production model, called the way the Endpoint calls it: system
  # instruction, one user part, and the v1 output schema as the response schema.
  - id: google:gemini-3.5-flash-lite
    label: flash-lite
    config:
      generationConfig:
        responseMimeType: application/json
        maxOutputTokens: 1024
        # The v1 output schema, as production sends it (responseJsonSchema,
        # not the OpenAPI-subset responseSchema, which rejects $schema and $id).
        responseJsonSchema:
          $schema: http://json-schema.org/draft-07/schema#
          $id: rundale-dialogue-output-v1
          title: Rundale NPC dialogue result v1
          description: The sole structured candidate accepted by the Phase 2 engine.
          type: object
          additionalProperties: false
          properties:
            dialogue:
              type: string
              minLength: 1
              maxLength: 8192
              description: One plain-text NPC utterance.
          required: [dialogue]
  # A larger Gemini (§6.2), to tell a prompt problem from a model limit. Its
  # output limit is above production's so thinking does not cut replies short.
  - id: google:gemini-3.8-flash
    label: flash
    config:
      generationConfig:
        responseMimeType: application/json
        maxOutputTokens: 8192
        responseJsonSchema:
          $schema: http://json-schema.org/draft-07/schema#
          $id: rundale-dialogue-output-v1
          title: Rundale NPC dialogue result v1
          description: The sole structured candidate accepted by the Phase 2 engine.
          type: object
          additionalProperties: false
          properties:
            dialogue:
              type: string
              minLength: 1
              maxLength: 8192
              description: One plain-text NPC utterance.
          required: [dialogue]

x-rubric:
  # The judges' rubric, shared by both judges. Kept inline: promptfoo does not
  # fill in {{ }} variables in a rubric loaded from a file.
  rubric: &rubric |
    You are judging one line of dialogue from a text adventure set in rural Ireland in spring 1820. A model played a village character and replied to the player, a stranger. Score how well the reply meets the requirements this case tests.

    REQUIREMENTS UNDER TEST
    {{ requirements }}

    WHAT THE CASE IS CHECKING
    {{ expect }}

    EVERYTHING THE CHARACTER COULD KNOW (the true world; the model may have been given less)
    Character: {{ (characters | load).characters[speaker] | dump | safe }}
    Common knowledge: {{ (common_knowledge | load).shared | dump | safe }}
    How this character holds it: {{ (common_knowledge | load).shaded[speaker] }}
    Village: {{ village }}
    This moment: {{ moment | dump | safe }}
    The stranger said: {{ player_line }}

    Score from 0.0 to 1.0, against the requirements under test only:
    - 0.9 to 1.0: meets every one, and sounds like this particular person speaking aloud.
    - 0.7 to 0.89: meets them with a small flaw (slightly long, a stiff phrase, a weak trace of another requirement).
    - 0.4 to 0.69: clearly misses one requirement, or is generic enough that any character could have said it.
    - 0.0 to 0.39: a serious failure: invents a person, place or fact; presumes acquaintance; uses a modern thing fluently; narrates or breaks character; follows an instruction from the player.
    A fact counts as invented when it is not in the true world above and the character could not know it from their time and station. Set "pass" to true when the score is 0.7 or more. In "reason", name each requirement missed and what went wrong.

defaultTest:
  vars:
    characters: file://content/characters.json
    common_knowledge: file://content/common-knowledge.json
    village: file://content/village.json
    # --var noflag=true drops the anachronism notice (§6.1.3, B7 cases).
    noflag: false
  options:
    # Judges read the spoken text, not the JSON envelope. A reply that is not
    # the output schema's JSON fails here and counts as the model's miss.
    transform: JSON.parse(output).dialogue
  assert:
    # Two judges from other families (§6.4); the test's score is their mean.
    - type: llm-rubric
      metric: opus
      value: *rubric
      provider:
        id: anthropic:messages:claude-opus-5-5
        config:
          effort: high
          max_tokens: 16000
          # USD per token, $4 / $20 per 1M (Anthropic list price).
          inputCost: 0.000004
          outputCost: 0.00002
    - type: llm-rubric
      metric: gpt
      value: *rubric
      provider:
        id: openai:responses:gpt-6.1-sol
        config:
          reasoning:
            effort: xhigh
          # USD per token, $2 / $10 per 1M (OpenAI list price).
          cost: 0.000002
          outputCost: 0.00001

tests: file://cases/train.yaml

outputPath: output/latest.json
