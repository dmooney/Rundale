# rundale-bench v2 — gaeilge (irish): 5-axis Irish fluency. Configurable API judge.
description: rundale-bench-v2 gaeilge

env:
  RB_SLICE: gaeilge

prompts:
  - file://prompts/passthrough.py:get_prompt

providers:
  - id: file://providers/rundale_candidate.py
    label: candidate
    config:
      slice: gaeilge

tests: file://scripts/load_dataset.py:generate_tests

defaultTest:
  assert:
    - type: python
      value: file://assertions/rubric_judge.py
