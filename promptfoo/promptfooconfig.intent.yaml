# rundale-bench v2 — intent slice (deterministic: exact label + Jaccard). No judge.
description: rundale-bench-v2 intent

env:
  RB_SLICE: intent

prompts:
  - file://prompts/passthrough.py:get_prompt

providers:
  - id: file://providers/rundale_candidate.py
    label: candidate
    config:
      slice: intent

tests: file://scripts/load_dataset.py:generate_tests

defaultTest:
  assert:
    - type: python
      value: file://assertions/intent_assert.py
