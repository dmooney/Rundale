# rundale-bench v2 — multiturn slice (REQ 3). A scripted 4-6 turn conversation
# per record; the provider chains the candidate's own replies as assistant turns
# and the judge scores the full transcript on the four known failure modes
# (re-introduction, wrong name, premature farewell, persona/memory drift).
description: rundale-bench-v2 multiturn

env:
  RB_SLICE: multiturn

prompts:
  - file://prompts/passthrough.py:get_prompt

providers:
  - id: file://providers/rundale_candidate.py
    label: candidate
    config:
      slice: multiturn

tests: file://scripts/load_dataset.py:generate_tests

defaultTest:
  assert:
    - type: python
      value: file://assertions/rubric_judge.py
