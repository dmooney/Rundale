# rundale-bench v2 — perf probe. Streams dialogue prompts (perf.ids.json),
# capturing ttft_ms + tokens_per_second in provider metadata + native latency.
# No judge; scripts/report.py rolls up p50/p95, tok/s, error_rate, $/Mtok.
description: rundale-bench-v2 perf

env:
  RB_SLICE: dialogue
  RB_PERF: "1"

prompts:
  - file://prompts/passthrough.py:get_prompt

providers:
  - id: file://providers/rundale_candidate.py
    label: candidate
    config:
      slice: dialogue
      streaming: true

tests: file://scripts/load_dataset.py:generate_perf_tests
