# rundale-bench v2 — tier2-sim (t2): deterministic schema-valid + judge plausibility.
description: rundale-bench-v2 tier2-sim

env:
  RB_SLICE: tier2-sim

prompts:
  - file://prompts/passthrough.py:get_prompt

providers:
  - id: file://providers/rundale_candidate.py
    label: candidate
    config:
      slice: tier2-sim

tests: file://scripts/load_dataset.py:generate_tests

defaultTest:
  assert:
    - type: python
      value: file://assertions/schema_assert.py
    - type: python
      value: file://assertions/rubric_judge.py
