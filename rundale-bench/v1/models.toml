# rundale-bench candidate catalog (v1)
#
# Each [[model]] binds a logical model id to one or more providers that serve
# it. Quality judging runs once per model on the cheapest provider
# (min of price_in + 3*price_out); perf benchmarking sweeps every provider.
#
# provider_id / base_url / api_key_env mirror the engine provider presets in
# parish/crates/parish-config/providers/*.toml. Prices are USD per 1M tokens
# and are point-in-time estimates — verify against the provider before a
# leaderboard freeze. Local (MLX) targets are $0.
schema_version = 1

[[model]]
id = "qwen2.5-7b-mlx"
display_name = "Qwen2.5 7B Instruct (MLX 4-bit)"
params_b = 7
quant = "4bit"
family = "qwen2.5"
local_only = true
providers = [
  { provider_id = "vllmmlx", model_name_at_provider = "mlx-community/Qwen2.5-7B-Instruct-4bit", base_url = "http://localhost:8000/v1", price_in_per_mtok = 0.0, price_out_per_mtok = 0.0, max_context = 32768, notes = "vllm-mlx, spawn on demand (slot :8000)" },
]

